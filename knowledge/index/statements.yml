- id: APIB-077
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: В распределённых многослойных клиент-серверных системах возникновение исключений
    на клиенте, сервере, в канале связи или у промежуточного агента — норма жизни;
    клиенты API должны быть способны восстановить своё состояние после любого исключения.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/01-api-patterns-context.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
