  status: verified
  kind: fact
  text: 'детали применения паттернов декомпозиции на основе компонентов (глава 5).
    Идентификация компонентов и их размеров: выявить компоненты и оценить размер числом
    инструкций (не числом классов или строк); держать размеры сопоставимыми, в пределах
    одного-двух стандартных отклонений от среднего, разбивая слишком крупные. Объединение
    общих компонентов предметной области: общая предметная логика (рассылка уведомлений,
    форматирование, проверка, аудит) отличается от инфраструктурной (логирование,
    метрики, безопасность); признаки — общие классы или иерархии наследования у нескольких
    компонентов и общие суффиксы пространств имён (например, *.audit); такое выносится
    в общий компонент (например, ss.shared.audit), но не всё объединимо. Упрощение
    иерархии компонентов: делать иерархию плоской, чтобы компоненты были листовыми
    узлами пространства имён, без кода в нелистовых узлах. Определение зависимостей
    компонентов: анализ входящих и исходящих связей отвечает, можно ли разделить монолит,
    каков объём усилий и нужен ли рефакторинг. Создание предметных областей компонентов:
    группировать компоненты по функциональному признаку в области через пространства
    имён (область → подобласть → компонент). Создание предметных сервисов: вынести
    предметные области в отдельно развёртываемые крупномодульные предметные сервисы
    (архитектура на основе сервисов как промежуточный шаг перед более мелким дроблением).'
