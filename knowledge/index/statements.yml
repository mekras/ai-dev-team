  text: Чем дальше друг от друга отстоят два интегрируемых контекста, тем больше существует
    разнообразных конкурирующих абстракций и фреймворков для организации связи между
    ними, и тем сложнее выбор подхода к разработке API.
  artifact: ../md/01-Введение/04-intro-api-choosing-solutions.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
  evidence_strength: null
