  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Модель «read-your-writes» гарантирует клиенту видимость собственных изменений
    при чтении из реплик путём передачи серверу токена последней известной операции
    или версии ресурса.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/04-api-patterns-weak-consistency.local.md
