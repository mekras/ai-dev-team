  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: 'Задание партнёром произвольного URL webhook-а без строгого контроля создаёт
    риски атак: перехват потока данных партнёра, использование как канала DoS-атаки
