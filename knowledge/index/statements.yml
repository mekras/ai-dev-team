  status: ready_for_review
  kind: fact
  text: 'декомпозиция монолитных данных выполняется пятью этапами: этап 1 — анализ
    базы данных и создание предметных областей данных (отход от стиля «общая база
    данных», создающего тесную связь данных и сервисов); этап 2 — распределение таблиц
    по предметным областям с переносом в отдельные схемы (по ограниченным контекстам);
    этап 3 — разделение соединений так, чтобы каждый сервис обращался для чтения и
    записи только к своим схемам (самый сложный этап: межсхемные обращения разрешаются
    на уровне сервисов); этап 4 — перемещение схем на отдельные серверы баз данных
    (общая база — единый архитектурный квант, вредит масштабируемости и отказоустойчивости);
    этап 5 — переключение на независимые серверы: после репликации перенастроить соединения
    и удалить связи и схемы со старых серверов.'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-29'
  processing_status: null
  source_role: null
