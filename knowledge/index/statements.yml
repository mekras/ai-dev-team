- id: APIB-088
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Вероятность коллизии при слабой консистентности равна отношению времени, требуемого
    для получения актуального состояния (задержки репликации), к типичному интервалу,
    за который клиент повторяет операцию; для серверных клиентов, повторяющих запрос
    почти мгновенно, этот фон ошибок существенно выше, чем для клиентских приложений.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/04-api-patterns-weak-consistency.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
