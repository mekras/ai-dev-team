  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: 'Повсеместное применение асинхронности во внешнем API создаёт проблемы: единая
    точка отказа через общий сервис очередей, усложнение партнёрского кода из-за отсутствия
    гарантии времени обработки, риски потери или дублирования заданий и размытие смысла
    SLA.'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/05-api-patterns-async.local.md
