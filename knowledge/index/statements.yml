- id: APIB-074
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: API-first в техническом смысле означает, что контракт (формальная машиночитаемая
    спецификация, например Swagger/OpenAPI или .proto) фиксируется до реализации функциональности
    и определяет её.
  artifact: ../md/01-Введение/05-intro-api-first-approach.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
  evidence_strength: null
  confidence: null
  temporal_status: null
  corroboration: null
  limitations: null
- id: APIB-075
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Второй принцип API-first требует, что при обнаружении несоответствия между
    контрактом и его реализацией изменения вносятся в реализацию, а не в контракт,
    что защищает интересы партнёра-разработчика API.
  artifact: ../md/01-Введение/05-intro-api-first-approach.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
  evidence_strength: null
