  limitations: null
- id: APIB-076
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: limitation
  text: Гарантия, которую даёт API-first подход партнёрам, действует только при качественном
    дизайне API; если в спецификации допущены неисправимые ошибки, принцип приоритета
    контракта над реализацией придётся нарушить.
  artifact: ../md/01-Введение/05-intro-api-first-approach.local.md
  checked_at: '2026-07-17'
  processing_status: null
