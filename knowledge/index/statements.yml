  status: ready_for_review
  kind: fact
  text: 'Поллинг всегда требует компромисса между отзывчивостью и нагрузкой на систему:
    более редкие опросы увеличивают задержку и объём данных за итерацию, более частые
    — увеличивают долю бесполезных запросов и фоновый трафик.'
