  limitations: null
- id: APIB-079
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: 'При проектировании API нельзя полагаться на быстрое выполнение критических
    действий: многошаговые операции должны допускать продолжение с текущего шага,
    а операции с разделяемыми ресурсами — требовать механизмов блокировки.'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/01-api-patterns-context.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
  evidence_strength: null
  confidence: null
  temporal_status: null
