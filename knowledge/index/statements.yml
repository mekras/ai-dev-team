  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Непрозрачный (закодированный) курсор позволяет менять нижележащую технологию
    перебора данных и добавлять новые фильтры и сортировки без слома обратной совместимости,
    тогда как читаемый формат курсора вынуждает поддерживать его структуру как публичный
