  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Перебор изменяющихся списков через параметры limit/offset приводит к пропуску
    или дублированию элементов при изменении данных между запросами страниц, и API
    должно предоставлять способы перебора, гарантирующие получение полного и целостного
    набора данных.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/06-api-patterns-lists.local.md
