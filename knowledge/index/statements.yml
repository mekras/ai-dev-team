  status: ready_for_review
  kind: fact
  text: Для пополняемых списков с неизменяемыми данными перебор по монотонно растущему
    идентификатору или курсору (в отличие от offset) обеспечивает кэшируемость запросов
    и корректный обход новых и старых элементов.
