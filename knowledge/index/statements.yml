  kind: fact
  text: 'декомпозиция на основе компонентов выполняется шестью паттернами (глава 5):
    идентификация компонентов и их размеров (применяется первым); объединение общих
    компонентов предметной области (убрать дублирование общей бизнес-логики); упрощение
    иерархии компонентов (свернуть или расширить области и подобласти, чтобы файлы
    лежали в чётко определённых компонентах); определение зависимостей компонентов
    (выявить зависимости и оценить возможность и трудоёмкость перехода к распределённой
    архитектуре); создание предметных областей компонентов (объединить компоненты
    в логические группы, рефакторинг пространств имён или каталогов); создание предметных
    сервисов (физически вынести логические группы из монолита в отдельно развёртываемые
    предметные сервисы).'
