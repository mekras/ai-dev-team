  limitations: null
- id: APIB-078
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Чем больше партнёров подключено к API, тем выше вероятность логических ошибок
    использования API наряду с физическими сетевыми ошибками; проектирование должно
    предотвращать отказ в обслуживании одних партнёров из-за ошибок в коде других.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/01-api-patterns-context.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
  evidence_strength: null
  confidence: null
  temporal_status: null
