- id: APIB-090
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Асинхронная схема с созданием лёгкого задания вместо немедленного выполнения
    операции сокращает временной интервал возможной коллизии, потому что публикация
    факта «принятия к созданию» распространяется по репликам быстрее, чем полное выполнение
    операции.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/05-api-patterns-async.local.md
  checked_at: '2026-07-17'
  processing_status: null
