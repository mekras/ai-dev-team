  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: inference
  text: Рекомендуется ограничивать применение асинхронных интерфейсов только теми
    случаями, где они действительно критически важны, и по возможности встраивать
    асинхронную задачу в бизнес-логику как обычный статус ресурса, а не как отдельную
    сущность «задание».
