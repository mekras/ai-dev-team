  status: ready_for_review
  kind: inference
  text: Атомарный эндпойнт массовых изменений, содержащий хотя бы один неисправимый
    повторением невалидный подзапрос, блокирует выполнение и валидных подзапросов
    при каждом повторе, тогда как неатомарный сервер продолжает выполнять валидные
    операции; это указывает на нежелательность самих эндпойнтов массовых изменений
