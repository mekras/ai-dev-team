- id: APIB-080
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: 'Существуют два основных способа авторизации вызовов API: выполнение операций
    от имени специального аккаунта-«робота» либо авторизация вызывающей системы целиком
    (обычно через API-ключи, подписи или сертификаты); они различаются гранулярностью
    доступа.'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/02-api-patterns-aa.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
  evidence_strength: null
  confidence: null
  temporal_status: null
  corroboration: null
  limitations: null
- id: APIB-081
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Авторизация через аккаунт-«робота» требует специальных исключений из систем
    безопасности (обход капчи, куки, длинные токены с обновлением через refresh-токен),
    поскольку боты выполняют много параллельных запросов и не могут проходить обычные
    проверки.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/02-api-patterns-aa.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
  evidence_strength: null
  confidence: null
  temporal_status: null
  corroboration: null
  limitations: null
- id: APIB-082
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Авторизация по API-ключу проще во внедрении, чем схема с аккаунтами-роботами,
    и обычно позволяет ограничить набор доступных эндпойнтов, но более гранулярные
    ограничения на уровне бизнес-сущностей значительно сложнее в разработке и применяются
    редко.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/02-api-patterns-aa.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
  evidence_strength: null
  confidence: null
  temporal_status: null
  corroboration: null
  limitations: null
- id: APIB-083
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Если API идемпотентен, проблема повторной обработки одного и того же запроса
    решается автоматически, но не все реальные операции (например, создание нового
    заказа) идемпотентны сами по себе, и клиента нельзя полностью защитить от ручного
    повторного создания заказа пользователем.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/03-api-patterns-sync-strategies.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
