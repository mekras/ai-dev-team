- id: APIB-084
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Программные блокировки (пессимистичная синхронизация) в распределённых сетевых
    API создают непредсказуемые задержки, требуют отдельной высокопроизводительной
    подсистемы сильной консистентности и порождают риск «висящих» блокировок из-за
    некорректного партнёрского кода.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/03-api-patterns-sync-strategies.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
  evidence_strength: null
  confidence: null
  temporal_status: null
  corroboration: null
  limitations: null
- id: APIB-085
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Оптимистичное управление параллелизмом через версионирование ресурса (версия,
    дата модификации или ETag) прячет сложность синхронизации внутри системы, но требует
    от клиентов обязательной корректной обработки ошибок несовпадения версий как штатного
    поведения.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/03-api-patterns-sync-strategies.local.md
  checked_at: '2026-07-17'
  processing_status: null
  source_role: null
  evidence_strength: null
  confidence: null
  temporal_status: null
  corroboration: null
  limitations: null
- id: APIB-086
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Если API уже опубликован с определённой моделью консистентности, уровень консистентности
    нельзя понижать в дальнейшем (например, менять строгую консистентность на слабую),
    даже если поведение никогда не документировалось явно.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/04-api-patterns-weak-consistency.local.md
  checked_at: '2026-07-17'
  processing_status: null
