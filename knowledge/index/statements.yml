- id: APIB-100
  source_id: APIB
  item_id: APIB-md
  path: data/apib/items/md/statements.yml
  status: ready_for_review
  kind: fact
  text: Технологии доставки сообщений (push-уведомления, серверные очереди, webhook-и
    на веб-серверах партнёров) ограничены размером сообщения; выбор между передачей
