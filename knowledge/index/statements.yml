- id: SAHP-067
  source_id: SAHP
  item_id: SAHP-text
  path: data/sahp/items/text/statements.yml
  status: verified
  kind: fact
  text: 'для выбора типа базы данных книга сравнивает типы по семи характеристикам:
    кривая обучения; простота моделирования данных; масштабируемость и пропускная
    способность; доступность и устойчивость к секционированию; согласованность (ACID
    или BASE с конечной согласованностью); поддержка языков, зрелость, SQL и сообщество;
    приоритет чтения или записи. Рассмотрены восемь типов: реляционные (РСУБД, SQL,
    ACID, зрелость); «ключ — значение» (как хеш-таблица, быстрый доступ по ключу);
    документные (самоописывающиеся иерархии JSON/XML); колоночные (широкие столбцы,
    записи с разным числом столбцов); графовые (узлы и явные рёбра-отношения для анализа
    связей); NewSQL (масштабируемость NoSQL с ACID и SQL); облачные (Snowflake, Redshift,
    CosmosDB — меньше операционной нагрузки); временных рядов (последовательности
    точек во времени, IoT и мониторинг). Каждый продукт оптимизирован под свои компромиссы,
    поэтому тип выбирают под предметную область («парадокс выбора»).'
  artifact: software-architecture-hard-parts-ru.local.txt
  checked_at: '2026-07-28'
