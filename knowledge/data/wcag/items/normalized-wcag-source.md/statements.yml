  item_id: WCAG-normalized-WCAG-source.md
  kind: fact
  status: ready_for_review
  text: соответствие определяется выполнением проверяемых критериев успеха, входящих в руководства.
  excerpt: '_Критерии успеха_ (success criteria): проверяемые требования; именно их'
