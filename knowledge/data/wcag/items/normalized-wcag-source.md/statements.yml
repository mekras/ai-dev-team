- id: WCAG-002
  source_id: WCAG
  item_id: WCAG-normalized-WCAG-source.md
  kind: fact
  status: ready_for_review
  text: соответствие имеет три уровня — `A`, `AA`, `AAA`; уровень `AA является распространённым целевым
    уровнем.
  excerpt: уровень), `AAA` (высший).
  artifact: source.md
