  kind: fact
  status: ready_for_review
  text: WCAG организует требования доступности вокруг четырёх принципов — воспринимаемость, управляемость,
    понятность и надёжность.
  excerpt: '_Принципы_ (4): воспринимаемость, управляемость, понятность, надёжность (англ.'
  artifact: source.md
  checked_at: '2026-06-26'
  scope:
    section_title: Структура стандарта
    application: структура проверки доступности.
