- id: G272-002
  source_id: G272
  item_id: G272-normalized-G272-source.md
  kind: fact
  status: ready_for_review
  text: безотказность (reliability) — непрерывное сохранение работоспособности; готовность (availability)
    — способность выполнять функцию в заданный момент, зависящая от безотказности, ремонтопригодности
    и восстанавливаемости.
  excerpt: готовность (availability) — способность выполнять функцию в заданный момент;
  artifact: source.md
  checked_at: '2026-06-26'
  scope:
    section_title: Безотказность и готовность
    application: аналитик, архитектор.
  open_questions: []
- id: G272-003
  source_id: G272
  item_id: G272-normalized-G272-source.md
  kind: fact
  status: ready_for_review
  text: единичные показатели относятся к безотказности, ремонтопригодности, восстанавливаемости, долговечности,
    сохраняемости; готовность характеризуется коэффициентом готовности и не относится к единичным показателям.
  excerpt: 'единичные показатели: безотказности, ремонтопригодности, восстанавливаемости,'
  artifact: source.md
  checked_at: '2026-06-26'
  scope:
    section_title: Показатели надёжности
