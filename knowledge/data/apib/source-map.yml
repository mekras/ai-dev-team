publication_limitations:
- Полные тексты глав не хранятся в Git.
- Локальные Markdown-файлы и текстовая выгрузка исключены через *.local.*.
- В главах с развёрнутыми учебными примерами (например, декомпозиция `SearchBox`/`Composer`
  в разделе «SDK и UI-библиотеки», псевдокод в разделе «HTTP API и REST») утверждения обобщают
  логику примера, но сам код и пошаговые листинги не перенесены как отдельные трассируемые
  единицы; для точной трассировки к конкретному листингу нужно смотреть исходный `.local.md`.
- Разделы «Раздел I. Проектирование API» и «Раздел III. Обратная совместимость» не перепроверялись
  на предмет новых абзацев или примеров, добавленных при переиздании — сопоставление выполнено
  по совпадению заголовка и позиции главы, а не построчной сверкой текста со старой редакцией.
