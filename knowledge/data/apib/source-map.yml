summary:
  covered_chapters: 61
  pending_chapters: 0
  note: >-
    Все 61 глава актуальной редакции покрыты утверждениями (`APIB-001`–`APIB-185`).
    31 глава, совпавшая по названию и позиции со старой редакцией (2023-04-09),
    сопоставлена с уже извлечёнными утверждениями `APIB-001`–`APIB-071` без
    повторного извлечения из markdown. 30 глав, отсутствовавших в старой редакции
    (два новых введения и разделы «Паттерны дизайна API», «HTTP API и REST»,
    «SDK и UI-библиотеки»), извлечены заново `2026-07-17` как `APIB-072`–`APIB-185`.
  known_limitations:
    - >-
      В главах с развёрнутыми учебными примерами (например, декомпозиция
      `SearchBox`/`Composer` в разделе «SDK и UI-библиотеки», псевдокод в разделе
      «HTTP API и REST») утверждения обобщают логику примера, но сам код и
      пошаговые листинги не перенесены как отдельные трассируемые единицы; для
      точной трассировки к конкретному листингу нужно смотреть исходный
      `.local.md`.
    - >-
      Разделы «Раздел I. Проектирование API» и «Раздел III. Обратная
      совместимость» не перепроверялись на предмет новых абзацев или примеров,
      добавленных при переиздании — сопоставление выполнено по совпадению
      заголовка и позиции главы, а не построчной сверкой текста со старой
      редакцией.
