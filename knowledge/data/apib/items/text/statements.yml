    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Для пополняемых списков с неизменяемыми данными перебор по монотонно растущему идентификатору
      или курсору (в отличие от offset) обеспечивает кэшируемость запросов и корректный обход новых и старых
      элементов.
    excerpt:
      Первый формат запроса позволяет решить задачу (1)... Важно, что первый запрос при этом ещё
      и кэшируемый.
