    kind: fact
    status: ready_for_review
    text:
      Идемпотентное создание ресурса можно реализовать тремя способами — POST с токеном идемпотентности,
      PUT с идентификатором, сгенерированным клиентом, или схемой «черновик–подтверждение»; автор считает
      схему «черновик–подтверждение» предпочтительнее PUT с клиентским ID.
    excerpt:
      Метод (2) в современных системах используется редко, так как вынуждает доверять правильности
      генерации идентификатора заказа клиентом.
