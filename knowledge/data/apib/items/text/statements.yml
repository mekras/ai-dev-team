    text:
      Соответствие CRUD-операций HTTP-глаголам (POST — создание, GET — чтение, PUT/PATCH — редактирование,
      DELETE — удаление) — это лишь мнемоническое правило; глагол всегда следует выбирать по его семантике
      из стандарта, а не по мнемонике.
    excerpt: глагол следует выбирать по его семантике согласно стандарту, а не по мнемоническим правилам.
