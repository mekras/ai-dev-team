statements:
- id: APIB-001
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: книга определяет API по смыслу как формальное обязательство связывать между собой
    различные программируемые контексты, а не просто как «программный интерфейс приложений».
  excerpt: Формальное обязательство связывать между собой различные программируемые контексты.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: API как обязательство
    application: архитектор.
  open_questions: []
- id: APIB-002
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: потребителями API являются разработчики, поэтому поставщик не контролирует качество
    чужих инженерных решений, но проблемы будут приписывать ему.
  excerpt: С другой — качество инженерных решений заказчика вы не можете контролировать,
    и проблемы с водой, вызванные некомпетентностью подрядчика, неизбежно будут валить на
    вас.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Пользователи API — инженеры
    application: менеджер проекта.
  open_questions: []
- id: APIB-003
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: API одновременно мультиплицирует и возможности, и ошибки разработчика, что налагает
    повышенную ответственность.
  excerpt: Именно поэтому проектирование API налагает на вас несколько большую ответственность.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: API — мультипликатор ошибок
    application: архитектор.
  open_questions: []
- id: APIB-004
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: базовые критерии хорошего API — очевидность (как решить задачу), читаемость (правильный
    код по номенклатуре) и консистентность (действие по аналогии).
  excerpt: при обращении к каким-то незнакомым сущностям в API, разработчик может действовать
    по аналогии с уже известными ему концепциями API, и его код будет работать.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Три критерия качества
    application: разработчик.
  open_questions: []
- id: APIB-005
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: нелогичность и неконсистентность возникают не в начальном ядре API, а при его развитии
    и попытках сохранить совместимость.
  excerpt: Проблемы возникают, когда мы начинаем API развивать.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Главные проблемы — при развитии
    application: архитектор.
  open_questions: []
- id: APIB-006
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: проектирование «на будущее» означает избыточность интерфейсов и абстрагирования и
    оправдано, только если у API это будущее есть, иначе это оверинжиниринг.
  excerpt: Закладывание перспектив «на будущее» имеет смысл, только если это будущее у API
    есть, иначе это попросту оверинжиниринг.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Закладывание на будущее небесплатно
    application: архитектор.
  open_questions: []
- id: APIB-007
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: обратная совместимость — временно́е свойство качества, которое отличает разработку
    API от разработки ПО вообще.
  excerpt: Именно необходимость поддержания обратной совместимости отличает разработку API
    от разработки программного обеспечения вообще.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Совместимость как временна́я характеристика
    application: архитектор.
  open_questions: []
- id: APIB-008
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: выпуск обратно несовместимых версий — «налог» на потребителей; не следует ломать совместимость,
    если это возможно.
  excerpt: Если вы можете не ломать обратную совместимость — не ломайте её.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Слом совместимости — скрытый налог
    application: менеджер проекта.
  open_questions: []
- id: APIB-009
  source_id: APIB
  item_id: APIB-text
  kind: observation
  status: ready_for_review
  text: книга принимает версионирование semver и устанавливает эквивалентность «мажорная версия»
    = «обратно несовместимое изменение функциональности».
  excerpt: Выражения «мажорная версия API» и «версия API, содержащая обратно несовместимые
    изменения функциональности» тем самым следует считать эквивалентными.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Принятие semver
    application: разработчик.
  open_questions: []
- id: APIB-010
  source_id: APIB
  item_id: APIB-text
  kind: observation
  status: ready_for_review
  text: книга намеренно избегает слов «метод», «объект», «функция» в пользу нейтрального термина
    «сущность» как атомарной единицы функциональности.
  excerpt: 'Поэтому при написании этой книги мы намеренно избегали слов «метод», «объект»,
    «функция» и так далее, используя нейтральный термин «сущность», под которым понимается
    некоторая атомарная единица функциональности: класс, метод, объект, монада, прототип (нужное
    подчеркнуть).'
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Нейтральный термин «сущность»
    application: технический писатель.
  open_questions: []
- id: APIB-011
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: 'проектирование ведётся сверху вниз из четырёх шагов: определение области применения,
    разделение уровней абстракции, разграничение областей ответственности, описание конечных
    интерфейсов.'
  excerpt: 'Пирамида контекстов API Подход, который мы используем для проектирования, состоит
    из четырёх шагов: определение области применения; разделение уровней абстракции; разграничение
    областей ответственности; описание конечных интерфейсов.'
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Алгоритм проектирования из четырёх шагов
    application: архитектор.
  open_questions: []
- id: APIB-012
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: 'цена ошибки различна по уровням: плохое именование исправить просто, а неверное понимание
    назначения API — практически невозможно.'
  excerpt: Если исправить плохое именование довольно просто, то исправить неверное понимание
    того, зачем вообще нужен API, практически невозможно.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Цена ошибки растёт к вершине
    application: архитектор.
  open_questions: []
- id: APIB-013
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: книга предлагает четыре раза задать вопрос «какую проблему мы решаем?» с ударением
    на каждом слове, чтобы проверить нужность, компетентность и адекватность решения.
  excerpt: 'Определение области применения Ключевой вопрос, который вы должны задать себе
    четыре раза, выглядит так: какую проблему мы решаем?'
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Четырёхкратный вопрос о проблеме
    application: аналитик.
  open_questions: []
- id: APIB-014
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: выделение уровней абстракции преследует три цели — упрощение работы разработчика,
    поддержку обратной совместимости и интероперабельность.
  excerpt: Второй раздел посвящён развитию существующих API с сохранением обратной совместимости.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Цели уровней абстракции
    application: архитектор.
  open_questions: []
- id: APIB-015
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: одно и то же поле, означающее разное в разных интерфейсах, — признак смешения уровней
    абстракции.
  excerpt: Если при проектировании выясняется, что для выполнения того или иного действия
    требуется «перепрыгнуть» уровень абстракции, это явный признак того, что в проекте допущены
    ошибки.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Смешение уровней через общее поле
    application: разработчик.
  open_questions: []
- id: APIB-016
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: соблюдение изоляции уровней усложняет интерфейс, но никакая гибкость и расширяемость
    не бывают бесплатными.
  excerpt: 'И это в действительности так: важно понимать, что никакая гибкость, логичность,
    читабельность и расширяемость не бывает бесплатной.'
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Изоляция уровней небесплатна
    application: архитектор.
  open_questions: []
- id: APIB-017
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: дерево потоков данных — способ проверить разделение уровней и развивать большие API,
    которые невозможно удержать в памяти целиком.
  excerpt: Это упражнение не только полезно для проектирования, но и, помимо прочего, является
    единственным способом развивать большие (в смысле номенклатуры объектов) API.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Дерево потоков данных
    application: архитектор.
  open_questions: []
- id: APIB-018
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: каждый уровень иерархии — самостоятельная промежуточная предметная область, через
    которую задача переводится из одного контекста в другой.
  excerpt: Напомню, что из концепции уровней абстракции следует, что каждый уровень иерархии
    — это некоторая собственная промежуточная предметная область, ступенька, по которой мы
    переходим от описания задачи в терминах одного связываемого контекста («заказанный пользователем
    лунго») к описанию в терминах второго («задание кофемашине на выполнение указанной программы»).
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Каждый уровень — своя предметная область
    application: аналитик.
  open_questions: []
- id: APIB-019
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: модифицирующие операции (например, отмена заказа) на каждом уровне абстракции переформулируются
    и не должны «перепрыгивать» уровни.
  excerpt: Рассмотрим теперь, каким образом через наши уровни абстракции «прорастёт» операция
    отмены заказа.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Переформулирование операций по уровням
    application: разработчик.
  open_questions: []
- id: APIB-020
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: на этапе спроектированной номенклатуры следует встать на место разработчика и попробовать
    написать код, чтобы обнаружить неудобства API.
  excerpt: Сценарии использования На этом уровне, когда наш API уже в целом понятно устроен
    и спроектирован, мы должны поставить себя на место разработчика и попробовать написать
    код.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Проверка через сценарии использования
    application: аналитик.
  open_questions: []
- id: APIB-021
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: «нулевое правило» гласит, что правила — обобщение опыта и не должны применяться бездумно,
    если нет причины им следовать.
  excerpt: Правила не должны применяться бездумно Правило — это просто кратко сформулированное
    обобщение опыта.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Правила применять осмысленно
    application: разработчик.
  open_questions: []
- id: APIB-022
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: из названия сущности должно быть очевидно, что она делает и к каким побочным эффектам
    приводит; модифицирующих операций за GET быть не может.
  excerpt: Явное лучше неявного Из названия любой сущности должно быть очевидно, что она
    делает, и к каким побочным эффектам может привести её использование.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Явное лучше неявного
    application: разработчик.
  open_questions: []
- id: APIB-023
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: если сигнатуру можно понять неправильно, то по мере роста популярности API её неизбежно
    будет понимать неправильно всё больше партнёров.
  excerpt: 'Помните, что закон больших чисел работает против вас: если какую-то концепцию
    или сигнатуру вызова можно понять неправильно, значит, её неизбежно будет понимать неправильно
    всё большее число партнеров по мере роста популярности API.'
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Закон больших чисел против вас
    application: разработчик.
  open_questions: []
- id: APIB-024
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: сущности следует именовать конкретно, не экономить буквы и делать тип поля ясным из
    названия для лучшей читаемости.
  excerpt: Тип поля должен быть ясен из его названия Если поле называется recipe — мы ожидаем,
    что его значением является сущность типа Recipe.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Не экономить на именах
    application: разработчик.
  open_questions: []
- id: APIB-025
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: ошибки должны быть информативными; из интерфейса должны быть понятны не только решение
    задачи, но и возможные ошибки и исключения.
  excerpt: 'Ошибки должны быть информативными При написании кода разработчик неизбежно столкнётся
    с ошибками, в том числе самого примитивного толка: неправильный тип параметра или неверное
    значение.'
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Информативные ошибки
    application: разработчик.
  open_questions: []
- id: APIB-026
  source_id: APIB
  item_id: APIB-text
  kind: observation
  status: ready_for_review
  text: книга формулирует правило об идемпотентности операций и предостерегает от неатомарных
    операций.
  excerpt: Это правило также известно как «закон Миллера».
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Идемпотентность операций
    application: разработчик.
  open_questions: []
- id: APIB-027
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: не следует изобретать собственную безопасность; технические ограничения API нужно
    явно декларировать.
  excerpt: 'Декларируйте технические ограничения явно У любого поля в вашем API есть ограничения
    на допустимые значения: максимальная длина текста, объём прикладываемых документов в
    мегабайтах, разрешённые диапазоны цифровых значений.'
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Не изобретать безопасность
    application: специалист по безопасности.
  open_questions: []
- id: APIB-028
  source_id: APIB
  item_id: APIB-text
  kind: observation
  status: ready_for_review
  text: локализация и интернационализация продуктовых данных вынесены в отдельное правило
    проектирования интерфейсов.
  excerpt: 'При этом существует «золотое правило», применимое не только к API, но ко множеству
    других областей проектирования: человек комфортно удерживает в краткосрочной памяти
    7±2 различных объекта.'
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Локализация продуктовых данных
    application: технический писатель.
  open_questions: []
- id: APIB-029
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: обратная совместимость — свойство системы оставаться функционально корректной во времени,
    то есть код потребителей продолжает решать свою задачу.
  excerpt: Это значит, что код продолжает выполнять свою функцию — решать какую-то задачу
    пользователя.
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Совместимость = функциональная стабильность
    application: архитектор.
  open_questions: []
- id: APIB-030
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: срок поддержки совместимости следует увязывать с жизненными циклами приложений и LTS-периодами
    платформ (обычно несколько лет).
  excerpt: С нашей точки зрения длительность поддержания обратной совместимости следует
    увязывать с длительностью жизненных циклов приложений в соответствующей предметной
    области.
