  - id: APIB-100
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Технологии доставки сообщений (push-уведомления, серверные очереди, webhook-и на веб-серверах
      партнёров) ограничены размером сообщения; выбор между передачей полного состояния в теле уведомления
      и передачей только идентификатора события с последующим запросом за данными определяет надёжность
      отслеживания факта обработки события.
    excerpt: относительно невысокий размер сообщения... Наиболее проблематичная ситуация с push-уведомлениями.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/08-api-patterns-async-event-processing.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: лимиты размера сообщений
      application: архитектор.
