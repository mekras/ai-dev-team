  - id: APIB-101
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Если webhook-уведомление содержит только ссылку на событие, а не полные данные, необходимо различать
      статусы «сообщение доставлено» и «сообщение обработано», иначе теряется возможность мониторинга состояния
      интеграции партнёра.
    excerpt: нам необходимо иметь раздельные статусы — сообщение доставлено и сообщение обработано.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/08-api-patterns-async-event-processing.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: статусы обработки событий
      application: архитектор.
    open_questions: []
  - id: APIB-102
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Для эндпойнтов массовых изменений существует четыре базовых варианта гарантий (атомарность с идемпотентностью,
      идемпотентность без атомарности, отсутствие обеих гарантий, запрет перезапросов через ревизию ресурса),
      и каждый вариант влияет на то, какой код должен написать партнёр для обработки частичных сбоев.
    excerpt: Мы можем предложить по крайней мере четыре варианта.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/09-api-patterns-atomicity.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: варианты гарантий массовых операций
      application: архитектор.
    open_questions: []
  - id: APIB-103
    source_id: APIB
    item_id: APIB-md
    kind: inference
    status: ready_for_review
    text:
      Атомарный эндпойнт массовых изменений, содержащий хотя бы один неисправимый повторением невалидный
      подзапрос, блокирует выполнение и валидных подзапросов при каждом повторе, тогда как неатомарный сервер
      продолжает выполнять валидные операции; это указывает на нежелательность самих эндпойнтов массовых
      изменений как класса.
    excerpt:
      сколько бы он запрос ни повторял, валидные подзапросы не будут выполнены, если есть хоть один
      невалидный.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/09-api-patterns-atomicity.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: проблема атомарности массовых операций
      application: архитектор.
    open_questions: []
  - id: APIB-104
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Ответ сервера на массовую операцию должен содержать разбивку результатов по каждому подзапросу
      (список ошибок для атомарных эндпойнтов, список статусов для неатомарных), а группировка потенциально
      зависимых операций по общему идентификатору сущности снижает риск несогласованных частичных результатов.
    excerpt: ответы сервера должны включать разбивку по подзапросам.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/09-api-patterns-atomicity.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: детализация ответа массовой операции
      application: разработчик.
    open_questions: []
  - id: APIB-105
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Наивная схема частичных обновлений через специальные «магические» значения полей (передача только
      изменённых полей) перекладывает вычисление diff-а на клиента, не отменяет обязанность сервера уметь
      делать то же самое, и перестаёт работать корректно, когда результат зависит от порядка выполнения
      операций.
    excerpt: Все эти соображения, однако, на поверку оказываются мнимыми.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/10-api-patterns-partial-updates.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: наивные частичные обновления
      application: архитектор.
    open_questions: []
  - id: APIB-106
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Декомпозиция эндпойнта на независимые идемпотентные суб-эндпойнты с собственными адресами делает
      результат частичного обновления независимым от порядка выполнения операций и отделяет неизменяемые
      и вычисляемые поля от изменяемых.
    excerpt:
      разделить эндпойнт на несколько идемпотентных суб-эндпойнтов, имеющих независимые идентификаторы
      и/или адреса.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/10-api-patterns-partial-updates.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: декомпозиция частичных обновлений
      application: архитектор.
    open_questions: []
  - id: APIB-107
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Для «настоящего» совместного редактирования ресурса требуется отдельный гранулярный формат описания
      изменений (по одному действию клиента на операцию) с явной политикой разрешения конфликтов, а не перезапись
      объекта целиком.
    excerpt:
      Для «настоящего» совместного редактирования необходимо будет разработать отдельный формат описания
      изменений.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/10-api-patterns-partial-updates.local.md
