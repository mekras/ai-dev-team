  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: в хорошем API документированная и недокументированная части соотносятся примерно как
    1 к 10, и наружу нужно выставлять минимум функциональности.
  excerpt: В хорошем API эти две части соотносятся друг с другом примерно как надводная и
