      остальные способы имеют смысл только если номенклатура URL при смене мажорной версии остаётся прежней,
      а в этом случае нет и необходимости нарушать обратную совместимость.
    excerpt:
      все остальные способы сделать это имеют смысл, если и только если при изменении мажорной версии
      протокола номенклатура URL останется прежней.
