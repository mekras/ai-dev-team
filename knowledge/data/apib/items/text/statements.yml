    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Непрозрачный (закодированный) курсор позволяет менять нижележащую технологию перебора данных и
      добавлять новые фильтры и сортировки без слома обратной совместимости, тогда как читаемый формат курсора
      вынуждает поддерживать его структуру как публичный контракт.
    excerpt:
      предоставление читаемых курсоров будет означать, что вы теперь обязаны поддерживать формат
      курсора, даже если никогда его не документировали.
