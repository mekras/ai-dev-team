    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Де-факто стандартом стало возвращать 401 Unauthorized при отсутствии заголовков авторизации или
      невалидном токене, хотя это формально противоречит спецификации, требующей при 401 обязательно указывать
      заголовок WWW-Authenticate.
    excerpt:
      сегодня де-факто стандартом является возврат кода 401 Unauthorized при отсутствии заголовков
      авторизации или невалидном токене.
    artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/07-http-api-errors.local.md
    checked_at: "2026-07-17"
