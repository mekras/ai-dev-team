    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Перебор изменяющихся списков через параметры limit/offset приводит к пропуску или дублированию
      элементов при изменении данных между запросами страниц, и API должно предоставлять способы перебора,
      гарантирующие получение полного и целостного набора данных.
    excerpt:
      API должно предоставлять способы перебора больших списков, которые гарантируют клиенту получение
      полного и целостного набора данных.
