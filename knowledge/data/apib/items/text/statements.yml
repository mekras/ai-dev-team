  kind: fact
  status: ready_for_review
  text: каждую сущность стоит изначально рассматривать как частную реализацию более общего
    интерфейса, даже если альтернатив пока не предвидится.
  excerpt: 'Впрочем, ответ на него довольно очевиден: чтобы при абстрагировании не возникало
    неловких ситуаций, подобно рассмотренному нами примеру с полями рецептов, все сущности
    необходимо изначально рассматривать как частную реализацию некоторого более общего интерфейса,
    даже если никаких альтернативных реализаций в настоящий момент не предвидится.'
  artifact: the-api-book-ru.local.txt
