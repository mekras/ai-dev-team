    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Для доставки сообщений backend-to-backend в публичных API практически безальтернативной технологией
      является webhook (URL обратного вызова), тогда как дуплексные и низкоуровневые push-технологии применяются
      редко.
    excerpt:
      В случае публичных API практически безальтернативно такой технологией является использование
      URL обратного вызова (т.н. «webhook»).
    artifact: ../md/03-Раздел II. Паттерны дизайна API/07-api-patterns-push-vs-poll.local.md
