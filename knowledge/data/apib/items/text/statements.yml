  - id: APIB-111
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      В ресурсоориентированной (REST/HTTP) парадигме клиент не вызывает удалённую процедуру с параметрами,
      а указывает серверу адрес (локатор) ресурса, к которому применяется одна из ограниченного и стандартизированного
      набора операций.
    excerpt:
      клиент указывает серверу абстрактный адрес (локатор) фрагмента данных (ресурса), к которому
      он хочет применить операцию.
    artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/01-http-api-concepts.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: инверсия парадигмы RPC в REST
      application: архитектор.
    open_questions: []
  - id: APIB-112
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      В ресурсоориентированной парадигме клиент и сервер принципиально не имеют разделяемого состояния
      — все параметры, необходимые для выполнения операции, должны передаваться явно в каждом запросе.
    excerpt:
      клиент и сервер независимы и принципиально не имеют никакого разделяемого состояния; все необходимые
      для исполнения операции параметры должны быть переданы явно.
    artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/01-http-api-concepts.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: отсутствие разделяемого состояния
      application: архитектор.
    open_questions: []
  - id: APIB-113
    source_id: APIB
    item_id: APIB-md
    kind: observation
    status: ready_for_review
    text:
      Автор книги намеренно вводит собственный практический термин «HTTP API» / «JSON-over-HTTP API»
      (HTTP 1.1+, JSON, URL по стандарту, семантика вызовов по спецификации, отсутствие сознательных нарушений
      веб-стандартов) и избегает термина «REST API», поскольку у последнего нет консистентного определения.
    excerpt: Такое API мы будем для краткости называть просто «HTTP API» или «JSON-over-HTTP API».
    artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/01-http-api-concepts.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: рабочее определение «HTTP API»
      application: аналитик.
    open_questions: []
  - id: APIB-114
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      "Главный практический принцип разработки HTTP API, по утверждению автора: разрабатывать API так,
      чтобы промежуточные агенты (клиентские фреймворки, прокси, API-гейтвеи) могли читать и интерпретировать
      метаданные запроса и ответа без дополнительного кода."
    excerpt:
      лучше бы ты разрабатывал API так, чтобы промежуточные агенты могли читать и интерпретировать
      метаданные запроса и ответа.
    artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/02-http-api-pros-and-cons.local.md
    checked_at: "2026-07-17"
