  - id: APIB-099
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      "Задание партнёром произвольного URL webhook-а без строгого контроля создаёт риски атак: перехват
      потока данных партнёра, использование как канала DoS-атаки на сторонние сервисы или SSRF-атаки на
      инфраструктуру провайдера API, поэтому изменение адреса webhook-а требует усиленной авторизации (например,
      второго фактора)."
    excerpt:
      получив доступ к такой функциональности, злоумышленник может совершить множество весьма неприятных
      атак.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/07-api-patterns-push-vs-poll.local.md
