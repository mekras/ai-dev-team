  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: 'не следует легитимизировать серые зоны (недокументированные поля, использование непубличных
    особенностей в примерах): либо функциональность гарантируется всегда, либо на её существование
    не намекают.'
  excerpt: 'Однако достаточно часто разработчики API сами легитимизируют такие серые зоны,
    например: отдают недокументированные поля в ответах эндпойнтов; используют непубличную
    функциональность в примерах кода — в документации, в ответ на обращения пользователей,
    в выступлениях на конференциях и т.д.'
  artifact: the-api-book-ru.local.txt
