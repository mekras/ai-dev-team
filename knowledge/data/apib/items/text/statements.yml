      Рекомендация — всегда возвращать корневой JSON-объект в ответах эндпойнтов (не массив и не примитив),
      чтобы сохранить возможность обратно-совместимого расширения ответа новыми полями; для отсутствия данных
      лучше вернуть пустой объект или 204 No Content, а не пустую строку.
    excerpt: всегда возвращайте корневой JSON-объект в ответах эндпойтов.
