- id: APIB-045
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: 'аудитория API образует пирамиду: пользователи (основание), бизнес-заказчики (середина)
    и разработчики (вершина), интересы которых не всегда совпадают.'
  excerpt: 'С этой точки зрения целевая аудитория API — это некоторая пирамида, напоминающая
    пирамиду Маслоу: основание пирамиды — это пользователи; они ищут удовлетворение каких-то
    своих потребностей и не думают о технологиях; средний ярус пирамиды — бизнес-заказчики;
    соотнеся потребности пользователей с техническими возможностями, озвученными разработчиками,
    бизнес строит продукты; вершиной же пирамиды являются разработчики; именно они непосредственно
    работают с API, и они решают, какой из конкурирующих API им выбрать.'
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Пирамида аудитории API
    application: менеджер проекта.
  open_questions: []
