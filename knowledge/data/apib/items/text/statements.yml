  - id: APIB-110
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Первое поколение RPC-протоколов (Sun RPC, Java RMI, CORBA) жёстко привязывало клиента и сервер
      к конкретному языку и платформе; например, Sun RPC не работал под Windows, Java RMI требовал JVM,
      а заявленная кроссплатформенность CORBA плохо реализовывалась на практике.
    excerpt: RPC первого поколения диктуют выбор языка и платформы и для клиента, и для сервера.
    artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/01-http-api-concepts.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: ограничения RPC первого поколения
