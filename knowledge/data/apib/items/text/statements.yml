  - id: APIB-109
    source_id: APIB
    item_id: APIB-md
    kind: inference
    status: ready_for_review
    text:
      Рекомендуется включать в саму ошибку рекомендации по восстановлению отдельно для конечного пользователя
      и для разработчика, документировать некритичность отдельных ошибок и предусматривать понятное поведение
      по умолчанию для неизвестных клиенту ошибок, включая ошибки транспортного уровня без подсказок от
