    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Повтор запроса при получении 4xx обычно бессмыслен, за исключением 429 Too Many Requests и 404
      Not Found — последний по стандарту означает «состояние неопределённости» и допускает успешный повтор;
      для персистентного отсутствия ресурса используется отдельный код 410 Gone.
    excerpt:
      по стандарту имеет смысл «состояния неопределённости»... После получения ошибки 404, можно
      сделать повторный запрос.
    artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/07-http-api-errors.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: повторяемость ошибок 404 и 429
      application: разработчик.
