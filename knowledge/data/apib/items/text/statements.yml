statements:
  - id: APIB-001
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      книга определяет API по смыслу как формальное обязательство связывать между собой различные программируемые
      контексты, а не просто как «программный интерфейс приложений».
    excerpt: связывать программируемые контексты, поэтому ошибки проектирования и нарушение
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: API как обязательство
      application: архитектор.
    open_questions: []
  - id: APIB-002
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      потребителями API являются разработчики, поэтому поставщик не контролирует качество чужих инженерных
      решений, но проблемы будут приписывать ему.
    excerpt: "Глава 2 «Определение API»: смысловое определение API как формального"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Пользователи API — инженеры
      application: менеджер проекта.
    open_questions: []
  - id: APIB-003
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      API одновременно мультиплицирует и возможности, и ошибки разработчика, что налагает повышенную
      ответственность.
    excerpt: "Глава 2 «Определение API»: смысловое определение API как формального"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: API — мультипликатор ошибок
      application: архитектор.
    open_questions: []
  - id: APIB-004
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      базовые критерии хорошего API — очевидность (как решить задачу), читаемость (правильный код по
      номенклатуре) и консистентность (действие по аналогии).
    excerpt: "Глава 3 «Критерии качества API»: очевидность, читаемость, консистентность;"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Три критерия качества
      application: разработчик.
    open_questions: []
  - id: APIB-005
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      нелогичность и неконсистентность возникают не в начальном ядре API, а при его развитии и попытках
      сохранить совместимость.
    excerpt: "Глава 3 «Критерии качества API»: очевидность, читаемость, консистентность;"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Главные проблемы — при развитии
      application: архитектор.
    open_questions: []
  - id: APIB-006
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      проектирование «на будущее» означает избыточность интерфейсов и абстрагирования и оправдано, только
      если у API это будущее есть, иначе это оверинжиниринг.
    excerpt: "Глава 3 «Критерии качества API»: очевидность, читаемость, консистентность;"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Закладывание на будущее небесплатно
      application: архитектор.
    open_questions: []
  - id: APIB-007
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      обратная совместимость — временно́е свойство качества, которое отличает разработку API от разработки
      ПО вообще.
    excerpt: "Глава 4 «Обратная совместимость»: совместимость как временна́я характеристика"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Совместимость как временна́я характеристика
      application: архитектор.
    open_questions: []
  - id: APIB-008
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      выпуск обратно несовместимых версий — «налог» на потребителей; не следует ломать совместимость,
      если это возможно.
    excerpt: "Глава 4 «Обратная совместимость»: совместимость как временна́я характеристика"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Слом совместимости — скрытый налог
      application: менеджер проекта.
    open_questions: []
  - id: APIB-009
    source_id: APIB
    item_id: APIB-text
    kind: observation
    status: ready_for_review
    text:
      книга принимает версионирование semver и устанавливает эквивалентность «мажорная версия» = «обратно
      несовместимое изменение функциональности».
    excerpt: "Глава 5 «О версионировании»: semver и эквивалентность «мажорная версия» ="
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Принятие semver
      application: разработчик.
    open_questions: []
  - id: APIB-010
    source_id: APIB
    item_id: APIB-text
    kind: observation
    status: ready_for_review
    text:
      книга намеренно избегает слов «метод», «объект», «функция» в пользу нейтрального термина «сущность»
      как атомарной единицы функциональности.
    excerpt: "Глава 6 «Условные обозначения и терминология»: нейтральный термин «сущность»,"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Нейтральный термин «сущность»
      application: технический писатель.
    open_questions: []
  - id: APIB-011
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      "проектирование ведётся сверху вниз из четырёх шагов: определение области применения, разделение
      уровней абстракции, разграничение областей ответственности, описание конечных интерфейсов."
    excerpt: "Глава 7 «Пирамида контекстов API»: алгоритм проектирования из четырёх шагов"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Алгоритм проектирования из четырёх шагов
      application: архитектор.
    open_questions: []
  - id: APIB-012
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      "цена ошибки различна по уровням: плохое именование исправить просто, а неверное понимание назначения
      API — практически невозможно."
    excerpt: "Глава 7 «Пирамида контекстов API»: алгоритм проектирования из четырёх шагов"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Цена ошибки растёт к вершине
      application: архитектор.
    open_questions: []
  - id: APIB-013
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      книга предлагает четыре раза задать вопрос «какую проблему мы решаем?» с ударением на каждом слове,
      чтобы проверить нужность, компетентность и адекватность решения.
    excerpt: "Глава 8 «Определение области применения»: четырёхкратный вопрос «какую"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Четырёхкратный вопрос о проблеме
      application: аналитик.
    open_questions: []
  - id: APIB-014
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      выделение уровней абстракции преследует три цели — упрощение работы разработчика, поддержку обратной
      совместимости и интероперабельность.
    excerpt: "Глава 9 «Разделение уровней абстракции»: цели изоляции уровней и инструмент"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Цели уровней абстракции
      application: архитектор.
    open_questions: []
  - id: APIB-015
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text: одно и то же поле, означающее разное в разных интерфейсах, — признак смешения уровней абстракции.
    excerpt: "Глава 9 «Разделение уровней абстракции»: цели изоляции уровней и инструмент"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Смешение уровней через общее поле
      application: разработчик.
    open_questions: []
  - id: APIB-016
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      соблюдение изоляции уровней усложняет интерфейс, но никакая гибкость и расширяемость не бывают
      бесплатными.
    excerpt: "Глава 9 «Разделение уровней абстракции»: цели изоляции уровней и инструмент"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Изоляция уровней небесплатна
      application: архитектор.
    open_questions: []
  - id: APIB-017
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      дерево потоков данных — способ проверить разделение уровней и развивать большие API, которые невозможно
      удержать в памяти целиком.
    excerpt: "Глава 9 «Разделение уровней абстракции»: цели изоляции уровней и инструмент"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Дерево потоков данных
      application: архитектор.
    open_questions: []
  - id: APIB-018
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      каждый уровень иерархии — самостоятельная промежуточная предметная область, через которую задача
      переводится из одного контекста в другой.
    excerpt: "Глава 10 «Разграничение областей ответственности»: формулирование назначения"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Каждый уровень — своя предметная область
      application: аналитик.
    open_questions: []
  - id: APIB-019
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      модифицирующие операции (например, отмена заказа) на каждом уровне абстракции переформулируются
      и не должны «перепрыгивать» уровни.
    excerpt: "Глава 10 «Разграничение областей ответственности»: формулирование назначения"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Переформулирование операций по уровням
      application: разработчик.
    open_questions: []
  - id: APIB-020
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      на этапе спроектированной номенклатуры следует встать на место разработчика и попробовать написать
      код, чтобы обнаружить неудобства API.
    excerpt: "Глава 10 «Разграничение областей ответственности»: формулирование назначения"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Проверка через сценарии использования
      application: аналитик.
    open_questions: []
  - id: APIB-021
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      «нулевое правило» гласит, что правила — обобщение опыта и не должны применяться бездумно, если
      нет причины им следовать.
    excerpt: "Глава 11 «Описание конечных интерфейсов»: набор практических правил именования"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Правила применять осмысленно
      application: разработчик.
    open_questions: []
  - id: APIB-022
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      из названия сущности должно быть очевидно, что она делает и к каким побочным эффектам приводит;
      модифицирующих операций за GET быть не может.
    excerpt: "Глава 11 «Описание конечных интерфейсов»: набор практических правил именования"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Явное лучше неявного
      application: разработчик.
    open_questions: []
  - id: APIB-023
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      если сигнатуру можно понять неправильно, то по мере роста популярности API её неизбежно будет
      понимать неправильно всё больше партнёров.
    excerpt: "Глава 11 «Описание конечных интерфейсов»: набор практических правил именования"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Закон больших чисел против вас
      application: разработчик.
    open_questions: []
  - id: APIB-024
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      сущности следует именовать конкретно, не экономить буквы и делать тип поля ясным из названия для
      лучшей читаемости.
    excerpt: "Глава 11 «Описание конечных интерфейсов»: набор практических правил именования"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Не экономить на именах
      application: разработчик.
    open_questions: []
  - id: APIB-025
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      ошибки должны быть информативными; из интерфейса должны быть понятны не только решение задачи,
      но и возможные ошибки и исключения.
    excerpt: "Глава 11 «Описание конечных интерфейсов»: набор практических правил именования"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Информативные ошибки
      application: разработчик.
    open_questions: []
  - id: APIB-026
    source_id: APIB
    item_id: APIB-text
    kind: observation
    status: ready_for_review
    text: книга формулирует правило об идемпотентности операций и предостерегает от неатомарных операций.
    excerpt: "Глава 11 «Описание конечных интерфейсов»: набор практических правил именования"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Идемпотентность операций
      application: разработчик.
    open_questions: []
  - id: APIB-027
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text: не следует изобретать собственную безопасность; технические ограничения API нужно явно декларировать.
    excerpt: "Глава 11 «Описание конечных интерфейсов»: набор практических правил именования"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Не изобретать безопасность
      application: специалист по безопасности.
    open_questions: []
  - id: APIB-028
    source_id: APIB
    item_id: APIB-text
    kind: observation
    status: ready_for_review
    text:
      локализация и интернационализация продуктовых данных вынесены в отдельное правило проектирования
      интерфейсов.
    excerpt: "Глава 11 «Описание конечных интерфейсов»: набор практических правил именования"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Локализация продуктовых данных
      application: технический писатель.
    open_questions: []
  - id: APIB-029
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      обратная совместимость — свойство системы оставаться функционально корректной во времени, то есть
      код потребителей продолжает решать свою задачу.
    excerpt: "Глава 13 «Постановка проблемы обратной совместимости»: совместимость как"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Совместимость = функциональная стабильность
      application: архитектор.
    open_questions: []
  - id: APIB-030
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      срок поддержки совместимости следует увязывать с жизненными циклами приложений и LTS-периодами
      платформ (обычно несколько лет).
    excerpt: "Глава 13 «Постановка проблемы обратной совместимости»: совместимость как"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Длительность увязана с жизненным циклом платформ
      application: менеджер проекта.
    open_questions: []
  - id: APIB-031
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      "совместимость подрывают три процесса: фрагментация клиентов, размывание предметной области и
      нижележащей платформы."
    excerpt: "Глава 13 «Постановка проблемы обратной совместимости»: совместимость как"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Три процесса размывания
      application: архитектор.
    open_questions: []
  - id: APIB-032
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      в хорошем API документированная и недокументированная части соотносятся примерно как 1 к 10, и
      наружу нужно выставлять минимум функциональности.
    excerpt: "Глава 14 «О ватерлинии айсберга»: гигиенический минимум публичной поверхности"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Правило айсберга 1:10
      application: архитектор.
    open_questions: []
  - id: APIB-033
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
    text:
      каждое публичное поле, метод и сущность — продуктовое решение, которое должно иметь веские причины
      для документирования.
    excerpt: "Глава 14 «О ватерлинии айсберга»: гигиенический минимум публичной поверхности"
    artifact: ../source/normalized-source.md
    checked_at: "2026-06-24"
    scope:
      section_title: Каждая публичная сущность — продуктовое решение
      application: менеджер проекта.
    open_questions: []
  - id: APIB-034
    source_id: APIB
    item_id: APIB-text
    kind: fact
    status: ready_for_review
