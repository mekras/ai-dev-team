  excerpt: Вопрос этот не праздный, поскольку, по опыту автора настоящей книги, именно отсутствие
    у руководителей продукта и маркетологов экспертизы в области работы с API и есть самая
    большая проблема развития API.
  artifact: the-api-book-ru.local.txt
