    text:
      Рекомендуется ограничивать применение асинхронных интерфейсов только теми случаями, где они действительно
      критически важны, и по возможности встраивать асинхронную задачу в бизнес-логику как обычный статус
      ресурса, а не как отдельную сущность «задание».
    excerpt:
      мы всё же склонны рекомендовать ограничиться асинхронными интерфейсами только там, где они
      действительно критически важны.
