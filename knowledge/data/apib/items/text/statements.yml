    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Для полного описания ошибки каждому из трёх акторов (пользователь, клиент, сервер) нужны ответы
      на четыре вопроса — кто допустил ошибку, можно ли исправить её простым повтором запроса, можно ли
      исправить переформулированием запроса, и что делать, если исправить нельзя вовсе.
    excerpt: Каждому из этих акторов необходимо понимать ответ на четыре вопроса относительно ошибки.
    artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/07-http-api-errors.local.md
    checked_at: "2026-07-17"
