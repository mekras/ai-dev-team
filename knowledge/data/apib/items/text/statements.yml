    kind: fact
    status: ready_for_review
    text:
      Каждый HTTP-глагол однозначно определяет семантику операции и её побочные свойства; GET безопасен
      и идемпотентен без тела, PUT заменяет ресурс целиком и идемпотентен с телом, DELETE удаляет ресурс
      и идемпотентен без тела, POST не безопасен и не идемпотентен с телом, PATCH частично модифицирует
      ресурс и не безопасен и не идемпотентен с телом.
    excerpt: GET... Возвращает представление ресурса... PUT... Заменяет (полностью перезаписывает) ресурс.
    artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/04-http-api-requests-semantics.local.md
    checked_at: "2026-07-17"
    scope:
