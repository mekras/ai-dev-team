    text:
      Использование привычных, устоявшихся механизмов взаимодействия — важная составляющая качества
      API; изобретать собственный стандарт вместо существующего рекомендуется только при явных и очевидных
      преимуществах нового подхода.
    excerpt: Использование привычных механизмов — важная составляющая качества API.
