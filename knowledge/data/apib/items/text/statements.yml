  status: ready_for_review
  text: правила расширения узнаются как принципы SOLID, поскольку API по определению является
    контрактом; книга добавляет к ним понятие уровней абстракции.
  excerpt: 'В этих правилах нет ничего особенно нового: в них легко опознаются принципы архитектуры
    SOLID — что неудивительно, поскольку SOLID концентрируется на контрактно-ориентированном
    подходе к разработке, а API по определению и есть контракт.'
