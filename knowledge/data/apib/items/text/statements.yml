    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      "Поллинг всегда требует компромисса между отзывчивостью и нагрузкой на систему: более редкие опросы
      увеличивают задержку и объём данных за итерацию, более частые — увеличивают долю бесполезных запросов
      и фоновый трафик."
    excerpt:
      поллинг всегда заставляет искать компромисс между отзывчивостью, производительностью и пропускной
      способностью системы.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/07-api-patterns-push-vs-poll.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: компромиссы поллинга
