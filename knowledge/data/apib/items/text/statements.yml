  - id: APIB-073
    source_id: APIB
    item_id: APIB-md
    kind: observation
    status: ready_for_review
    text:
      Чем дальше друг от друга отстоят два интегрируемых контекста, тем больше существует разнообразных
      конкурирующих абстракций и фреймворков для организации связи между ними, и тем сложнее выбор подхода
      к разработке API.
    excerpt:
      Чем дальше отстоят друг от друга два контекста, тем большее количество разнообразных абстракций
      и фреймворков работы с ними будет существовать.
    artifact: ../md/01-Введение/04-intro-api-choosing-solutions.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: выбор парадигмы интеграции
      application: архитектор.
    open_questions: []
  - id: APIB-074
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      API-first в техническом смысле означает, что контракт (формальная машиночитаемая спецификация,
      например Swagger/OpenAPI или .proto) фиксируется до реализации функциональности и определяет её.
    excerpt:
      контракт разрабатывается и фиксируется в виде спецификации до того, как функциональность непосредственно
      реализована.
    artifact: ../md/01-Введение/05-intro-api-first-approach.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: API-first подход
      application: архитектор.
    open_questions: []
  - id: APIB-075
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Второй принцип API-first требует, что при обнаружении несоответствия между контрактом и его реализацией
      изменения вносятся в реализацию, а не в контракт, что защищает интересы партнёра-разработчика API.
    excerpt:
      если обнаруживается несоответствие контракта и его имплементации, изменения вносятся в имплементацию,
      а не в контракт.
    artifact: ../md/01-Введение/05-intro-api-first-approach.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: API-first подход
      application: архитектор.
    open_questions: []
  - id: APIB-076
    source_id: APIB
    item_id: APIB-md
    kind: limitation
    status: ready_for_review
    text:
      Гарантия, которую даёт API-first подход партнёрам, действует только при качественном дизайне API;
      если в спецификации допущены неисправимые ошибки, принцип приоритета контракта над реализацией придётся
      нарушить.
    excerpt: работает эта гарантия только в условиях качественного дизайна API.
    artifact: ../md/01-Введение/05-intro-api-first-approach.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: ограничения API-first
      application: архитектор.
    open_questions: []
  - id: APIB-077
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      В распределённых многослойных клиент-серверных системах возникновение исключений на клиенте, сервере,
      в канале связи или у промежуточного агента — норма жизни; клиенты API должны быть способны восстановить
      своё состояние после любого исключения.
    excerpt:
      в случае возникновения исключения любого рода клиенты API должны быть способны восстановить
      своё состояние.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/01-api-patterns-context.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: устойчивость к исключениям
      application: архитектор.
    open_questions: []
  - id: APIB-078
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Чем больше партнёров подключено к API, тем выше вероятность логических ошибок использования API
      наряду с физическими сетевыми ошибками; проектирование должно предотвращать отказ в обслуживании одних
      партнёров из-за ошибок в коде других.
    excerpt:
      вы должны ожидать не только физических ошибок, связанных с состоянием сети или перегруженностью
      сервера, но и логических, связанных с неправильным использованием API.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/01-api-patterns-context.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: устойчивость к ошибкам партнёров
      application: архитектор.
    open_questions: []
  - id: APIB-079
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      "При проектировании API нельзя полагаться на быстрое выполнение критических действий: многошаговые
      операции должны допускать продолжение с текущего шага, а операции с разделяемыми ресурсами — требовать
      механизмов блокировки."
    excerpt: при проектировании API нельзя полагаться на то, что критические действия выполнятся быстро.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/01-api-patterns-context.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: непредсказуемые задержки
      application: архитектор.
    open_questions: []
  - id: APIB-080
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      "Существуют два основных способа авторизации вызовов API: выполнение операций от имени специального
      аккаунта-«робота» либо авторизация вызывающей системы целиком (обычно через API-ключи, подписи или
      сертификаты); они различаются гранулярностью доступа."
    excerpt:
      по большому счёту, есть два основных способа авторизовать выполнение некоторой операции через
      API.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/02-api-patterns-aa.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: способы авторизации API
      application: архитектор.
    open_questions: []
  - id: APIB-081
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Авторизация через аккаунт-«робота» требует специальных исключений из систем безопасности (обход
      капчи, куки, длинные токены с обновлением через refresh-токен), поскольку боты выполняют много параллельных
      запросов и не могут проходить обычные проверки.
    excerpt: Необходимо сделать для пользователей-роботов исключения из почти всех систем безопасности.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/02-api-patterns-aa.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: авторизация через роботов
      application: разработчик.
    open_questions: []
  - id: APIB-082
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Авторизация по API-ключу проще во внедрении, чем схема с аккаунтами-роботами, и обычно позволяет
      ограничить набор доступных эндпойнтов, но более гранулярные ограничения на уровне бизнес-сущностей
      значительно сложнее в разработке и применяются редко.
    excerpt: второй подход с авторизацией клиентов через API-ключи более прост в имплементации.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/02-api-patterns-aa.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: авторизация по API-ключу
      application: разработчик.
    open_questions: []
  - id: APIB-083
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Если API идемпотентен, проблема повторной обработки одного и того же запроса решается автоматически,
      но не все реальные операции (например, создание нового заказа) идемпотентны сами по себе, и клиента
      нельзя полностью защитить от ручного повторного создания заказа пользователем.
    excerpt: Если ваш API идемпотентен, то никакой повторной обработки запроса не будет происходить.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/03-api-patterns-sync-strategies.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: идемпотентность и синхронизация
      application: архитектор.
    open_questions: []
  - id: APIB-084
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Программные блокировки (пессимистичная синхронизация) в распределённых сетевых API создают непредсказуемые
      задержки, требуют отдельной высокопроизводительной подсистемы сильной консистентности и порождают
      риск «висящих» блокировок из-за некорректного партнёрского кода.
    excerpt: подобного рода подход крайне редко реализуется в распределённых сетевых API.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/03-api-patterns-sync-strategies.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: программные блокировки
      application: архитектор.
    open_questions: []
  - id: APIB-085
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Оптимистичное управление параллелизмом через версионирование ресурса (версия, дата модификации
      или ETag) прячет сложность синхронизации внутри системы, но требует от клиентов обязательной корректной
      обработки ошибок несовпадения версий как штатного поведения.
    excerpt:
      Достоинством оптимистичного управления параллелизмом является, таким образом, возможность «спрятать»
      сложную в имплементации и масштабировании часть «под капотом».
    artifact: ../md/03-Раздел II. Паттерны дизайна API/03-api-patterns-sync-strategies.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: оптимистичное управление параллелизмом
      application: архитектор.
    open_questions: []
  - id: APIB-086
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Если API уже опубликован с определённой моделью консистентности, уровень консистентности нельзя
      понижать в дальнейшем (например, менять строгую консистентность на слабую), даже если поведение никогда
      не документировалось явно.
    excerpt:
      если вы уже предоставляете эндпойнт, реализующий какую-то модель консистентности, вы не можете
      понизить её уровень.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/04-api-patterns-weak-consistency.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: слабая консистентность
      application: архитектор.
    open_questions: []
  - id: APIB-087
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Модель «read-your-writes» гарантирует клиенту видимость собственных изменений при чтении из реплик
      путём передачи серверу токена последней известной операции или версии ресурса.
    excerpt:
      имплементация модели «read-your-writes» — а именно гарантии, что клиент всегда «видит» те изменения,
      которые сам же и внёс.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/04-api-patterns-weak-consistency.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: read-your-writes
      application: архитектор.
    open_questions: []
  - id: APIB-088
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Вероятность коллизии при слабой консистентности равна отношению времени, требуемого для получения
      актуального состояния (задержки репликации), к типичному интервалу, за который клиент повторяет операцию;
      для серверных клиентов, повторяющих запрос почти мгновенно, этот фон ошибок существенно выше, чем
      для клиентских приложений.
    excerpt:
      "Математически вероятность получения ошибки выражается довольно просто: она равна отношению
      периода времени, требуемого для получения актуального состояния к типичному периоду времени, за который
      пользователь перезапускает приложение и повторяет заказ."
    artifact: ../md/03-Раздел II. Паттерны дизайна API/04-api-patterns-weak-consistency.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: риски событийной консистентности
      application: архитектор.
    open_questions: []
  - id: APIB-089
    source_id: APIB
    item_id: APIB-md
    kind: observation
    status: ready_for_review
    text:
      Постоянный фоновый уровень ошибок, вызванный слабой консистентностью, затрудняет обнаружение реальных,
      независимых от неё ошибок в коде, поскольку осложняет настройку мониторинга, отделяющего эти два класса
      ошибок друг от друга.
    excerpt: на фоне имеющихся ошибок найти её весьма непросто.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/04-api-patterns-weak-consistency.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: маскировка ошибок фоном
      application: архитектор.
    open_questions: []
  - id: APIB-090
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Асинхронная схема с созданием лёгкого задания вместо немедленного выполнения операции сокращает
      временной интервал возможной коллизии, потому что публикация факта «принятия к созданию» распространяется
      по репликам быстрее, чем полное выполнение операции.
    excerpt:
      наша цель — максимально быстро распространить по репликам знание о том, что заказ *принят к
      созданию*.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/05-api-patterns-async.local.md
    checked_at: "2026-07-17"
    scope:
      section_title: асинхронные задания
      application: архитектор.
    open_questions: []
  - id: APIB-091
    source_id: APIB
    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      "Повсеместное применение асинхронности во внешнем API создаёт проблемы: единая точка отказа через
      общий сервис очередей, усложнение партнёрского кода из-за отсутствия гарантии времени обработки, риски
      потери или дублирования заданий и размытие смысла SLA."
    excerpt:
      несмотря на свою привлекательность, повсеместная асинхронность влечёт за собой ряд достаточно
      неприятных проблем.
