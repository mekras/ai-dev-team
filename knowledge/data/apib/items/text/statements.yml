- id: APIB-052
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: бизнес лояльнее к предложениям, особенно бесплатным, но ему гораздо сложнее объяснить
    преимущества API как концепции.
  excerpt: 'Взаимодействие с бизнес-аудиторией Основные принципы работы с партнёрами несколько
    парадоксально полностью противоположны принципам взаимодействия с разработчиками: с одной
    стороны, партнёры гораздо более лояльно и зачастую даже с энтузиазмом относятся к предлагаемым
    им возможностям, особенно бесплатным; с другой стороны, донести до бизнес-аудитории смысл
    вашего предложения несравненно сложнее, чем до разработчиков, так как представителям бизнеса
    в целом гораздо сложнее объяснить, в чём вообще состоят преимущества API (как концепции)
    по сравнению с сервисом для конечных пользователей.'
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Парадокс работы с бизнесом
    application: менеджер проекта.
  open_questions: []
- id: APIB-053
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: нет смысла поставлять один API; следует говорить о наборе продуктов сразу в двух измерениях
    (горизонтальном и вертикальном).
  excerpt: 'Линейка сервисов API Важное правило управления продуктом API, которое любой
    достаточно крупный поставщик API довольно быстро для себя откроет, звучит так: нет смысла
    поставлять всего лишь один какой-то API; есть смысл говорить о наборе продуктов, причём
    сразу в двух измерениях.'
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: Нужна линейка, а не один API
    application: менеджер проекта.
  open_questions: []
- id: APIB-054
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: сырое число пользователей и партнёров — необходимый минимум, но не KPI; KPI следует
    выставлять по количеству целевых действий, коррелирующих с монетизацией.
  excerpt: 'Кратко суммируем вышесказанное: считать прямые показатели, такие как общее число
    пользователей и партнёров, — необходимый минимум, без которого сложно двигаться дальше,
    но это не KPI; KPI для продукта API должен выставлять исходя из количества целевых действий,
    которые производятся через платформу; определение «целевых действий» зависит от модели
    монетизации и может быть как прямолинейным «количество платящих клиентов» или «количество
    кликов по рекламе», так и достаточно опосредованным и эвристическим типа «количество посетителей
    блога команды разработки».'
  artifact: the-api-book-ru.local.txt
  checked_at: '2026-06-24'
  scope:
    section_title: KPI — целевые действия, а не сырые цифры
    application: аналитик.
  open_questions: []
- id: APIB-055
  source_id: APIB
  item_id: APIB-text
  kind: fact
  status: ready_for_review
  text: нагрузку на API сложно предсказать (одна строка кода партнёра может её резко повысить),
    поэтому запас прочности API должен быть существенно выше, чем у пользовательских сервисов.
