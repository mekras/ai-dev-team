    item_id: APIB-md
    kind: fact
    status: ready_for_review
    text:
      Доставка push-уведомлений на устройство конечного пользователя никогда не достигает 100% успешности,
      из-за чего рекомендуется комбинированная модель, в которой push служит триггером для внеочередного
      поллинга, а не заменяет его полностью.
    excerpt:
      процент успешной доставки уведомлений никогда не равен 100; потери сообщений могут достигать
      десятков процентов.
    artifact: ../md/03-Раздел II. Паттерны дизайна API/07-api-patterns-push-vs-poll.local.md
