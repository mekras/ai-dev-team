      PUT /url должен приводить к тому же состоянию ресурса, повторный DELETE /url должен оставлять его
      удалённым, а последующий GET /url должен возвращать представление, консистентное с последним PUT,
      или 404/410 после DELETE.
    excerpt: URL запроса является его ключом идемпотентности... DELETE /url обязан удалить указанный ресурс.
    artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/04-http-api-requests-semantics.local.md
