  text: каждое публичное поле, метод и сущность — продуктовое решение, которое должно иметь
    веские причины для документирования.
  excerpt: 'Можно сформулировать и так: каждая сущность, каждое поле, каждый метод в публичном
    API — это продуктовое решение.'
  artifact: the-api-book-ru.local.txt
