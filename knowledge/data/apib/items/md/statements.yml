source_id: APIB
item_id: APIB-md
statements:
- id: APIB-072
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Использование привычных, устоявшихся механизмов взаимодействия — важная составляющая
    качества API; изобретать собственный стандарт вместо существующего рекомендуется только
    при явных и очевидных преимуществах нового подхода.
  excerpt: Использование привычных механизмов — важная составляющая качества API.
  artifact: ../md/01-Введение/04-intro-api-choosing-solutions.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: выбор подхода к разработке API
    application: архитектор.
  open_questions: []
- id: APIB-073
  source_id: APIB
  item_id: APIB-md
  kind: observation
  status: ready_for_review
  text: Чем дальше друг от друга отстоят два интегрируемых контекста, тем больше существует
    разнообразных конкурирующих абстракций и фреймворков для организации связи между ними,
    и тем сложнее выбор подхода к разработке API.
  excerpt: Чем дальше отстоят друг от друга два контекста, тем большее количество разнообразных
    абстракций и фреймворков работы с ними будет существовать.
  artifact: ../md/01-Введение/04-intro-api-choosing-solutions.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: выбор парадигмы интеграции
    application: архитектор.
  open_questions: []
- id: APIB-074
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: API-first в техническом смысле означает, что контракт (формальная машиночитаемая спецификация,
    например Swagger/OpenAPI или .proto) фиксируется до реализации функциональности и определяет
    её.
  excerpt: 'Если же мы говорим об API-first подходе в техническом смысле, то мы имеем в виду
    следующее: **контракт, т.е.'
  artifact: ../md/01-Введение/05-intro-api-first-approach.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: API-first подход
    application: архитектор.
  open_questions: []
- id: APIB-075
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Второй принцип API-first требует, что при обнаружении несоответствия между контрактом
    и его реализацией изменения вносятся в реализацию, а не в контракт, что защищает интересы
    партнёра-разработчика API.
  excerpt: 'Но, как легко заметить, работает эта гарантия только в условиях качественного
    дизайна API: если в фазе разработки спецификации были допущены неисправимые ошибки, то
    второй принцип придётся нарушить.'
  artifact: ../md/01-Введение/05-intro-api-first-approach.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: API-first подход
    application: архитектор.
  open_questions: []
- id: APIB-076
  source_id: APIB
  item_id: APIB-md
  kind: limitation
  status: ready_for_review
  text: Гарантия, которую даёт API-first подход партнёрам, действует только при качественном
    дизайне API; если в спецификации допущены неисправимые ошибки, принцип приоритета контракта
    над реализацией придётся нарушить.
  excerpt: 'Но, как легко заметить, работает эта гарантия только в условиях качественного
    дизайна API: если в фазе разработки спецификации были допущены неисправимые ошибки, то
    второй принцип придётся нарушить.'
  artifact: ../md/01-Введение/05-intro-api-first-approach.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: ограничения API-first
    application: архитектор.
  open_questions: []
- id: APIB-077
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: В распределённых многослойных клиент-серверных системах возникновение исключений на
    клиенте, сервере, в канале связи или у промежуточного агента — норма жизни; клиенты API
    должны быть способны восстановить своё состояние после любого исключения.
  excerpt: В частности, в наиболее интересном нам кейсе распределённых многослойных клиент-серверных
    систем возникновение исключения на клиенте (например, потеря контекста в результате перезапуска
    приложения), на сервере (конвейер выполнения запроса выбросил исключение на каком-то шаге),
    в канале связи (соединение полностью или частично потеряно) или любом промежуточном агенте
    (например, промежуточный веб-сервер не дождался ответа бэкенда и вернул ошибку гейтвея)
    — норма жизни, и все системы должны проектироваться таким образом, что **в случае возникновения
    исключения любого рода клиенты API должны быть способны восстановить своё состояние**
    и продолжить корректно работать.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/01-api-patterns-context.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: устойчивость к исключениям
    application: архитектор.
  open_questions: []
- id: APIB-078
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Чем больше партнёров подключено к API, тем выше вероятность логических ошибок использования
    API наряду с физическими сетевыми ошибками; проектирование должно предотвращать отказ
    в обслуживании одних партнёров из-за ошибок в коде других.
  excerpt: Иными словами, **вы должны ожидать не только физических ошибок, связанных с состоянием
    сети или перегруженностью сервера, но и логических, связанных с неправильным использованием
    API** (и, в частности, предотвращать возможный отказ в обслуживании одних партнёров из-за
    ошибок в коде других партнёров).
  artifact: ../md/03-Раздел II. Паттерны дизайна API/01-api-patterns-context.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: устойчивость к ошибкам партнёров
    application: архитектор.
  open_questions: []
- id: APIB-079
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: 'При проектировании API нельзя полагаться на быстрое выполнение критических действий:
    многошаговые операции должны допускать продолжение с текущего шага, а операции с разделяемыми
    ресурсами — требовать механизмов блокировки.'
  excerpt: 'В частности: * для операций, состоящих из нескольких шагов, необходимо предусматривать
    возможность при необходимости продолжить выполнение с текущего шага, а не с начала; *
    для операций с разделяемыми ресурсами необходимо предусматривать механизмы блокировки
    ресурса.'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/01-api-patterns-context.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: непредсказуемые задержки
    application: архитектор.
  open_questions: []
- id: APIB-080
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: 'Существуют два основных способа авторизации вызовов API: выполнение операций от имени
    специального аккаунта-«робота» либо авторизация вызывающей системы целиком (обычно через
    API-ключи, подписи или сертификаты); они различаются гранулярностью доступа.'
  excerpt: 'Если отвлечься от технических деталей имплементации (в отношении которых мы ещё
    раз настоятельно рекомендуем не изобретать велосипед и использовать стандартные подходы
    и протоколы безопасности), то, по большому счёту, есть два основных способа авторизовать
    выполнение некоторой операции через API: * завести в системе специальный тип аккаунта
    «робот» и выполнять операции от имени робота; * авторизовать вызывающую систему (бэкенд
    или клиентское приложение) как единое целое (обычно для аутентификации таких вызовов используются
    API-ключи, подписи или сертификаты).'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/02-api-patterns-aa.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: способы авторизации API
    application: архитектор.
  open_questions: []
- id: APIB-081
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Авторизация через аккаунт-«робота» требует специальных исключений из систем безопасности
    (обход капчи, куки, длинные токены с обновлением через refresh-токен), поскольку боты
    выполняют много параллельных запросов и не могут проходить обычные проверки.
  excerpt: 'Необходимо сделать для пользователей-роботов исключения из почти всех систем безопасности:
    * роботы выполняют намного больше запросов, чем обычные люди, и могут делать это в параллель
    (в том числе с разных IP-адресов, расположенных в разных дата-центрах); * роботы не принимают
    куки и не могут решить капчу; * робота нельзя профилактически разлогинить и/или инвалидировать
    его токен (это чревато простоем бизнеса партнёра), поэтому для роботов часто приходится
    изобретать токены с большим временем жизни и/или процедуру обновления токена, для чего
    приходится вводить дополнительный refresh-токен.'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/02-api-patterns-aa.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: авторизация через роботов
    application: разработчик.
  open_questions: []
- id: APIB-082
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Авторизация по API-ключу проще во внедрении, чем схема с аккаунтами-роботами, и обычно
    позволяет ограничить набор доступных эндпойнтов, но более гранулярные ограничения на уровне
    бизнес-сущностей значительно сложнее в разработке и применяются редко.
  excerpt: партнёр может выставить для ключа набор эндпойнтов, которые можно с ним вызывать),
    но более гранулярные системы (когда ключу выставляются ещё и ограничения на уровне бизнес-сущностей)
    уже намного сложнее в разработке и применяются редко.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/02-api-patterns-aa.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: авторизация по API-ключу
    application: разработчик.
  open_questions: []
- id: APIB-083
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Если API идемпотентен, проблема повторной обработки одного и того же запроса решается
    автоматически, но не все реальные операции (например, создание нового заказа) идемпотентны
    сами по себе, и клиента нельзя полностью защитить от ручного повторного создания заказа
    пользователем.
  excerpt: 'Однако не все операции в реальном мире идемпотентны в принципе: например, создание
    нового заказа такой операцией не является.'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/03-api-patterns-sync-strategies.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: идемпотентность и синхронизация
    application: архитектор.
  open_questions: []
- id: APIB-084
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Программные блокировки (пессимистичная синхронизация) в распределённых сетевых API
    создают непредсказуемые задержки, требуют отдельной высокопроизводительной подсистемы
    сильной консистентности и порождают риск «висящих» блокировок из-за некорректного партнёрского
    кода.
  excerpt: '#### Программные блокировки Первый подход — очевидным образом перенести стандартные
    примитивы синхронизации на уровень API.'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/03-api-patterns-sync-strategies.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: программные блокировки
    application: архитектор.
  open_questions: []
- id: APIB-085
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Оптимистичное управление параллелизмом через версионирование ресурса (версия, дата
    модификации или ETag) прячет сложность синхронизации внутри системы, но требует от клиентов
    обязательной корректной обработки ошибок несовпадения версий как штатного поведения.
  excerpt: Вместо версий можно использовать дату последней модификации ресурса (что в целом
    гораздо менее надёжно ввиду неидеальной синхронизации часов в разных узлах системы; не
    забывайте, как минимум, сохранять дату с максимально доступной точностью!) либо идентификаторы
    сущности (ETag).
  artifact: ../md/03-Раздел II. Паттерны дизайна API/03-api-patterns-sync-strategies.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: оптимистичное управление параллелизмом
    application: архитектор.
  open_questions: []
- id: APIB-086
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Если API уже опубликован с определённой моделью консистентности, уровень консистентности
    нельзя понижать в дальнейшем (например, менять строгую консистентность на слабую), даже
    если поведение никогда не документировалось явно.
  excerpt: Если вы уже предоставляете эндпойнт, реализующий какую-то модель консистентности,
    вы не можете понизить её уровень (в частности, сменить строгую консистентность на слабую),
    даже если вы никогда не документировали текущее поведение явно (мы обсудим это требование
    детальнее в главе [«О ватерлинии айсберга»](#back-compat-iceberg-waterline) раздела «Обратная
    совместимость»).
  artifact: ../md/03-Раздел II. Паттерны дизайна API/04-api-patterns-weak-consistency.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: слабая консистентность
    application: архитектор.
  open_questions: []
- id: APIB-087
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Модель «read-your-writes» гарантирует клиенту видимость собственных изменений при
    чтении из реплик путём передачи серверу токена последней известной операции или версии
    ресурса.
  excerpt: 'getOngoingOrders({ …, // Передаём идентификатор // последней операции // совершённой
    клиентом last_known_order_id: order.id }) ``` В качестве такого токена может выступать,
    например: * идентификатор или идентификаторы последних модифицирующих операций, выполненных
    клиентом; * последняя известная клиенту версия ресурса (дата изменения, ETag).'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/04-api-patterns-weak-consistency.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: read-your-writes
    application: архитектор.
  open_questions: []
- id: APIB-088
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Вероятность коллизии при слабой консистентности равна отношению времени, требуемого
    для получения актуального состояния (задержки репликации), к типичному интервалу, за который
    клиент повторяет операцию; для серверных клиентов, повторяющих запрос почти мгновенно,
    этот фон ошибок существенно выше, чем для клиентских приложений.
  excerpt: 'Математически вероятность получения ошибки выражается довольно просто: она равна
    отношению периода времени, требуемого для получения актуального состояния к типичному
    периоду времени, за который пользователь перезапускает приложение и повторяет заказ.'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/04-api-patterns-weak-consistency.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: риски событийной консистентности
    application: архитектор.
  open_questions: []
- id: APIB-089
  source_id: APIB
  item_id: APIB-md
  kind: observation
  status: ready_for_review
  text: Постоянный фоновый уровень ошибок, вызванный слабой консистентностью, затрудняет обнаружение
    реальных, независимых от неё ошибок в коде, поскольку осложняет настройку мониторинга,
    отделяющего эти два класса ошибок друг от друга.
  excerpt: Поднять уровень слабой консистентности до read-your-writes можно, если предложить
    клиенту самому передать токен, описывающий его последние изменения.
  artifact: ../md/03-Раздел II. Паттерны дизайна API/04-api-patterns-weak-consistency.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: маскировка ошибок фоном
    application: архитектор.
  open_questions: []
- id: APIB-090
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Асинхронная схема с созданием лёгкого задания вместо немедленного выполнения операции
    сокращает временной интервал возможной коллизии, потому что публикация факта «принятия
    к созданию» распространяется по репликам быстрее, чем полное выполнение операции.
  excerpt: 'getOngoingOrders(); // → { tasks: [task] } ``` Здесь мы предполагаем, что создание
    задания требует минимальных проверок и не ожидает исполнения каких-то длительных операций,
    а потому происходит много быстрее.'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/05-api-patterns-async.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: асинхронные задания
    application: архитектор.
  open_questions: []
- id: APIB-091
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: 'Повсеместное применение асинхронности во внешнем API создаёт проблемы: единая точка
    отказа через общий сервис очередей, усложнение партнёрского кода из-за отсутствия гарантии
    времени обработки, риски потери или дублирования заданий и размытие смысла SLA.'
  excerpt: Имплементация аналогичной асинхронности во внешнем API является самым простым способом
    обойти возникающие проблемы (читай, те же непредсказуемые и возможно очень большие задержки
    выполнения операций).
