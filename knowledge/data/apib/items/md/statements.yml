- id: APIB-154
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Автор разделяет клиентские инструменты на два вида — «SDK» как обёртки над клиент-серверным
    API и «UI-библиотеки» как компоненты, с которыми конечный пользователь взаимодействует
    напрямую; UI-библиотека может как включать обёртку над API, так и быть чистым графическим
    движком.
  excerpt: '**NB**: вообще говоря, UI-библиотека может как включать в себя обёртку над клиент-серверным
    API, так и предоставлять чистый API к графическому движку.'
