- id: APIB-110
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Первое поколение RPC-протоколов (Sun RPC, Java RMI, CORBA) жёстко привязывало клиента
    и сервер к конкретному языку и платформе; например, Sun RPC не работал под Windows, Java
    RMI требовал JVM, а заявленная кроссплатформенность CORBA плохо реализовывалась на практике.
  excerpt: Первые широко распространённые RPC-протоколы — такие как упомянутый Sun RPC, Java
    RMI[ref Remote Method Invocation (RMI)](https://www.oracle.com/java/technologies/javase/remote-method-invocation-home.html),
    CORBA[ref CORBA](https://www.corba.org/) — чётко следовали парадигме.
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/01-http-api-concepts.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: ограничения RPC первого поколения
    application: архитектор.
