- id: APIB-111
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: В ресурсоориентированной (REST/HTTP) парадигме клиент не вызывает удалённую процедуру
    с параметрами, а указывает серверу адрес (локатор) ресурса, к которому применяется одна
    из ограниченного и стандартизированного набора операций.
  excerpt: 'В новой парадигме отношения между данными и операциями над ними переворачиваются
    с ног на голову: * клиент не вызывает процедуры на сервере с передачей параметров — клиент
    указывает серверу абстрактный адрес (локатор) фрагмента данных (*ресурса*), к которому
    он хочет применить операцию; * сам список операций лимитирован и стандартизирован, семантика
    их чётко определена в стандарте; * клиент и сервер независимы и *принципиально* не имеют
    никакого разделяемого состояния; все необходимые для исполнения операции параметры должны
    быть переданы явно; * между клиентом и сервером может находиться множество промежуточных
    узлов сети (прокси и гейтвеев), что не влияет на протокол; * если все важные параметры
    операции (в частности, идентификаторы ресурсов) включены в URL, данные легко можно шардировать
    без серьёзных затрат; * сервер размечает параметры кэширования передаваемых данных (представления
    ресурсов), клиент (и промежуточные прокси) имеют право кэшировать данные в соответствии
    с разметкой.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/01-http-api-concepts.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: инверсия парадигмы RPC в REST
    application: архитектор.
  open_questions: []
