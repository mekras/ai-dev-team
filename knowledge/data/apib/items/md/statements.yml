  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Рекомендуется ограничивать применение асинхронных интерфейсов только теми случаями,
    где они действительно критически важны, и по возможности встраивать асинхронную задачу
    в бизнес-логику как обычный статус ресурса, а не как отдельную сущность «задание».
  excerpt: Поэтому, при всей привлекательности идеи, мы всё же склонны рекомендовать ограничиться
    асинхронными интерфейсами только там, где они действительно критически важны (как в примере
    выше, где они снижают вероятность коллизий), и при этом иметь отдельные очереди для каждого
    кейса.
