- id: APIB-164
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: UI-компоненты в отличие от клиент-серверного API разделяют общий ресурс — экран приложения
    и внимание пользователя, — поэтому одновременные асинхронные вызовы (например, повторный
    SearchBox.search) требуют явной политики арбитража, а не независимой обработки каждого
    вызова.
  excerpt: Но с UI-компонентами этот подход не работает, поскольку все они, в конечном итоге,
    разделяют один общий ресурс — экран приложения и внимание пользователя на нём.
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/03-sdk-ui-components.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Общее владение ресурсами
    application: архитектор.
  open_questions: []
- id: APIB-165
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Автор рекомендует трижды подумать перед тем, как предоставлять возможность программной
    настройки UI-компонентов, поскольку полное разделение ответственности между бизнес-логикой,
    внешним видом и UX-поведением может утроить иерархию абстракций SDK.
  excerpt: 'Универсальный совет здесь ровно один: *три раза подумайте прежде чем предоставлять
    возможность программной настройки UI-компонентов*.'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/03-sdk-ui-components.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Цена кастомизации UI-компонентов
    application: архитектор.
