- id: APIB-169
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Единственное решение проблемы декомпозиции кастомизируемых UI-компонентов — ввести
    дополнительный уровень абстракции («composer»), который не зависит от конкретной реализации
    дочерних компонентов и модерирует потоки данных и событий между ними, хотя это существенно
    усложняет взаимодействие.
  excerpt: 'Введём дополнительный уровень абстракции (назовём его, скажем, «composer»), который
    позволит нам модерировать потоки данных: ```typescript class SearchBoxComposer implements
    ISearchBoxComposer { // Ответственность `composer`-а состоит в: // 1.'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/04-sdk-decomposing.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Composer как мостик абстракции
    application: архитектор.
  open_questions: []
- id: APIB-170
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Ограничение путей взаимодействия компонентов так, что подкомпоненты только читают
    состояние, а контроллер только получает уведомления о действиях пользователя, фактически
    приводит к паттерну Model-View-Controller (MVC).
  excerpt: '### MV*-фреймворки Очевидным способом сделать менее сложными многослойные схемы,
    подобные описанным в предыдущей главе, является ограничение возможных путей взаимодействия
    между компонентами.'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/05-sdk-mv-frameworks.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Возникновение MVC
    application: архитектор.
  open_questions: []
- id: APIB-171
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Общая черта всех MV*-фреймворков — модель полностью и детерминировано определяет внешний
    вид и состояние UI-компонента, а визуальные представления не могут менять модель напрямую
    и взаимодействуют только через контроллер.
  excerpt: '#### Паттерн «модель» Общая черта, объединяющая все MV*-фреймворки — это требование
    к сущности «модель» (некоторого набора данных) *полностью детерминировано определять*
    внешний вид и состояние UI-компонента.'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/05-sdk-mv-frameworks.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Паттерн модель
    application: архитектор.
  open_questions: []
- id: APIB-172
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Требование полностью описывать состояние компонента в модели (включая, например, ход
    выполнения анимаций) приводит к тому, что модель содержит данные всех уровней абстракции
    и плохо поддаётся версионированию и сериализации при изменении реализации подкомпонентов.
  excerpt: Если задаться целью *полностью* описать состояние компонента, то мы обязаны внести
    в него и такие данные, как выполняющиеся сейчас анимации и даже процент их выполнения.
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/05-sdk-mv-frameworks.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Проблема полной модели
    application: архитектор.
