  text: 'Поллинг всегда требует компромисса между отзывчивостью и нагрузкой на систему: более
    редкие опросы увеличивают задержку и объём данных за итерацию, более частые — увеличивают
    долю бесполезных запросов и фоновый трафик.'
  excerpt: 'При всей простоте, поллинг всегда заставляет искать компромисс между отзывчивостью,
    производительностью и пропускной способностью системы: * чем длиннее интервал между последовательными
    запросами, тем больше будет задержка между изменением состояния на сервере и получением
    информации об этом на клиенте, и тем потенциально большим будет объём данных, которые
    необходимо будет передать за одну итерацию; * с другой стороны, чем этот интервал короче,
    тем большее количество запросов будет совершаться зря, т.к.'
