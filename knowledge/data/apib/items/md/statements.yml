  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Непрозрачный (закодированный) курсор позволяет менять нижележащую технологию перебора
    данных и добавлять новые фильтры и сортировки без слома обратной совместимости, тогда
    как читаемый формат курсора вынуждает поддерживать его структуру как публичный контракт.
  excerpt: Лучше возвращать курсоры зашифрованными или хотя бы в таком виде, который не вызывал
    бы желания его раскодировать и поэкспериментировать с параметрами.) В подходе с курсорами
    вы сможете без нарушения обратной совместимости добавлять новые фильтры и виды сортировки
    — при условии, конечно, что вы сможете организовать хранение данных таким образом, чтобы
    перебор с курсором работал однозначно.
