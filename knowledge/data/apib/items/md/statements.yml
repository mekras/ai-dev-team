- id: APIB-173
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: В паттерне Model-View-Presenter (MVP) Мартина Фаулера presenter в отличие от контроллера
    MVC не имеет собственного состояния и лишь вычисляет данные для показа из модели, что
    позволяет отделить семантичные данные модели от низкоуровневых данных представления.
  excerpt: По мысли Фаулера собственного состояния у presenter-а нет (за исключением, возможно,
    кэшей и замыканий), он только вычисляет данные, необходимые для показа визуального интерфейса,
    из данных модели.
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/05-sdk-mv-frameworks.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: MVP по Фаулеру
    application: архитектор.
