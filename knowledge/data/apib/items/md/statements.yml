- id: APIB-182
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Если одно и то же свойство компонента (например, iconUrl) может наследоваться сразу
    по нескольким иерархиям — данным и настройкам отображения — нужны явные правила приоритета,
    иначе разработчику придётся копировать значения вручную, что порождает дублирующийся и
    запутывающий код.
  excerpt: Недостатки тоже очевидны — во-первых, это лишний и зачастую дублирующийся код;
    во-вторых, разработчик быстро запутается в том, какие правила он реализовал и почему.
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/08-sdk-computed-properties.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Приоритет наследуемых свойств
    application: архитектор.
  open_questions: []
- id: APIB-183
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Декларативный или императивный механизм задания правил вычисления свойств компонента
    (по образцу CSS) значительно облегчает кастомизацию визуальных компонентов разработчиками,
    несмотря на существенную сложность его реализации.
  excerpt: Мы не то чтобы рекомендуем использовать CSS-подобные правила в библиотеках компонентов
    (в силу потрясающей сложности их имплементации и, в большинстве случаев, избыточности),
    но осторожно замечаем, что поддержка какого-то простого подмножества подобного рода правил
    *значительно* облегчает кастомизацию визуальных компонент для разработчиков.
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/08-sdk-computed-properties.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Правила вычисления свойств
    application: архитектор.
  open_questions: []
- id: APIB-184
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: SDK должен предоставлять разработчику доступ не только к заданному значению свойства,
    но и к его реально вычисленному значению (computedStyle) и к событию его изменения.
  excerpt: 'Для этого мы должны разделить заданные и вычисленные значения: ```typescript //
    Задаём значение в процентах button.view.width = ''100%''; // Получаем реально применённое
    // значение в пикселях button.view.computedStyle.width; ``` Хорошей практикой также будет
    предоставлять доступ не только к вычисляемым значениям, но и к событию изменения этого
    значения.'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/08-sdk-computed-properties.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Вычисленные значения свойств
    application: разработчик.
