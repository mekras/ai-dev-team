- id: APIB-108
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Предсказуемость поведения API для партнёра означает не низкий процент ошибок как таковой,
    а то, насколько явно из документации и номенклатуры ошибок понятно, какие типовые проблемы
    могут возникнуть и какой код нужно написать для их обработки.
  excerpt: 'Но вот для разработчиков-партнёров понятие «предсказуемость поведения API» имеет
    совершенно другой смысл: насколько хорошо и полно они в своём коде могут покрыть различные
    сценарии использования API и потенциальные проблемы — или, иными словами, насколько явно
    из документации и номенклатуры методов и ошибок API становится ясно, какие типовые ошибки
    могут возникнуть и как с ними работать.'
