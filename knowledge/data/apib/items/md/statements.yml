- id: APIB-130
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Разные части HTTP-запроса имеют разные общепринятые правила кейсинга (kebab-case для
    домена, заголовков и пути; snake_case для query; snake_case или camelCase для тела), причём
    знак подчёркивания недопустим в доменных именах, что делает единый кейсинг во всех частях
    запроса невозможным.
  excerpt: 'Однако при перемещении параметра между различными составляющими запроса мы столкнёмся
    с тремя неприятными явлениями: * некоторые значения чувствительны к регистру (путь, query-параметры,
    имена полей в JSON), некоторые нет (домен, имена заголовков); * при этом со *значениями*
    заголовков и вовсе неразбериха: часть из них по стандарту обязательно нечувствительна
    к регистру (в частности, `Content-Type`), а часть, напротив, обязательно чувствительна
    (например, `ETag`); * наборы допустимых символов и правила экранирования также различны
    для разных частей запроса * для path, например, стандарта экранирования символов `/`,
    `?` и `#` не существует; * символы unicode могут использоваться в доменных именах (хотя
    эта функциональность не везде поддерживается) только через своеобразную технику кодирования
    под названием Punycode[ref Punycode: A Bootstring encoding of Unicode for Internationalized
    Domain Names in Applications (IDNA)](https://www.rfc-editor.org/rfc/rfc3492.txt); * для
    разных частей запросов используется разный кейсинг: * `kebab-case` для домена, заголовков
    и пути; * `snake_case` для query-параметров; * `snake_case` или `camelCase` для тела запроса;
    При этом использование и `snake_case`, и `camelCase` в доменном имени невозможно, так
    как знак подчеркивания в доменных именах недопустим, а заглавные буквы будут приведены
    к строчным.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/04-http-api-requests-semantics.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: кейсинг параметров по частям запроса
    application: разработчик.
  open_questions: []
- id: APIB-131
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Практическое применение принципов REST к HTTP означает — URL операции должен идентифицировать
    ресурс и служить ключом кэширования для GET и ключом идемпотентности для PUT/DELETE, глаголы
    используются по семантике, а свойства операции, заголовки и статус-коды соответствуют
    спецификации.
  excerpt: 'Эти принципы мы должны применить к протоколу HTTP, соблюдая дух и букву стандарта:
    * URL операции должен идентифицировать ресурс, к которому применяется действие, и быть
    ключом кэширования для `GET` и ключом идемпотентности — для `PUT` и `DELETE`; * HTTP-глаголы
    должны использоваться в соответствии с их семантикой; * свойства операции (безопасность,
    кэшируемость, идемпотентность, а также симметрия `GET` / `PUT` / `DELETE`-методов), заголовки
    запросов и ответов, статус-коды ответов должны соответствовать спецификации.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/05-http-api-rest-organizing.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: применение REST к HTTP на практике
    application: архитектор.
  open_questions: []
- id: APIB-132
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: В примере декомпозиции монолита на микросервисы явная передача user_id между сервисами
    (вместо повторного извлечения его из токена аутентификации внутри каждого сервиса) устраняет
    лишнюю нагрузку на авторизационный сервис и делает нижестоящие сервисы stateless относительно
    чужого контекста.
  excerpt: '[![PLOT](/img/graphs/http-api-organizing-01.ru.png "Исходная схема организации
    микросервисов")]() Нетрудно заметить, что мы тем самым создаём излишнюю нагрузку на сервис
    A: теперь к нему обращается каждый из вложенных микросервисов; даже если мы откажемся
    от аутентификации пользователей в конечных сервисах, оставив её только в сервисе D, проблему
    это не решит, поскольку сервисы B и C самостоятельно выяснить идентификатор пользователя
    не могут.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/05-http-api-rest-organizing.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: явная передача user_id между сервисами
    application: архитектор.
  open_questions: []
- id: APIB-133
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: HTTP-кэширование на основе ревизии ресурса можно реализовать через заголовок ETag
    — сервис возвращает ревизию в ETag, а при повторном запросе гейтвей отправляет условный
    GET с If-None-Match и получает 304 Not Modified, если данные не изменились.
  excerpt: 'Пусть сервис С возвращает нам тэг, соответствующий текущему состоянию заказов
    пользователя: ```json GET /v1/orders?user_id=<user_id> HTTP/1.1 → HTTP/1.1 200 OK ETag:
    <ревизия> … ``` И тогда гейтвей D при выполнении запроса может: 1.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/05-http-api-rest-organizing.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: кэширование через ETag и If-None-Match
    application: разработчик.
  open_questions: []
- id: APIB-134
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Рекомендуемый принцип проектирования микросервисов — каждый сервис должен иметь чётко
    очерченную зону ответственности и не хранить данные, относящиеся к другим уровням абстракции;
    «внешние» данные трактуются им только как идентификаторы контекста.
  excerpt: 'Фактически, мы говорим здесь о *логическом* принципе разделения уровней абстракции,
    который мы подробно обсуждали в [соответствующей главе](#api-design-separating-abstractions):
    * **микросервисы разрабатываются так, чтобы иметь чётко очерченную зону ответственности
    и не хранить данные, относящиеся к другим уровням абстракции**; * такие «внешние» данные
    являются лишь идентификаторами контекстов, и сам микросервис никак их не трактует; * если
    всё же какие-то дополнительные операции с внешними данными требуется производить (например,
    проверять, авторизована ли запрашивающая сторона на выполнение операции), то следует **организовать
    операцию так, чтобы свести её к проверке целостности переданных данных**.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/05-http-api-rest-organizing.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: границы ответственности микросервисов
    application: архитектор.
  open_questions: []
- id: APIB-135
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Оптимистичное управление параллелизмом реализуется передачей клиентом заголовка If-Match
    с актуальной ревизией ресурса при модифицирующем запросе, что одновременно служит и защитой
    от гонок, и ключом кэша.
  excerpt: 'Вспомним, однако, описанный нами в главе «[Стратегии синхронизации](#api-patterns-sync-strategies)»
    паттерн оптимистичного управления параллелизмом: для корректной работы сервиса нам нужна
    ревизия состояния ресурса, и ничто не мешает нам воспользоваться этой ревизией как ключом
    кэша.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/05-http-api-rest-organizing.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: If-Match и оптимистичная конкурентность
    application: разработчик.
  open_questions: []
- id: APIB-136
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: При полностью stateless-запросах и правильном использовании HTTP-кэширования гейтвей
    между клиентом и сервисами становится необязательным звеном — его функции можно перенести
