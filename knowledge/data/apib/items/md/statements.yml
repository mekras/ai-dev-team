- id: APIB-174
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Backend-Driven UI убирает бизнес-логику из клиента, заменяя обработку сырых данных
    получением с сервера готовой разметки или списка действий для применения на клиенте.
  excerpt: '**NB**: следует различать Backend-Driven UI и технологию серверного рендеринга
    (SSR).'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/06-sdk-backend-driven.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Идея Backend-Driven UI
    application: архитектор.
  open_questions: []
- id: APIB-175
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Преимущества Backend-Driven UI — возможность вендора менять поведение клиента с сервера
    в реальном времени без обновления приложения и экономия на разработке консистентной публичной
    номенклатуры сущностей SDK, а недостаток — требовательность к качеству сетевого соединения.
  excerpt: '«Web 1.0» — сервер присылает готовый контент страницы, а вся интерактивность сводится
    к переходам по ссылкам.) Хотя Backend-Driven UI обладает очевидным недостатком в виде
    требовательности к качеству соединения с сервером, у него есть два очень важных преимущества:
    * возможность с сервера регулировать поведение клиента, в том числе устранять возможные
    ошибки в бизнес-логике в реальном времени без необходимости обновлять приложение; * возможность
    сэкономить на разработке консистентной и читабельной номенклатуры сущностей публичного
    SDK, ограничившись минимальным набором доступной функциональности.'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/06-sdk-backend-driven.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Достоинства и недостатки Backend-Driven UI
    application: архитектор.
  open_questions: []
- id: APIB-176
  source_id: APIB
  item_id: APIB-md
  kind: observation
  status: ready_for_review
  text: В материале отмечено, что крупные IT-компании часто экспериментируют с Backend-Driven
    UI, однако заметных рыночных продуктов, построенных целиком на этом подходе, почти нет,
    кроме протоколов удалённых терминалов; основная причина — сложность гибридного кода,
    сочетающего серверное и клиентское состояние.
  excerpt: 'Тем не менее, мы не можем не отметить: при том, что любая крупная IT-компания
    проходит через эту фазу — разработки Backend-Driven UI (они же — «тонкие клиенты») для
    своих приложений или своих публичных SDK — мы не знаем ни одного заметного на рынке продукта,
    разработанного в этой парадигме (кроме, разве что, протоколов удалённых терминалов), хотя
    во многих случаях возникающими сетевыми задержками вполне можно было бы пренебречь.'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/06-sdk-backend-driven.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Редкость Backend-Driven UI на практике
    application: архитектор.
  open_questions: []
- id: APIB-177
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Backend-Driven UI отличается от серверного рендеринга (SSR) тем, что при SSR клиент
    способен интерпретировать ответ сервера и извлекать из него семантические данные, тогда
    как в Backend-Driven UI ответ сервера для клиента остаётся непрозрачным «чёрным ящиком».
  excerpt: В SSR, однако, подразумевается, что клиент может интерпретировать ответ сервера
    и извлекать из него семантические данные.
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/06-sdk-backend-driven.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Backend-Driven UI и SSR
    application: архитектор.
  open_questions: []
- id: APIB-178
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Использование простого булева флага (например, isDataLoading) для блокировки интерфейса
    на время асинхронной загрузки данных плохо масштабируется на разные виды загрузок, ухудшает
    читаемость кода и может оставить интерфейс заблокированным навсегда, если при загрузке
    произойдёт необработанная ошибка.
  excerpt: 'Чтобы реализовать эту функциональность, нам нужно оповестить вышестоящие компоненты
    о начале и окончании загрузки: ```typescript class OfferPanelComponent { … show () { /*
    <em> */this.events.emit(''beginDataLoad'');/* </em> */ let fullData = await api .getFullOfferData(offer);
    /* <em> */this.events.emit(''endDataLoad'');/* </em> */ … } } ``` ```typescript // `Composer`
    прослушивает события // на панели предложений и выставляет // значения соответствующего
    флага class SearchBoxComposer { … constructor () { … this.offerPanel.events.on( ''beginDataLoad'',
    () => { /* <em> */this.isDataLoading = true;/* </em> */ } ); this.offerPanel.events.on(
    ''endDataLoad'', () => { /* <em> */this.isDataLoading = false;/* </em> */ } ); } selectOffer
    (offer) { if (this.isDataLoading) { return; } … } } ``` Но этот код очень плох по множеству
    причин: * непонятно, как его модифицировать, если у нас появятся разные виды загрузок
    данных, причём некоторые из них будут требовать блокировки интерфейса, а некоторые — нет;
    * этот код просто плохо читается: совершенно непонятно, почему события загрузки данных
    на одном компоненте влияют на пользовательскую функциональность в другом компоненте; *
    если при загрузке произойдёт какая-то ошибка, событие `endDataLoad` не произойдёт, и интерфейс
    останется заблокированным навсегда.'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/07-sdk-shared-resources.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Проблемы наивных флагов блокировки
    application: разработчик.
  open_questions: []
- id: APIB-179
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Рекомендуемое решение для управления доступом к разделяемому UI-ресурсу (например,
    панели предложения) — явный захват блокировки (acquireLock) по аналогии с управлением
    разделяемыми ресурсами в системном программировании, с обязательным освобождением ресурса
    в блоке finally.
  excerpt: 'Чтобы решить их, нам нужно сделать ещё один шаг: не просто ввести флаг, но и процедуру
    его *захвата* (вполне классическим образом по аналогии с управлением разделяемыми ресурсами
    в системном программировании): ```typescript class SearchBoxComposer { … selectOffer (offer)
    { let lock; try { // Пытаемся захватить ресурс // `offerFullView` lock = await this.acquireLock(
    ''offerFullView'', ''10s'' ); let fullData = await api .getFullOfferData(offer); this.events.emit(
    ''offerFullViewChange'', this.generateOfferFullView(fullData) ); lock.release(); } catch
    (e) { // Если получить доступ не удалось return; } finally { // Не забываем освободить
    ресурс // в случае ошибки if (lock) { lock.release(); } } } } ``` **NB**: вторым параметром
    в `acquireLock` мы передали максимальное время жизни блокировки — 10 секунд.'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/07-sdk-shared-resources.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Захват разделяемого ресурса
    application: разработчик.
  open_questions: []
- id: APIB-180
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Блокировка разделяемого ресурса должна иметь максимальное время жизни (например, 10
    секунд), по истечении которого она автоматически снимается, чтобы забытое исключение или
    зависший запрос не блокировали интерфейс навсегда.
  excerpt: Если в течение этого времени блокировка не снята (например, в случае, если мы забыли
    обработать какое-то исключение или выставить таймаут на запрос к серверу), она будет отменена
    автоматически, и интерфейс будет разблокирован.
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/07-sdk-shared-resources.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Таймаут блокировки
    application: разработчик.
  open_questions: []
- id: APIB-181
  source_id: APIB
  item_id: APIB-md
  kind: observation
  status: ready_for_review
  text: В современном фронтенде захват контроля над разделяемыми ресурсами на время загрузки
    данных или анимации почти не практикуется, так как короткие асинхронные операции считаются
    не создающими коллизий доступа, хотя для длительных или многоступенчатых загрузок это
    может быть серьёзной UX-проблемой.
  excerpt: Однако, если асинхронные операции выполняются долго (происходят длительные или
    многоступенчатые загрузки данных, сложные анимации), пренебрежение организацией доступа
    может быть очень серьёзной UX-проблемой.
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/07-sdk-shared-resources.local.md
  checked_at: '2026-07-17'
