- id: APIB-138
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Автор рекомендует размещать версию API в пути (path), а не в query-параметре или заголовке,
    поскольку остальные способы имеют смысл только если номенклатура URL при смене мажорной
    версии остаётся прежней, а в этом случае нет и необходимости нарушать обратную совместимость.
  excerpt: 'Мы используем указание версии в path по одной простой причине: все остальные способы
    сделать это имеют смысл, если и только если при изменении мажорной версии протокола номенклатура
    URL останется прежней.'
