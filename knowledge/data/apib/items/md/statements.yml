- id: APIB-120
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Диссертация Филдинга 2000 года («REST») представляет собой абстрактный обзор ограничений
    распределённой сетевой архитектуры, не привязанный к HTTP или URL, и не содержит правил
    дизайна API.
  excerpt: Как нетрудно убедиться, прочитав эту главу, она представляет собой абстрактный
    обзор распределённой сетевой архитектуры, вообще не привязанной ни к HTTP, ни к URL.
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/03-http-api-rest-myth.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: природа диссертации Филдинга
    application: аналитик.
  open_questions: []
- id: APIB-121
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: 'Филдинг перечисляет шесть ограничений REST: клиент-серверная архитектура, stateless-дизайн,
    разметка кэшируемости данных, стандартизация интерфейсов взаимодействия, многослойность
    сети и возможность расширения клиента кодом с сервера (code-on-demand).'
  excerpt: 'Вот они: * клиент и сервер не знают внутреннего устройства друг друга (клиент-серверная
    архитектура); * сессия хранится на клиенте (stateless-дизайн); * данные должны размечаться
    как кэшируемые или некэшируемые; * интерфейсы взаимодействия между компонентами должны
    быть стандартизированы; * сетевые системы являются многослойными, т.е.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/03-http-api-rest-myth.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: шесть ограничений REST по Филдингу
    application: архитектор.
  open_questions: []
- id: APIB-122
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: В разъяснении 2008 года Филдинг ужесточил трактовку REST — клиент не должен обладать
    никаким априорным знанием об API, все операции и ссылки должны извлекаться из гипермедиа-представлений
    ресурсов (HATEOAS); по утверждению автора книги, этому требованию не удовлетворяет ни
    одна реально существующая система.
  excerpt: '**NB**: оставляя за скобками тот факт, что Филдинг весьма вольно истолковал свою
    собственную диссертацию, просто отметим, что ни одна существующая система в мире не удовлетворяет
    описанию REST по Филдингу-2008.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/03-http-api-rest-myth.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: REST по Филдингу-2008 и HATEOAS
    application: архитектор.
  open_questions: []
- id: APIB-123
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Автор книги сознательно не использует термины «REST API» и «RESTful API» в последующих
    главах из-за их неформальности и отсутствия консистентного смысла, заменяя их термином
    «HTTP API».
  excerpt: Однако HTTP API (подразумевая под этим JSON-over-HTTP эндпойнты, утилизирующие
    семантику, описанную в стандартах HTTP и URL), как мы его будем определять в последующих
    главах, фактически соответствует усреднённому представлению о «REST/RESTful API», как
    его можно найти в многочисленных учебных пособиях.
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/03-http-api-rest-myth.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: отказ от термина REST API
    application: аналитик.
  open_questions: []
- id: APIB-124
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Актуальная семантика HTTP описана в RFC 9110, заменившем девять предыдущих спецификаций;
    при этом кэширование регулируется отдельным RFC 9111, а широко используемый в API метод
    PATCH — отдельным RFC 5789, а не основным RFC.
  excerpt: В частности, принципы HTTP-кэширования описаны в отдельном RFC 9111[ref RFC 9111
    HTTP Caching](https://www.rfc-editor.org/rfc/rfc9111.html), а широко используемый в API
    метод `PATCH` так и не вошёл в основной RFC и регулируется RFC 5789[ref PATCH Method for
    HTTP](https://www.rfc-editor.org/rfc/rfc5789.html)).
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/04-http-api-requests-semantics.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: спецификации HTTP-семантики
    application: разработчик.
  open_questions: []
- id: APIB-125
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Каждый HTTP-глагол однозначно определяет семантику операции и её побочные свойства;
    GET безопасен и идемпотентен без тела, PUT заменяет ресурс целиком и идемпотентен с телом,
    DELETE удаляет ресурс и идемпотентен без тела, POST не безопасен и не идемпотентен с телом,
    PATCH частично модифицирует ресурс и не безопасен и не идемпотентен с телом.
  excerpt: '| Глагол | Семантика | Безопасный (немодифицирующий) | Идемпотентный | Может иметь
    тело | |--------|----------------------------------|---------------|---------------|------------|
    | GET | Возвращает представление ресурса | да | да | не рекомендуется | | PUT | Заменяет
    (полностью перезаписывает) ресурс согласно данным, переданным в теле запроса | нет | да
    | да | | DELETE | Удаляет ресурс | нет | да | не рекомендуется | | POST | Обрабатывает
    запрос в соответствии со своим внутренним устройством | нет | нет | да | | PATCH | Модифицирует
    (частично перезаписывает) ресурс согласно данным, переданным в теле запроса | нет | нет
    | да | **NB**: распространено мнение, что метод `POST` предназначен только для создания
    новых ресурсов.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/04-http-api-requests-semantics.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: таблица свойств HTTP-глаголов
    application: разработчик.
  open_questions: []
- id: APIB-126
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: URL запроса служит ключом идемпотентности для модифицирующих идемпотентных глаголов
    — повторный PUT /url должен приводить к тому же состоянию ресурса, повторный DELETE /url
    должен оставлять его удалённым, а последующий GET /url должен возвращать представление,
    консистентное с последним PUT, или 404/410 после DELETE.
  excerpt: Учитывая, что метод `GET /url` семантически должен вернуть представление целевого
    ресурса `/url`, то, если этот метод реализован, он должен возвращать консистентное предыдущим
    `PUT` / `DELETE` представление.
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/04-http-api-requests-semantics.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: URL как ключ идемпотентности
    application: разработчик.
  open_questions: []
- id: APIB-127
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Частый антипаттерн дизайна HTTP API — размещение модифицирующих операций за GET (риск
    кэширования и автоматического повтора промежуточными агентами), неидемпотентных операций
    за PUT/DELETE, и нарушение требования симметрии между GET, PUT и DELETE над одним и тем
    же ресурсом.
  excerpt: '* Размещение неидемпотентных операций за идемпотентными методами `PUT` / `DELETE`.'
