- id: APIB-163
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Объединение в одном UI-объекте (например, классе Button) разнородной функциональности
    — внешнего вида, реакции на действия и элементов UX — требует, чтобы каждая из этих трёх
    подсистем могла независимо переопределяться, иначе три типовых сценария кастомизации кнопок
    конфликтуют друг с другом.
  excerpt: С точки зрения разработчика SDK это означает, что класс `Button` должен позволять
    независимо переопределять и внешний вид кнопки, и реакцию на действия пользователя, и
    элементы UX — или, иначе говоря, каждая из трёх подсистем может быть заменена альтернативной
    имплементацией так, чтобы две остальные системы продолжили работать без изменений.
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/03-sdk-ui-components.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Разнородная функциональность в UI-объекте
