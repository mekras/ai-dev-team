- id: APIB-158
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: 'Помимо тривиальных задач SDK должен решать проблемы более высокого порядка: разрешение
    ссылок на сущности вместо голых идентификаторов, автоматическую подгрузку связанных объектов
    и кэширование, удобную подписку на серверные события без ручных карт объектов и восстановление
    после ошибок бизнес-логики.'
  excerpt: 'Однако, помимо тривиальных проблем при разработке SDK к клиент-серверному API
    мы сталкиваемся и с проблемами более высокого порядка: 1.'
