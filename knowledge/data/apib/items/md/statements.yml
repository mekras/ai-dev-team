- id: APIB-137
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Правила организации URL (path для строгой иерархии, query для нестрогих отношений
    и параметров операции) существуют только для читабельности кода и удобства разработчика
    — ни стандарты HTTP/URL, ни принципы REST не предписывают этим компонентам конкретной
    семантики.
  excerpt: '**Правила организации URL в HTTP API существуют *только* для читабельности кода
    и удобства разработчика**.'
