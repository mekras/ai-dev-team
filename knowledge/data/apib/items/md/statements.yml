- id: APIB-113
  source_id: APIB
  item_id: APIB-md
  kind: observation
  status: ready_for_review
  text: Автор книги намеренно вводит собственный практический термин «HTTP API» / «JSON-over-HTTP
    API» (HTTP 1.1+, JSON, URL по стандарту, семантика вызовов по спецификации, отсутствие
    сознательных нарушений веб-стандартов) и избегает термина «REST API», поскольку у последнего
    нет консистентного определения.
  excerpt: Что касается термина «REST API», то как мы покажем дальше, у него нет консистентного
    определения, поэтому его использования мы также стараемся избегать.
