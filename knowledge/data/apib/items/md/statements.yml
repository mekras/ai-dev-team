- id: APIB-114
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: 'Главный практический принцип разработки HTTP API, по утверждению автора: разрабатывать
    API так, чтобы промежуточные агенты (клиентские фреймворки, прокси, API-гейтвеи) могли
    читать и интерпретировать метаданные запроса и ответа без дополнительного кода.'
  excerpt: 'Если попытаться сформулировать главный принцип разработки HTTP API, то мы получим
    примерно следующее: **лучше бы ты разрабатывал API так, чтобы промежуточные агенты могли
    читать и интерпретировать метаданные запроса и ответа**.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/02-http-api-pros-and-cons.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: главный принцип HTTP API
    application: архитектор.
  open_questions: []
- id: APIB-115
  source_id: APIB
  item_id: APIB-md
  kind: observation
  status: ready_for_review
  text: 'Главный недостаток HTTP API зеркален его преимуществу: та же способность промежуточных
    агентов читать и действовать по метаданным запроса проявляется и без ведома разработчика,
    а сложность стандарта HTTP приводит к тому, что метаданные могут трактоваться неверно.'
  excerpt: 'Если попытаться сформулировать главный принцип разработки HTTP API, то мы получим
    примерно следующее: **лучше бы ты разрабатывал API так, чтобы промежуточные агенты могли
    читать и интерпретировать метаданные запроса и ответа**.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/02-http-api-pros-and-cons.local.md
