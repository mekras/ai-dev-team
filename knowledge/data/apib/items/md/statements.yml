- id: APIB-145
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: 'На практике множество разнородных бизнес-ошибок сводят к небольшому набору кодов:
    400 (валидация запроса), 403 (авторизация), 404 (не найдено или скрытая причина), 409
    (конфликт целостности), 410 (удалено), 429 (превышение лимитов).'
  excerpt: С одной стороны, протокол включает в себя множество специальных кодов, которые
    индицируют проблемы с использованием самого протокола — такие как `405 Method Not Allowed`
    (данный глагол неприменим к указанному ресурсу), `406 Not Acceptable` (сервер не может
    вернуть ответ согласно `Accept`-заголовкам запроса), `411 Length Required`, `414 URI Too
    Long` и так далее.
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/07-http-api-errors.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: базовый набор кодов бизнес-ошибок
    application: разработчик.
  open_questions: []
- id: APIB-146
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: RFC 9457 (Problem Details for HTTP APIs) покрывает только базовый сценарий описания
    ошибок — не передаёт подтип ошибки, не разделяет сообщения для пользователя и для разработчика,
    а конкретный машиночитаемый формат деталей остаётся на усмотрение разработчика.
  excerpt: 'Вы можете воспользоваться ей, но имейте в виду, что она покрывает только самый
    базовый сценарий: * подтип ошибки не передаётся в мета-информации; * нет разделения на
    сообщение для пользователя и сообщение для разработчика; * конкретный машиночитаемый формат
    описания ошибок остаётся на усмотрение разработчика.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/07-http-api-errors.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: ограничения RFC 9457
    application: разработчик.
  open_questions: []
- id: APIB-147
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: HTTP-клиенты по умолчанию автоматически повторяют только немодифицирующие запросы
    (GET, HEAD, OPTIONS); повтор модифицирующих запросов требует, чтобы разработчик написал
    соответствующую логику сам, сверившись с документацией API.
  excerpt: Современная практика реализации HTTP-клиентов такова, что безусловно повторяются
    только немодифицирующие (`GET`, `HEAD`, `OPTIONS`) запросы.
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/07-http-api-errors.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: автоматический повтор запросов
    application: разработчик.
  open_questions: []
- id: APIB-148
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Существует три подхода к организации ошибок HTTP API — расширительная трактовка номенклатуры
    статус-кодов, полный отказ от статус-кодов в пользу тела ответа с кодом 200, и смешанный
    подход; по мнению автора, только смешанный подход полностью соответствует стандарту.
  excerpt: Полностью отказаться от использования статус-кодов и вкладывать описание ошибки
    в тело и/или метаданные ответа с кодом `200`.
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/07-http-api-errors.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: три подхода к ошибкам HTTP API
    application: архитектор.
  open_questions: []
- id: APIB-149
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Рекомендуемая последовательность проектирования HTTP API — описать happy path, определить
    операции над ресурсами и составить номенклатуру URL и методов, проанализировать возможные
    ошибки и восстановление клиента, решить объём функциональности на уровне протокола HTTP,
    составить спецификацию и проверить её псевдокодом бизнес-логики.
  excerpt: Определить каждый вызов как операцию над некоторым ресурсом и, таким образом, составить
    номенклатуру URL и применимых методов.
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/08-http-api-final-recommendations.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: последовательность проектирования HTTP API
    application: архитектор.
  open_questions: []
- id: APIB-150
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Рекомендация — всегда возвращать корневой JSON-объект в ответах эндпойнтов (не массив
    и не примитив), чтобы сохранить возможность обратно-совместимого расширения ответа новыми
    полями; для отсутствия данных лучше вернуть пустой объект или 204 No Content, а не пустую
    строку.
  excerpt: Всегда оставляйте себе возможность обратно-совместимого расширения операции API.
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/08-http-api-final-recommendations.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: корневой JSON-объект для расширяемости
    application: разработчик.
  open_questions: []
- id: APIB-151
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Рекомендация — не изобретать собственный формат передачи массивов и вложенных объектов
    в query-строке, а использовать HTTP-глагол, допускающий тело запроса, либо в крайнем случае
    Base64-кодированное JSON-поле; не размещать в пути и домене параметры, требующие эскейпинга.
  excerpt: 'В частности: * не размещайте модифицирующие операции за методом `GET` и неидемпотентные
    операции за `PUT` / `DELETE`; * соблюдайте симметрию `GET` / `PUT` / `DELETE` методов;
    * не позволяйте `GET` / `HEAD` / `DELETE`-запросам иметь тело, не возвращайте тело в ответе
    метода `HEAD` или совместно со статус-кодом `204 No Content`; * не придумывайте свой стандарт
    для передачи массивов и вложенных объектов в query — лучше воспользоваться HTTP-глаголом,
    позволяющим запросу иметь тело, или, в крайнем случае, передать параметры в виде Base64-кодированного
    JSON-поля; * не размещайте в пути и домене URL параметры, по формату требующие эскейпинга
    (т.е.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/08-http-api-final-recommendations.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: параметры сложной структуры в URL
    application: разработчик.
  open_questions: []
- id: APIB-152
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: 'Рекомендация — поддержать метод OPTIONS и протокол CORS, если API может использоваться
    из браузеров, и заложить защиту от типовых уязвимостей HTTP API: CSRF, SSRF, HTTP Response
    Splitting и Unvalidated Redirects and Forwards.'
  excerpt: 'Ознакомьтесь хотя бы с основными видами уязвимостей в типичных имплементациях
    HTTP API, которыми могут воспользоваться злоумышленники: * CSRF[ref Cross Site Request
    Forgery (CSRF)](https://owasp.org/www-community/attacks/csrf) * SSRF[ref Server Side Request
    Forgery](https://owasp.org/www-community/attacks/Server_Side_Request_Forgery) * HTTP Response
    Splitting[ref HTTP Response Splitting](https://owasp.org/www-community/attacks/HTTP_Response_Splitting)
    * Unvalidated Redirects and Forwards[ref Unvalidated Redirects and Forwards Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html)
    и заложите защиту от этих векторов атак на уровне вашего серверного ПО.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/08-http-api-final-recommendations.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: CORS и защита от типовых уязвимостей
    application: разработчик.
  open_questions: []
- id: APIB-153
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: В узком значении SDK — это клиентская библиотека, предоставляющая высокоуровневый
    (обычно нативный) интерфейс к нижележащей платформе и, в частности, к клиент-серверному
    API.
  excerpt: 'Тем не менее, у термина SDK есть и более узкое значение, в котором он часто используется:
    это клиентская библиотека, которая предоставляет высокоуровневый (обычно, нативный) интерфейс
    для работы с некоторой нижележащей платформой (и в частности с клиент-серверным API).'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/01-sdk-toc-technology-overview.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Терминология SDK
