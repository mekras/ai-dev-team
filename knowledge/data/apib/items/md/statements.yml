- id: APIB-139
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Соответствие CRUD-операций HTTP-глаголам (POST — создание, GET — чтение, PUT/PATCH
    — редактирование, DELETE — удаление) — это лишь мнемоническое правило; глагол всегда следует
    выбирать по его семантике из стандарта, а не по мнемонике.
  excerpt: 'Ключевая идея соответствия CRUD и HTTP заключается в том, что каждой из CRUD-операций
    соответствует один из глаголов HTTP: * операции создания — создание ресурса через метод
    `POST`; * операции чтения — возврат представления ресурса через метод `GET`; * операции
    редактирования — перезапись ресурса через метод `PUT` или редактирование через `PATCH`;
    * операции удаления — удаление ресурса через метод `DELETE`.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/06-http-api-urls-crud.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: CRUD-мнемоника против семантики
    application: разработчик.
  open_questions: []
- id: APIB-140
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Идемпотентное создание ресурса можно реализовать тремя способами — POST с токеном
    идемпотентности, PUT с идентификатором, сгенерированным клиентом, или схемой «черновик–подтверждение»;
    автор считает схему «черновик–подтверждение» предпочтительнее PUT с клиентским ID.
  excerpt: 'В рамках парадигмы HTTP API идемпотентное создание можно организовать одним из
    трёх способов: 1.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/06-http-api-urls-crud.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: три способа идемпотентного создания
    application: разработчик.
  open_questions: []
- id: APIB-141
  source_id: APIB
  item_id: APIB-md
  kind: observation
  status: ready_for_review
  text: На практике номенклатура CRUD-эндпойнтов быстро вырастает с 2 URL и 4–5 методов до
    примерно 8 URL и 9–10 методов, если требуются контроль параллелизма при создании, совместное
    редактирование, архивирование и поиск с фильтрацией.
  excerpt: 'Однако, если мы выдвинем требования наличия возможностей: * контроля параллелизма
    при создании сущностей; * совместного редактирования; * архивирования; * поиска с фильтрацией;
    то мы быстро придём к номенклатуре из 8 URL и 9-10 методов: * `GET /v1/orders/?user_id=<user_id>`
    для получения списка текущих заказов, возможно с какими-то простыми фильтрами; * `/v1/orders/drafts/?user_id=<user_id>`
    для создания черновика заказа через метод `POST` и получения списка текущих черновиков
    и актуальной ревизии через метод `GET`; * `PUT /v1/orders/drafts/{id}/commit` для подтверждения
    черновиков и создания заказов; * `GET /v1/orders/{id}` для получения вновь созданного
    заказа; * `POST /v1/orders/{id}/drafts` для создания черновика внесения списка изменений;
    * `PUT /v1/orders/{id}/drafts/{id}/commit` для подтверждения черновика со списком изменений;
    * `/v1/orders/search?user_id=<user_id>` для поиска заказов через метод `GET` (простые
    случаи) или `POST` (если необходимы сложные фильтры); * `PUT /v1/orders/{id}/archive`
    для архивирования заказа.'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/06-http-api-urls-crud.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: рост номенклатуры CRUD-эндпойнтов
    application: архитектор.
  open_questions: []
- id: APIB-142
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Для полного описания ошибки каждому из трёх акторов (пользователь, клиент, сервер)
    нужны ответы на четыре вопроса — кто допустил ошибку, можно ли исправить её простым повтором
    запроса, можно ли исправить переформулированием запроса, и что делать, если исправить
    нельзя вовсе.
  excerpt: Если повтором запроса ошибку исправить нельзя, то можно ли её исправить, переформулировав
    запрос.
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/07-http-api-errors.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: четыре вопроса об ошибке
    application: архитектор.
  open_questions: []
- id: APIB-143
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Повтор запроса при получении 4xx обычно бессмыслен, за исключением 429 Too Many Requests
    и 404 Not Found — последний по стандарту означает «состояние неопределённости» и допускает
    успешный повтор; для персистентного отсутствия ресурса используется отдельный код 410
    Gone.
  excerpt: Однако из этого правила есть исключения, самые важные из которых — `429 Too Many
    Requests` и `404 Not Found`.
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/07-http-api-errors.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: повторяемость ошибок 404 и 429
    application: разработчик.
  open_questions: []
- id: APIB-144
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Де-факто стандартом стало возвращать 401 Unauthorized при отсутствии заголовков авторизации
    или невалидном токене, хотя это формально противоречит спецификации, требующей при 401
    обязательно указывать заголовок WWW-Authenticate.
  excerpt: В частности, сегодня де-факто стандартом является возврат кода `401 Unauthorized`
    при отсутствии заголовков авторизации или невалидном токене (получение этого кода, таким
    образом, является сигналом для приложения предложить пользователю залогиниться в системе),
    что противоречит стандарту (который требует при возврате `401` обязательно указать заголовок
    `WWW-Authenticate` с описанием способа аутентификации пользователя; нам неизвестны реальные
    API, которые выполняют это требованием).
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/07-http-api-errors.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: 401 Unauthorized де-факто и де-юре
    application: разработчик.
