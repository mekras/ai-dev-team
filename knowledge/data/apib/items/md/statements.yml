  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: 'gRPC сочетает HTTP/2 и Protobuf, contract-first подход и кодогенерацию, но имеет
    недостатки: сложность отладки, слабую поддержку браузеров, меньшую распространённость
    и потенциальную зависимость от Google.'
  excerpt: 'К недостаткам gRPC следует отнести: * сложность декодирования сообщений и отладки
    коммуникации; * слабую поддержку браузеров; * меньшую распространённость (и отсюда более
    высокий порог вхождения для разработчиков); * потенциальную зависимость от Google.'
