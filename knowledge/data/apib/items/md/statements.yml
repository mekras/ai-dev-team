- id: APIB-166
  source_id: APIB
  item_id: APIB-md
  kind: observation
  status: ready_for_review
  text: Декомпозиция SearchBox на подкомпоненты OfferList и OfferPanel с прямыми вызовами
    методов друг друга работает без требований кастомизации, но каждый из трёх сценариев кастомизации
    (замена списка на карту, слияние списка и панели, добавление кнопок) ломает эту простую
    декомпозицию по-своему.
  excerpt: 'Мы можем попытаться разомкнуть эту связь, если начнём маршрутизировать потоки
    команд через сам `SearchBox`, например, так: ```typescript class SearchBox() { constructor()
    { this.offerList = new OfferList(…); this.offerPanel = new OfferPanel(…); this.offerList.events.on(
    ''offerSelect'', function (offer) { this.offerPanel.show(offer); } ); this.offerPanel.events.on(
    ''close'', function () { this.offerList .resetSelectedOffer(); } ); } } ``` Теперь `OfferList`
    и `OfferPanel` стали независимы друг от друга, но мы получили другую проблему: для их
    замены на альтернативные имплементации нам придётся переписать сам `SearchBox`.'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/04-sdk-decomposing.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Декомпозиция SearchBox
    application: архитектор.
  open_questions: []
- id: APIB-167
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Замена прямых вызовов методов на подписку на события (слабая связность) делает код
    декомпозированных компонентов более читаемым, но не устраняет их взаимозависимость — использовать
    OfferList без OfferPanel по-прежнему невозможно.
  excerpt: 'Компонент `IOfferPanel` мог бы бросать событие `''close''`, и тогда `OfferList`
    мог бы на него подписаться: ```typescript class OfferList { setup() { … /* <em> */this.offerPanel.events.on(/*
    </em> */ /* <em> */''close''/* </em> */, function () { this.resetCurrentOffer(); } ) }
    … } ``` Код выглядит более разумно написанным, но никак не уменьшает взаимозависимость
    компонентов: использовать `OfferList` без `OfferPanel`, как этого требует сценарий \#2,
    мы всё ещё не можем.'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/04-sdk-decomposing.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Слабая связность через события
    application: архитектор.
  open_questions: []
- id: APIB-168
  source_id: APIB
  item_id: APIB-md
  kind: observation
  status: ready_for_review
  text: Маршрутизация всех событий подкомпонентов через родительский компонент (например,
    SearchBox) заставляет родителя транслировать чужие события и легко приводит к бесконечным
    циклам обработки, если высокоуровневые и низкоуровневые события не разделены явно.
  excerpt: Мы даже можем заставить `SearchBox` транслировать *любые* события дочерних компонентов,
    и, таким образом, прозрачным образом расширять функциональность, добавляя новые события.
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/04-sdk-decomposing.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: Трансляция событий через родителя
    application: архитектор.
