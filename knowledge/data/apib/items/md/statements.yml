- id: APIB-109
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Рекомендуется включать в саму ошибку рекомендации по восстановлению отдельно для конечного
    пользователя и для разработчика, документировать некритичность отдельных ошибок и предусматривать
    понятное поведение по умолчанию для неизвестных клиенту ошибок, включая ошибки транспортного
    уровня без подсказок от бэкенда.
  excerpt: 'Несколько общих советов, которые могут вам пригодиться: * если вы можете включить
    в саму ошибку рекомендации, как с ней бороться — сделайте это не раздумывая (имейте в
    виду, что таких рекомендаций должно быть две — для пользователя, который увидит ошибку
    в приложении, и для разработчика, который будет разбирать логи); * если ошибки в каком-то
    эндпойнте некритичны для основной функциональности интеграции, очень желательно описать
    этот факт в документации (потому что разработчик может просто не догадаться обернуть соответствующий
    вызов в try-catch), а лучше — привести примеры, каким значением/поведением по умолчанию
    следует воспользоваться в случае получения ошибки; * не забывайте, что, какую бы стройную
    и всеобъемлющую систему ошибок вы ни выстроили, почти в любой среде разработчик может
    получить ошибку транспортного уровня или таймаут выполнения, а, значит, оказаться в ситуации,
    когда восстанавливать состояние надо, а «подсказки» от бэкенда недоступны; должна существовать
    какая-то достаточно очевидная последовательность действий «по умолчанию» для восстановления
    работы интеграции из любой точки; * наконец, при введении новых ошибок не забывайте о
    старых клиентах, которые про эти новые типы ошибок не знают; «реакция по умолчанию» на
    неизвестные ошибки должна в том числе покрывать и эти новые сценарии.'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/11-api-patterns-degrading.local.md
  checked_at: '2026-07-17'
