- id: APIB-157
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: SDK решает тривиальные проблемы адаптации API к языку платформы — форматы данных,
    стиль кодирования, парадигму обработки ошибок и логику перезапросов с уважением заголовка
    Retry-After и растущих интервалов.
  excerpt: 'Генерация кода позволяет решить типовые проблемы: стиль кодирования, обработка
    исключений, (де)сериализация сложных типов — словом все те задачи, которые зависят не
    от особенностей высокоуровневой бизнес-логики, а от конвенций конкретной платформы.'
