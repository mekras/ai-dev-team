- id: APIB-128
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: Статус-коды HTTP делятся на пять групп по первой цифре (1xx–5xx); согласно спецификации,
    если клиент не знает конкретный код ошибки, он обязан вести себя так же, как при получении
    соответствующего кода x00 из той же группы.
  excerpt: В случае, если возвращаемый сервером код ошибки `xyz` неизвестен клиенту, согласно
    спецификации клиент обязан выполнить то действие, которое выполнил бы при получении ошибки
    `x00`.
