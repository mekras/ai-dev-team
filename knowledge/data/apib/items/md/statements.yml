- id: APIB-185
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: 'Автор формулирует итоговый вывод раздела: разработка качественной UI-библиотеки —
    отдельная и сложная инженерная задача, не сводимая к автоматической генерации SDK по спецификации
    или модели данных.'
  excerpt: '### Заключение Предыдущие восемь глав были написаны нами, чтобы раскрыть две очень
    важные мысли: * разработка качественной UI-библиотеки — это отдельная и весьма непростая
    инженерная задача; * и эта задача не сводится к автоматической генерации SDK по спецификации
    / модели данных.'
  artifact: ../md/06-Раздел V. SDK и UI-библиотеки/09-sdk-conclusion.local.md
