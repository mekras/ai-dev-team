  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Атомарный эндпойнт массовых изменений, содержащий хотя бы один неисправимый повторением
    невалидный подзапрос, блокирует выполнение и валидных подзапросов при каждом повторе,
    тогда как неатомарный сервер продолжает выполнять валидные операции; это указывает на
    нежелательность самих эндпойнтов массовых изменений как класса.
  excerpt: 'Если в составе массового вызова есть такой подзапрос, то атомарный сервер, реализованный
    по схеме (A), моментально партнёра «накажет»: сколько бы он запрос ни повторял, *валидные
    подзапросы не будут выполнены, если есть хоть один невалидный*.'
  artifact: ../md/03-Раздел II. Паттерны дизайна API/09-api-patterns-atomicity.local.md
