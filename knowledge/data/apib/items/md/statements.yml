- id: APIB-116
  source_id: APIB
  item_id: APIB-md
  kind: fact
  status: ready_for_review
  text: По утверждению автора, сжатие gzip/brotli практически нивелирует разницу в размере
    между JSON и бинарными форматами, а оптимизированные десериализаторы (например, simdjson)
    снимают проблему производительности разбора JSON почти для всех API, кроме экзотических.
  excerpt: Сравнения показывают[ref Comparing sizes of protobuf vs json](https://nilsmagnus.github.io/post/proto-json-sizes/),
    что использование gzip практически нивелирует разницу в размере JSON документов относительно
    альтернативных бинарных форматов (а есть ещё и специально предназначенные для текстовых
    данных архиваторы, например, brotli[ref Brotli Compressed Data Format](https://datatracker.ietf.org/doc/html/rfc7932)).
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/02-http-api-pros-and-cons.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: производительность JSON-over-HTTP
    application: архитектор.
  open_questions: []
- id: APIB-117
  source_id: APIB
  item_id: APIB-md
  kind: inference
  status: ready_for_review
  text: Для публичных API JSON-over-HTTP является выбором по умолчанию из-за широкой понятности
    и кроссплатформенности клиентов, тогда как узкоспециализированные RPC-фреймворки (например,
    Apache Avro) уместны в узкоспециализированных внутренних системах.
  excerpt: '#### Выбор технологии разработки клиент-серверного API Как мы видим из вышесказанного,
    HTTP API и альтернативные RPC-протоколы занимают разные ниши: * для публичных API предоставление
    JSON-over-HTTP эндпойнтов является выбором по умолчанию, поскольку эта технология: * понятна
    максимально широкому кругу программистов; * позволяет разрабатывать клиентские приложения
    практически на любой платформе; * для узкоспециализированных API логично использовать
    узкоспециализированные фреймворки (например, Apache Avro для работы с Apache Hadoop).'
  artifact: ../md/05-Раздел IV. HTTP API и архитектурные принципы REST/02-http-api-pros-and-cons.local.md
  checked_at: '2026-07-17'
  scope:
    section_title: выбор технологии API
    application: архитектор.
  open_questions: []
- id: APIB-118
