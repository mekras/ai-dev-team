  kind: fact
  status: ready_for_review
  text: проектирование взаимодействия продукта с пользователем должно предшествовать программированию,
    потому что поздняя проверка удобства не заменяет раннее проектное решение о поведении продукта.
  excerpt: Источник связывает раннее проектирование взаимодействия с качеством,
  artifact: process-before-code.md
  checked_at: '2026-06-25'
  scope:
    section_title: Наблюдения
    application: роль UX, маршрутизация проектных задач до реализации.
  open_questions: []
- id: INMA-002
  source_id: INMA
  item_id: INMA-fragment-process
  kind: fact
  status: ready_for_review
  text: проектирование взаимодействия является отдельной специализацией, отличной от программирования
    и внутреннего проектирования кода.
  excerpt: 'Автор отделяет проектирование взаимодействия от программирования: программисты'
  artifact: process-before-code.md
  checked_at: '2026-06-25'
  scope:
    section_title: Наблюдения
    application: границы роли специалиста по эргономике, архитектора и разработчика.
  open_questions: []
- id: INMA-003
  source_id: INMA
  item_id: INMA-fragment-process
  kind: fact
  status: ready_for_review
  text: пользовательская пригодность продукта является бизнес-вопросом процесса и организации разработки,
    а не только технической или косметической проблемой интерфейса.
  excerpt: по себе, а как бизнес-проблемы процесса и организации разработки.
  artifact: process-before-code.md
  checked_at: '2026-06-25'
  scope:
