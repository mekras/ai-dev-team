  text: описание навыка является главным механизмом срабатывания и должно описывать, когда навык применять,
    а не пересказывать его внутреннее устройство.
  excerpt: >-
    A skill only helps if it gets activated. The `description` field in your
    `SKILL.md` frontmatter is the primary mechanism agents use to decide whether
    to load a skill for a given task.
