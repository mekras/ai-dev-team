  kind: fact
  status: ready_for_review
  text: реализация инкрементного изменения охватывает два этапа — разработку (как создают ПО) и эксплуатацию
    (как команды развёртывают ПО).
  excerpt: инкрементные изменения в нескольких измерениях.
