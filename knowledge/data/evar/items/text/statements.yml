  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: тестопригодность — один из строительных блоков эволюционной архитектуры; функции пригодности на
    основе тестов позволяют проверять целостность характеристик при каждом изменении.
  excerpt: Книга движется от обоснования эволюционной архитектуры к её механизмам (функции
  artifact: ../source/normalized-source.md
