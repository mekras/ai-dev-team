statements:
- id: EVAR-001
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: архитектура с эволюционным развитием поддерживает управляемые, инкрементные изменения в нескольких
    измерениях.
  excerpt: управляемые инкрементные изменения в нескольких измерениях;
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Определение архитектуры с эволюционным развитием
    application: архитектор — рамочное определение цели проектирования архитектуры под изменения.
  open_questions: []
- id: EVAR-002
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: эволюционная архитектура отвечает на вопрос, как вести долгосрочное планирование, когда всё постоянно
    меняется, — за счёт проектирования способности к изменению, а не предсказания конечного состояния.
  excerpt: '`software-architecture`: эволюционная архитектура как стиль управления'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Долгосрочное планирование при постоянных изменениях
    application: архитектор, менеджер проекта.
  open_questions: []
- id: EVAR-003
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: со временем архитектура деградирует («гниёт») по мере непредвиденных изменений; эволюционная архитектура
    защищает важные характеристики, делая их проверяемыми, а не полагаясь на надежду.
  excerpt: '`software-architecture`: эволюционная архитектура как стиль управления'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Защита от постепенной деградации архитектуры
    application: архитектор.
  open_questions: []
- id: EVAR-004
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: инкрементное изменение означает, что архитектура должна способствовать изменению небольшими приращениями
    как на этапе разработки, так и на этапе развёртывания.
  excerpt: 'Инкрементное изменение: изменение системы небольшими приращениями как при'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Инкрементное изменение
    application: архитектор, разработчик.
  open_questions: []
- id: EVAR-005
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: слово «управляемое» в определении означает, что существует цель, к которой архитектура должна
    двигаться; механизм управления — функции пригодности, а ограничения исключают нежелательные направления
    эволюции.
  excerpt: движения к ней; ограничения исключают нежелательные направления эволюции.
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Управляемое изменение
    application: архитектор.
  open_questions: []
- id: EVAR-006
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: архитектура существует во многих измерениях (техническом, данных, безопасности, операционном и
    др.); эволюционная архитектура должна поддерживать изменение во всех важных измерениях одновременно,
    а не только в техническом коде.
  excerpt: '`software-architecture`: эволюционная архитектура как стиль управления'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Многочисленные измерения архитектуры
    application: архитектор, аналитик.
  open_questions: []
- id: EVAR-007
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: организации, проектирующие системы, ограничены дизайном, копирующим структуру их коммуникаций;
    функциональное разделение команд («анклавы») повышает затраты на координацию и снижает гибкость.
  excerpt: 'Закон Конвея: организации, проектирующие системы, ограничены дизайном,'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Закон Конвея
    application: архитектор, менеджер проекта.
  open_questions: []
- id: EVAR-008
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: команды стоит организовывать вокруг целевых границ архитектуры (например, границ сервисов), чтобы
    структура команд напоминала желаемую архитектуру; ThoughtWorks называет этот подход обратным маневром
    Конвея.
  excerpt: 'Обратный маневр Конвея: организация команд вокруг целевых границ архитектуры,'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Обратный маневр Конвея
    application: менеджер проекта, архитектор.
  open_questions: []
- id: EVAR-009
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: вместо разделения по техническим слоям (UI, бэкенд, базы данных) эффективнее межфункциональные
    команды вокруг бизнес-области, включающие все нужные роли, чтобы сократить координацию между анклавами.
  excerpt: Конвея согласует команды с целевыми границами архитектуры.
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Кросс-функциональные команды против анклавов
    application: менеджер проекта, архитектор.
  open_questions: []
- id: EVAR-010
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: архитектурная функция пригодности предоставляет оценку целостности некоторых архитектурных характеристик;
    понятие заимствовано из эволюционных вычислений, где функция пригодности оценивает приближение решения
    к цели.
  excerpt: функция пригодности даёт объективную оценку целостности архитектурной
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Определение функции пригодности
    application: архитектор.
  open_questions: []
- id: EVAR-011
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: функция пригодности всей системы — это набор частных функций пригодности; её не «оценивают», она
    служит основой для приоритезации будущих решений и понимания компромиссов, когда отдельные характеристики
    конфликтуют.
  excerpt: 'Функция пригодности всей системы: набор частных функций пригодности; служит не'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Функция пригодности всей системы
    application: архитектор — управление компромиссами между конкурирующими характеристиками.
  open_questions: []
- id: EVAR-012
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: функции пригодности объединяют разнородные ранее «нефункциональные требования» в один механизм
    (тесты, мониторинг, метрики), делая размытые субъективные критерии конкретными и проверяемыми.
  excerpt: 'Глава 2 «Функции пригодности»: определение функции пригодности, функция'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Функции пригодности как объединяющий механизм
    application: архитектор, аналитик.
  open_questions: []
- id: EVAR-013
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: не все тесты относятся к функциям пригодности; тест является функцией пригодности, только если
    он проверяет целостность характеристики архитектуры.
  excerpt: 'Категории функций пригодности: атомарная и комплексная; триггерная и'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Не каждый тест — функция пригодности
    application: разработчик, архитектор.
  open_questions: []
- id: EVAR-014
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: атомарная функция пригодности проверяет один аспект архитектуры в единичном контексте (например,
    модульный тест связанности модулей); комплексная функция проверяет комбинацию аспектов (например,
    безопасность и масштабируемость вместе), так как взаимодействие характеристик может нарушать каждую
    по отдельности корректную.
  excerpt: 'Глава 2 «Функции пригодности»: определение функции пригодности, функция'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Атомарная и комплексная функции
    application: архитектор.
  open_questions: []
- id: EVAR-015
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: триггерные функции запускаются по событию (модульный тест, запуск конвейера), непрерывные функции
    постоянно проверяют параметры в эксплуатации (например, время транзакций); разработка на основе мониторинга
    (MDD) — пример непрерывной проверки.
  excerpt: 'Глава 2 «Функции пригодности»: определение функции пригодности, функция'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Триггерные и непрерывные функции
    application: архитектор, разработчик.
  open_questions: []
- id: EVAR-016
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: статическая функция имеет фиксированный результат (двоичный, диапазон, включение в множество),
    динамическая опирается на изменяющийся контекст (например, допустимая производительность зависит от
    масштаба).
  excerpt: 'Глава 2 «Функции пригодности»: определение функции пригодности, функция'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Статические и динамические функции
    application: архитектор.
  open_questions: []
- id: EVAR-017
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: большинство функций пригодности следует автоматизировать в конвейере, но некоторые аспекты (юридические
    требования, отдельные процессы обеспечения качества) не поддаются автоматизации и проверяются вручную.
  excerpt: 'Глава 2 «Функции пригодности»: определение функции пригодности, функция'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Автоматизированная и ручная функции
    application: архитектор, специалист по качеству.
  open_questions: []
- id: EVAR-018
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: временная функция пригодности встраивает компонент времени (например, напоминание проверить обновление
    библиотеки шифрования или тест «повреждение при обновлении» для возврата бэкпортированных функций).
  excerpt: 'Функция пригодности всей системы: набор частных функций пригодности; служит не'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Временная функция пригодности
    application: разработчик, архитектор.
  open_questions: []
- id: EVAR-019
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: не все функции пригодности известны в начале проекта; часть из них выявляется по мере эволюции
    системы («неизвестное неизвестное»), поэтому набор функций пригодности развивается.
  excerpt: 'Глава 2 «Функции пригодности»: определение функции пригодности, функция'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Функция с преднамеренным развитием
    application: архитектор.
  open_questions: []
- id: EVAR-020
  source_id: EVAR
  item_id: EVAR-text
  kind: fact
  status: ready_for_review
  text: команды должны идентифицировать функции пригодности на ранней стадии как часть понимания важных
    характеристик; их отсутствие ведёт к рискам неверного дизайна, лишних затрат и неспособности системы
    эволюционировать.
  excerpt: изменением, функции пригодности (категории, ранняя идентификация, конвейер),
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Ранняя идентификация функций пригодности
    application: архитектор, аналитик.
  open_questions: []
