  kind: fact
  status: ready_for_review
  text: эволюционная архитектура предполагает практики непрерывной поставки (Хамбл и Фарлей) как предварительное
    условие проектирования программного обеспечения с возможностью эволюции.
  excerpt: 'Глава 1 «Архитектура программного обеспечения»: определение эволюционной'
