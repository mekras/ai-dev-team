  kind: fact
  status: ready_for_review
  text: конвейер развёртывания применяет функции пригодности к каждому изменению, в отличие от случайной
    (несистематической) проверки важных характеристик.
  excerpt: изменением, функции пригодности (категории, ранняя идентификация, конвейер),
