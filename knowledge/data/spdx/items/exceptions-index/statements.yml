    kind: fact
    text: >-
      Исключения SPDX не являются самостоятельными лицензиями. Они добавляются
      к лицензии в выражении SPDX оператором WITH.
    excerpt: >-
      These exceptions grant an exception to a license condition or additional
      permissions beyond those granted in a license; they are not stand-alone
      licenses. Exceptions are added to a license using the License Expression
      operator, "WITH".
