- id: SCCO-001
  source_id: SCCO
  item_id: SCCO-normalized-SCCO-source.md
  kind: fact
  status: ready_for_review
  text: переход к Scrum рассматривается как организационное изменение, а не как разовое внедрение процесса;
    конечное состояние перехода непредсказуемо, а совершенствование продолжается циклически и после внедрения.
  excerpt: Переход к Scrum — организационное изменение, а не разовое внедрение процесса.
  artifact: source.md
  checked_at: '2026-06-29'
  scope:
    section_title: Внедрение Scrum как изменение
    application: project-manager — рамка для планирования внедрения как длительного изменения, а не разовой
      задачи.
  open_questions: []
- id: SCCO-002
  source_id: SCCO
  item_id: SCCO-normalized-SCCO-source.md
  kind: fact
  status: ready_for_review
  text: успешное внедрение Scrum не достигается исключительно «сверху вниз» или «снизу вверх»; нужны и
    инициатива команд, и поддержка руководства.
  excerpt: 'или «снизу вверх»: нужны и инициатива команд, и поддержка руководства (глава 1).'
  artifact: source.md
  checked_at: '2026-06-29'
  scope:
    section_title: Внедрение Scrum как изменение
    application: project-manager — обоснование совмещения управленческой и командной поддержки внедрения.
  open_questions: []
- id: SCCO-003
  source_id: SCCO
  item_id: SCCO-normalized-SCCO-source.md
  kind: fact
  status: ready_for_review
  text: 'модель ADAPT описывает пять типичных действий перехода: Awareness (осознание), Desire (желание),
    Ability (способность), Promotion (продвижение), Transfer (распространение); осознание, желание и способность
    перекрываются, а продвижение и распространение повторяются на протяжении всего перехода.'
  excerpt: 'Модель `ADAPT` описывает пять типичных действий перехода:'
  artifact: source.md
  checked_at: '2026-06-29'
  scope:
    section_title: Модель ADAPT
    application: project-manager — выбор действий перехода под текущую фазу команды или организации.
  open_questions: []
- id: SCCO-004
  source_id: SCCO
  item_id: SCCO-normalized-SCCO-source.md
  kind: fact
  status: ready_for_review
  text: ADAPT применяется на четырёх уровнях — организации в целом, индивида, команды и отдельного технического
    приёма; люди и команды проходят цикл с разной скоростью.
  excerpt: организации в целом, индивида, команды и отдельного технического приёма; люди и
  artifact: source.md
  checked_at: '2026-06-29'
  scope:
    section_title: Модель ADAPT
    application: project-manager — диагностика уровня, на котором застопорился переход.
  open_questions: []
