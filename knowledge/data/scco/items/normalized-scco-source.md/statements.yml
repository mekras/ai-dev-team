  text: первая ось выбора внедрения — постепенный против одновременного перехода; постепенный снижает
    риск и выращивает собственных специалистов, одновременный выбирают при дефиците времени и для снятия
    «организационного диссонанса».
  excerpt: растит собственных специалистов; одновременный выбирают при дефиците времени и
