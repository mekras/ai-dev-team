  text: 'опыт Scrum распространяют тремя способами: «разделить и засеять» (исходную команду делят, каждая
    часть становится ядром новой), «нарастить и разделить» (команда растёт, затем делится) и внутреннее
    наставничество.'
  excerpt: новых), «нарастить и разделить» (команда растёт, затем делится), внутреннее
