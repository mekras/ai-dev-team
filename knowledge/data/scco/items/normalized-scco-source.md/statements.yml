  source_id: SCCO
  item_id: SCCO-normalized-SCCO-source.md
  kind: fact
  status: ready_for_review
  text: желание (Desire), способность (Ability), продвижение (Promotion) и распространение (Transfer)
    различаются по цели — мотивация перейти, освоение приёмов на практике, распространение опыта успеха
    и перенос Scrum на другие подразделения.
  excerpt: Promotion (продвижение) — распространение опыта успеха.
