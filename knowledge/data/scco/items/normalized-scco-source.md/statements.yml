  item_id: SCCO-normalized-SCCO-source.md
  kind: fact
  status: ready_for_review
  text: осознание (Awareness) — признание того, что текущий процесс не даёт приемлемых результатов; инструменты
    осознания нужны, пока люди путают движение с прогрессом или полагаются на собственную пропаганду успехов.
  excerpt: Awareness (осознание) — признание, что текущий процесс не даёт приемлемых
  artifact: source.md
