- id: ADRG-004
  source_id: ADRG
  item_id: ADRG-normalized-ADRG-source.md
  kind: fact
  text: сайт adr.github.io ставит три цели — обосновать пользу фиксации архитектурных
    решений и закрепить единую терминологию, развивать инструменты поддержки ADR и
    собирать общедоступные ресурсы по управлению архитектурными знаниями (AKM) и ADR.
  excerpt: 'Сайт ставит три цели: обосновать необходимость и пользу фиксации архитектурных
    решений и закрепить единую терминологию; развивать инструменты поддержки ADR для
    гибкой итеративной разработки; собирать общедоступные ресурсы по управлению архитектурными
    знаниями (AKM) и ADR.'
  artifact: source.md
