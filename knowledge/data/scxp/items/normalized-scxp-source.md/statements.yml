  source_id: SCXP
  item_id: SCXP-normalized-SCXP-source.md
  kind: fact
  status: ready_for_review
  text: 'история в практике команды описывается шестью прижившимися полями: ID, название (2–10 слов),
    важность, предварительная оценка в story point, «как продемонстрировать» и примечания.'
  excerpt: (числовая, чем больше — тем важнее), предварительная оценка в story point, поле
  artifact: source.md
