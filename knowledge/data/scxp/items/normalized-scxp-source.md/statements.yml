  text: product backlog — упорядоченный по важности список историй (user story), описанных на понятном
    заказчику языке; у продукта один backlog и один владелец продукта.
  excerpt: Аналитик, владелец продукта — ведение product backlog, поля историй, важность,
  artifact: source.md
