  text: важность и объём истории определяет владелец продукта, оценку трудозатрат — только команда; заинтересованные
    лица могут добавлять истории, но не назначать важность и оценку.
  excerpt: команда. Заинтересованные лица могут добавлять истории, но не назначать важность
