  item_id: SCXP-normalized-SCXP-source.md
  kind: fact
  status: ready_for_review
  text: 'при нехватке времени на планировании жертвуют по приоритету: цель и дата демо → список историй
    → оценки → «как продемонстрировать» → расчёты производительности → время и место Scrum → разбиение
    на задачи.'
  excerpt: 'того, чем жертвовать при нехватке времени: цель и дата демо (минимум) → список'
