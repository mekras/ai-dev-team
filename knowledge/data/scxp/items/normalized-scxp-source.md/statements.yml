- id: SCXP-004
  source_id: SCXP
  item_id: SCXP-normalized-SCXP-source.md
  kind: fact
  status: ready_for_review
  text: важность задаёт только относительный порядок историй, а не кратность; между значениями оставляют
    целочисленные промежутки, а важнейшие истории получают уникальные значения.
  excerpt: 'Важность задаёт лишь порядок: разрыв между значениями не означает кратности'
  artifact: source.md
  checked_at: '2026-06-29'
  scope:
    section_title: Ведение product backlog
    application: владелец продукта — устойчивая приоритизация с возможностью вставлять новые истории.
