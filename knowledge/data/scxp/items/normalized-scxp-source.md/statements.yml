- id: SCXP-003
  source_id: SCXP
  item_id: SCXP-normalized-SCXP-source.md
  kind: fact
  status: ready_for_review
  text: поле «как продемонстрировать» — краткий тестовый сценарий «сделай это — должно получиться то»,
    а при TDD оно служит основой приёмочного теста истории.
  excerpt: «как продемонстрировать» (краткий тестовый сценарий «сделай это — получишь то»)
  artifact: source.md
