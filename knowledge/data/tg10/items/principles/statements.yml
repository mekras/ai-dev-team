    kind: fact
    status: verified
    text: >-
      TOGAF 10 предполагает адаптацию общих понятий и практик к настроенной
      практике архитектуры предприятия конкретной организации.
    excerpt: >-
      Организация должна адаптировать их к собственной настроенной практике
    artifact: normalized.md
