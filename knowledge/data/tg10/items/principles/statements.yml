  - id: TG10-006
    source_id: TG10
    item_id: TG10-principles
    kind: limitation
    status: verified
    text: >-
      Публичный каталог TOGAF 10 не заменяет нормативный текст. Определения,
      критерии качества и шаблон архитектурного принципа нужно проверять в
      лицензированном документе ADM Techniques.
    excerpt: >-
      Полные определения, критерии хорошего принципа и рекомендуемый шаблон
      нужно проверять в актуальном лицензированном тексте ADM Techniques.
    artifact: normalized.md
