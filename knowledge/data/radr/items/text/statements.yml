  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: домен API следует дополнять субдоменом `api` (например, api.soccer.restapi.org`), а портал разработчика
    — субдоменом `developer`.
  excerpt: расширений файлов; согласованные субдомены (`api.`, `developer.`); архетипы
