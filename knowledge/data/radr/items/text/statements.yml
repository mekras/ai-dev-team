  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: код 200 не должен использоваться для передачи ошибок в теле ответа.
  excerpt: проектирования веб-ориентированных REST API; каждое правило сохраняет
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: 200 не для ошибок в теле
    application: разработчик.
