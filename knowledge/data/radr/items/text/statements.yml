  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: компонент query допустимо использовать для фильтрации коллекций и хранилищ (например, `GET /users?role=admin`).
  excerpt: CRUD-функций в URI; переменные сегменты URI; query для фильтрации и пагинации
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
