  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: код 201 («Created») обязательно используется при создании ресурса в collection, добавлении в store
    или создании ресурса в результате действия контроллера.
  excerpt: множественном — для collection и store, глагол для controller); запрет имён
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: 201 для успешного создания ресурса
    application: разработчик.
  open_questions: []
