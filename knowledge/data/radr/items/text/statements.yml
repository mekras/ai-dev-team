  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: код 301 («Moved Permanently») следует использовать при значительной переработке модели ресурсов
    с присвоением нового постоянного URI, указанного в заголовке `Location`.
  excerpt: '`Last-Modified`, `ETag`, `Location`; условные запросы к store'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: 301 для постоянного перемещения
    application: архитектор.
