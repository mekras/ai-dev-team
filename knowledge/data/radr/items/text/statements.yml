  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: имена CRUD-функций в URI использоваться не должны; функцию должен обозначать HTTP-метод, а не
    путь (анти-паттерн `GET /deleteUser?id=1234`).
  excerpt: CRUD-функций в URI; переменные сегменты URI; query для фильтрации и пагинации
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
