  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: для пагинации результатов следует использовать query-параметры pageSize` (максимум элементов)
    и `pageStartIndex` (нулевой индекс первого элемента).
  excerpt: (`pageSize`, `pageStartIndex`).
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Query для пагинации
    application: разработчик.
