  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: POST обязательно используется для вызова контроллеров; метод неидемпотентен и небезопасен, поэтому
    подходит для операций, не отображаемых на другие методы.
  excerpt: проектирования веб-ориентированных REST API; каждое правило сохраняет
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: POST для запуска контроллеров
    application: разработчик.
  open_questions: []
- id: RADR-030
  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: DELETE обязательно используется для полного удаления ресурса из родителя; после удаления любой
    GET/HEAD к нему должен возвращать 404. «Мягкое» удаление следует делать через controller и POST.
  excerpt: mutable-ресурсов), POST (создание в collection и запуск controller), DELETE
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: DELETE для удаления
    application: разработчик.
  open_questions: []
- id: RADR-031
  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: 'OPTIONS следует использовать для получения метаданных о доступных взаимодействиях с ресурсом,
    включая заголовок `Allow` (например, Allow: GET, PUT, DELETE`).'
  excerpt: проектирования веб-ориентированных REST API; каждое правило сохраняет
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: OPTIONS для метаданных взаимодействий
    application: разработчик.
