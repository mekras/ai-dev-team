  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: код 200 («OK») следует использовать для обозначения успеха, когда нет более точного кода 2xx;
    ответ 200 должен включать тело.
  excerpt: проектирования веб-ориентированных REST API; каждое правило сохраняет
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
