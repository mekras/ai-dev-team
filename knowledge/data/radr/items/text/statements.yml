  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: коллекцию (collection) следует именовать существительным во множественном числе, отражающим содержимое.
  excerpt: множественном — для collection и store, глагол для controller); запрет имён
