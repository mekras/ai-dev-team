  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: ресурс-документ (document) следует именовать существительным или именной группой в единственном
    числе.
  excerpt: ресурсов и их имена (существительное в единственном числе для document, во
