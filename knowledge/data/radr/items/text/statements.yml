  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: код 202 («Accepted») обязательно используется для обозначения успешного запуска асинхронной операции;
    его могут отправлять контроллеры, но не другие типы ресурсов.
  excerpt: единообразного интерфейса (идентификация ресурсов, манипуляция через
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: 202 для асинхронного старта
    application: разработчик.
  open_questions: []
- id: RADR-036
  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: код 204 («No Content») следует использовать, когда тело ответа намеренно пустое — обычно при PUT,
    POST или DELETE.
  excerpt: mutable-ресурсов), POST (создание в collection и запуск controller), DELETE
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: 204 для пустого тела
    application: разработчик.
  open_questions: []
