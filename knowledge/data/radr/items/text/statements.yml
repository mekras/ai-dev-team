- id: RADR-023
  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: GET и POST не должны использоваться для туннелирования других методов запроса, чтобы не нарушать
    прозрачность протокола.
  excerpt: 'Назначение HTTP-методов и кодов состояния: запрет туннелирования через GET/POST;'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: Запрет туннелирования методов
    application: разработчик.
  open_questions: []
- id: RADR-024
  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: GET обязательно используется для получения представления состояния ресурса; запрос GET не должен
    иметь тела и должен быть безопасным (без побочных эффектов).
  excerpt: 'Структура тела ответа и гипермедиа: JSON как формат представления и требование'
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: GET для получения представления
    application: разработчик.
  open_questions: []
- id: RADR-025
  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: HEAD следует использовать для получения тех же заголовков, что и GET, но с пустым телом — например,
    чтобы проверить существование ресурса или прочитать метаданные.
  excerpt: проектирования веб-ориентированных REST API; каждое правило сохраняет
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: HEAD для заголовков
    application: разработчик.
  open_questions: []
- id: RADR-026
  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: PUT обязательно используется и для добавления нового ресурса в store по заданному клиентом URI,
    и для обновления или замены уже хранимого ресурса.
  excerpt: проектирования веб-ориентированных REST API; каждое правило сохраняет
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: PUT для вставки и обновления в store
    application: разработчик.
  open_questions: []
- id: RADR-027
  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: для внесения изменений в изменяемые ресурсы клиенты обязательно используют метод PUT с телом,
    отражающим желаемые изменения.
  excerpt: проектирования веб-ориентированных REST API; каждое правило сохраняет
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: PUT для изменения mutable-ресурсов
    application: разработчик.
  open_questions: []
- id: RADR-028
  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: POST обязательно используется для создания нового ресурса внутри коллекции; тело содержит предлагаемое
    начальное состояние ресурса.
  excerpt: mutable-ресурсов), POST (создание в collection и запуск controller), DELETE
  artifact: ../source/normalized-source.md
  checked_at: '2026-06-24'
  scope:
    section_title: POST для создания в collection
    application: разработчик.
  open_questions: []
