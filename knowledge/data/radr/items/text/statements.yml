  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: когда сложность фильтрации или пагинации превышает возможности query, следует завести специальный
    controller (например, POST /users/search`), принимающий параметры в теле запроса.
  excerpt: CRUD-функций в URI; переменные сегменты URI; query для фильтрации и пагинации
  artifact: ../source/normalized-source.md
