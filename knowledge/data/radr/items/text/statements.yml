  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: ресурс-контроллер (controller) следует именовать глаголом или глагольной группой, обозначающей
    действие (например, `register`, `dedupe`).
  excerpt: проектирования веб-ориентированных REST API; каждое правило сохраняет
