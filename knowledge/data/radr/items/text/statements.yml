  source_id: RADR
  item_id: RADR-text
  kind: fact
  status: ready_for_review
  text: клиенты должны считать URI единственными осмысленными идентификаторами ресурсов; внутренние ID
    бэкенда для клиента бессмысленны.
  excerpt: единообразного интерфейса (идентификация ресурсов, манипуляция через
  artifact: ../source/normalized-source.md
