public_reference: https://json-schema.org/draft/2020-12/
license_or_terms: >-
  Документ опубликован по условиям IETF Trust. Кодовые компоненты имеют
  отдельные условия Revised BSD License.
access:
  default: >-
    Официальная спецификация доступна публично. Перед копированием фрагментов
    проверять условия IETF Trust и статус документа.
reliability: official
stability: versioned
refresh_policy: manual
last_checked_at: "2026-07-31"
scope:
