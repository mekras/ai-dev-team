allowed_use: >-
  Точечная проверка типов JSON, перечислений, констант, диапазонов, длины,
  шаблонов, обязательных свойств и ограничений коллекций.
requires_access_check: true
url: https://json-schema.org/draft/2020-12/json-schema-validation
