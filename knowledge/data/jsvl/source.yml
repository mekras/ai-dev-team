    - числовые и строковые ограничения
    - обязательные свойства и ограничения коллекций
    - различие проверки и аннотации format
  excludes:
    - семантическая предметная модель
    - автоматическое отображение в схему базы данных
known_limitations:
  - Draft 2020-12 опубликован как Internet-Draft, а не стандарт ISO.
