id: JSVL-validation
source_id: JSVL
title: "JSON Schema Draft 2020-12: Validation"
url: https://json-schema.org/draft/2020-12/json-schema-validation
date_published: "2022-06-16"
access: >-
  Официальная спецификация доступна публично. Полный текст не копировать.
status: approved
workflow_stage: source_checked
processing_scope: selected_fragments
retrieval_mode: on_demand
copy_policy: no_bulk_copy
allowed_use: >-
  Получать только разделы со словами проверки, нужными для конкретного
  отображения модели в JSON Schema.
requires_access_check: true
known_limitations:
  - Поддержка отдельных слов зависит от реализации JSON Schema.
files:
  tracked:
    - normalized.md
    - statements.yml
processing_notes:
  - >-
    Проверены официальный адрес, дата и статус документа, оглавление словаря и
    условия IETF Trust.
  - >-
    Нормализованы разделы 6 и 7 о типах, значениях, диапазонах, строках,
    коллекциях, объектах и режимах format.
