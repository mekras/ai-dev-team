    source_id: DMAV
    item_id: DMAV-guidance
    kind: fact
    text: >-
      Концептуальная модель отражает сущности, отношения и свойства предметной
      области, логическая приближает их к классу технологии хранения, а
      физическая описывает реализацию и оптимизации.
    excerpt: "Conceptual. Logical. Physical."
    artifact: normalized.md
