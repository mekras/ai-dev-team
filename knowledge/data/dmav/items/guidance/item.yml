id: DMAV-guidance
source_id: DMAV
title: "SEI: модель данных как архитектурное представление"
url: https://www.sei.cmu.edu/library/data-model-as-an-architectural-view/
date_published: "2009-10-01"
access: >-
  Официальная страница и PDF доступны публично. Полный текст не копировать.
status: approved
workflow_stage: source_checked
processing_scope: selected_fragments
retrieval_mode: on_demand
copy_policy: no_bulk_copy
allowed_use: >-
  Получать только разделы, необходимые для проверки места и состава модели
  данных, со ссылкой на страницу или раздел PDF.
requires_access_check: true
known_limitations:
  - Сведения требуют сопоставления с более новыми нормативными источниками.
files:
  tracked:
    - normalized.md
    - statements.yml
processing_notes:
  - >-
    Проверены официальная карточка публикации, автор, дата, номер отчёта, DOI и
    доступность PDF.
  - >-
    Нормализованы выбранные разделы 1.1, 2, 3, 8 и 9. Извлечены утверждения о
    месте, уровнях и составе модели данных.
