    open_questions: []
  - id: SQLT-005
    source_id: SQLT
    item_id: SQLT-schema-constraints
    kind: limitation
    text: >-
      Физические ограничения SQLite не определяют смысл предметного свойства и
      не переносятся автоматически на другие СУБД.
    excerpt: "unlike most SQL databases"
    artifact: normalized.md
