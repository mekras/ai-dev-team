    item_id: SQLT-schema-constraints
    kind: fact
    text: >-
      Определение таблицы SQLite может задавать объявленные типы, значения по
      умолчанию, ключи, уникальность, отсутствие `NULL`, проверочные условия,
      внешние ключи и вычисляемые столбцы.
    excerpt: "constraints on the table content"
