id: UMOC
slug: umoc
title: >-
  Официальные спецификации OMG Unified Modeling Language 2.5.1 и Object
  Constraint Language 2.4.
status: approved
priority: high
carrier_type: document
source_kind: normative
long_source: false
adapter: manual
storage_strategy: external_reference
processing_scope: selected_fragments
retrieval_mode: on_demand
copy_policy: no_bulk_copy
allowed_use: >-
  Точечная проверка типов, свойств, кратностей, перечислений, ассоциаций и
  ограничений модели по официальным редакциям спецификаций.
requires_access_check: true
url: https://www.omg.org/spec/UML/
locator: https://www.omg.org/spec/UML/2.5.1
public_reference: https://www.omg.org/spec/OCL/2.4/
license_or_terms: >-
  Спецификации доступны публично, но содержат уведомления OMG об авторских
  правах. Полные тексты в корпус не копируются.
access:
  default: >-
    Официальные страницы и нормативные PDF доступны публично. Перед переносом
    фрагментов проверять уведомления конкретной редакции.
reliability: official
stability: versioned
refresh_policy: manual
last_checked_at: "2026-07-31"
scope:
  includes:
    - свойства и типы
    - кратности и ассоциации
    - перечисления и ограничения
    - инварианты, предусловия и постусловия
  excludes:
    - обязательное применение UML или OCL
    - локальная копия полных спецификаций
known_limitations:
  - UML и OCL задают языки моделирования, а не готовую предметную модель.
items:
  - id: UMOC-specifications
    source_id: UMOC
    title: "OMG UML 2.5.1 и OCL 2.4"
    access: >-
      Официальные страницы и PDF доступны публично. Полные тексты не
      копировать.
    status: approved
    workflow_stage: source_checked
    path: items/specifications/item.yml
