  - id: UMOC-001
    source_id: UMOC
    item_id: UMOC-specifications
    kind: fact
    text: >-
      UML определяет тип как множество допустимых значений, а значение
      типизированного элемента должно принадлежать указанному типу.
    excerpt: "set of allowed values"
    artifact: normalized.md
    checked_at: "2026-07-31"
    checked_by: primary-agent
    locator: "UML 2.5.1, раздел 7.5.3.1"
    scope:
      applies_to: [типизированные элементы модели]
      does_not_apply_to: [физический формат хранения]
    processing_status: &complete
      extraction: complete
      traceability: passed
      semantic_review: passed
      strong_review: not_required
      corroboration_check: complete
    source_role: primary
    evidence_strength: strong
    confidence: high
    temporal_status: current
    corroboration: independently_confirmed
    limitations: []
