    source_id: UMOC
    item_id: UMOC-specifications
    kind: fact
    text: >-
      Свойство UML связывает экземпляр классификатора с одним значением или
      набором значений указанного для свойства типа.
    excerpt: "value or set of values"
    artifact: normalized.md
