    source_id: UMOC
    item_id: UMOC-specifications
    kind: fact
    text: >-
      Кратность UML ограничивает число значений нижней и верхней границами и
      позволяет отдельно задать упорядоченность и уникальность набора.
    excerpt: "valid cardinalities"
    artifact: normalized.md
    checked_at: "2026-07-31"
    checked_by: primary-agent
    locator: "UML 2.5.1, раздел 7.5.3.2"
    scope:
