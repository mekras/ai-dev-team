    synonyms_by_source:
      ADRG: Architectural Decision (AD)
    collisions:
      - не путать с записью решения (ADR) и с организационным решением (ODR в
        decision-workflow.md).

  - id: architecturally-significant-requirement
    primary: архитектурно значимое требование
    primary_ru: архитектурно значимое требование
    definition: Требование, оказывающее существенное влияние на архитектуру системы.
    boundaries:
      includes: [требование, ограничивающее архитектурный выбор]
