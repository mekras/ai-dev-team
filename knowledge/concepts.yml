# Слой согласования понятий
#
# Промежуточный указательный слой между корпусом знаний (`knowledge/data/`) и
# продуктом (`.apm/skills/`). Назначение: закрепить основную форму понятия,
# собрать синонимы по источникам и РАЗРЕШИТЬ конфликты и ложные противоречия
# между утверждениями разных источников до того, как из них строится навык.
#
# Принципы:
# - слой НЕ хранит контент (примеры, шаблоны, прозу) — только указатели и
#   мета-синтез (согласование). Содержание живёт в навыках, обоснования — в
#   утверждениях корпуса.
# - основная форма выбирается по правилу: норматив (ГОСТ) > книга > решение
#   владельца.
# - запись заводится по требованию: понятие встречается в ≥2 источниках или
#   вызывает коллизию.
# Решение о слое: docs/adr/0001-concepts-reconciliation-layer.md
#
# Поля записи:
#   id                 — устойчивый идентификатор (kebab-case)
#   primary_ru         — основная русская форма
#   definition_ru      — краткое каноническое определение с выбранными формами
#   forms_ru/forms_en  — допустимые альтернативные формы
#   authority          — источник основной формы и определения
#   defined_by         — идентификаторы утверждений-обоснований
#   cite_as            — какие источники показывать пользователю или указывать
#                        как основание в производных материалах
#   covered_in         — где в продукте лежит содержание
#   synonyms_by_source — какой термин использует каждый источник
#   reconciliation     — разрешение согласований и конфликтов между источниками
#   collisions         — омонимы и понятия, которые нельзя путать
#   gaps               — известные разрывы (со ссылкой на BACKLOG.md)

concepts:
  - id: guiding-statement
    primary_ru: направляющее положение
    forms_ru:
      - общий ориентир
      - принцип
      - политика
      - метатребование
    forms_en:
      - guiding statement
      - principle
      - policy
    definition_ru: >-
      положение между краткой концепцией и конкретными требованиями, которое
      раскрывает общее направление, допустимый способ выбора или границу для
      нескольких требований и решений, но не обязано иметь собственный
      измеримый критерий приёмки.
    authority: решение владельца продукта от 2026-07-27
    defined_by:
      - AM32-003
      - AM32-004
      - AM32-005
      - TG10-003
      - TG10-004
      - TG10-005
      - BMM-002
      - BMM-003
      - BMM-004
      - BMM-007
    cite_as: [AM32, TG10, BMM]
    covered_in:
      - ait-req-analysis/SKILL.md
      - ait-req-analysis/references/guiding-statements.md
      - ait-req-management/SKILL.md
      - ait-req-revalidation/SKILL.md
    synonyms_by_source:
      AM32: Goal и Principle в области Motivation
      TG10: Business Principles, Goals, and Drivers и Architecture Principles
      BMM: Ends, Means и Business Policy
      OWNER-2026-07-27: промежуточный слой между концепцией и требованиями
    reconciliation:
      - >-
        «Направляющее положение» — нейтральная форма продукта, а не новый
        элемент объединённой метамодели. Проект может использовать собственные
        термины и связи либо явно выбрать один из внешних подходов.
      - >-
        Термин «метатребование» допустим только при явном определении проекта:
        без него он может означать как общий ориентир продукта, так и требование
        к качеству или оформлению самих требований.
    collisions:
      - >-
        Не путать с требованием к системе. Направляющее положение может быть
        источником требований, но само не обязано задавать проверяемое
        поведение или измеримый результат.
      - >-
        Не считать Goal и Principle ArchiMate, Architecture Principles TOGAF и
        Business Policy BMM взаимозаменяемыми.

  - id: architecture-principle
    primary_ru: архитектурный принцип
    forms_ru: [направляющий архитектурный принцип]
    forms_en: [architecture principle, principle]
    definition_ru: >-
      направляющее положение архитектурной работы, которое хранится отдельно
      от конкретных требований. Точная семантика и допустимые связи зависят от
      выбранного подхода.
    authority: >-
      AM32 и TG10. Общая русская форма совпадает, а значения не объединяются.
    defined_by: [AM32-003, AM32-004, TG10-003, TG10-004]
    cite_as: [AM32, TG10, BMM]
    synonyms_by_source:
      AM32: Principle в области Motivation
      TG10: Architecture Principle
      BMM: Business Policy — связанное, но не тождественное понятие
    reconciliation:
      - >-
        В ArchiMate Principle — элемент модели мотивации рядом с Goal,
        Requirement и Constraint. В TOGAF Architecture Principles —
        самостоятельный результат и техника архитектурной работы. Одинаковое
        название не означает одинаковый договор хранения и применения.
      - >-
        Business Policy в BMM выполняет близкую направляющую функцию, но
        относится к Means и раскрывается через Business Rules. Поэтому она не
        считается прямым синонимом архитектурного принципа.
    collisions:
      - >-
        Не путать архитектурный принцип с проверяемым требованием. Принцип
        направляет выбор и порождение требований, но не обязан сам задавать
        измеримый критерий приёмки.
      - >-
        Не считать Principle ArchiMate, Architecture Principle TOGAF и Business
        Policy BMM взаимозаменяемыми без явного выбора подхода.
    related_concepts: [guiding-statement]

  - id: project-reconstructability
    primary_ru: реконструируемость проекта
    forms_ru:
      - восстановление проекта по спецификациям
      - реконструируемая кодовая база
    forms_en:
      - project reconstructability
      - rebuildability
      - rebuildable codebase
    definition_ru: >-
      свойство выбранной области проекта, при котором канонические входы
      вместе с зафиксированным контуром исполнения позволяют повторно создать
      производные артефакты и подтвердить заданную эквивалентность результата.
    authority: решение владельца продукта от 2026-07-23
    defined_by:
      - SDDP-002
      - SDDP-004
      - SPKT-001
      - SPKT-002
      - AUGR-001
      - AUGR-002
      - AUGR-003
    cite_as: [SDDP, SPKT, AUGR]
    covered_in:
      - ait-reconstructability/SKILL.md
      - ../../docs/requirements/functional/ft-19.md
    synonyms_by_source:
      SDDP: spec-as-source
      SPKT: specification-driven development
      AUGR: rebuildable codebase
      OWNER-2026-07-23: реконструируемость проекта
    reconciliation:
      - >-
        SDDP и SPKT определяют первичность спецификации, а AUGR добавляет
        практическую проверку восстановления. Продукт использует
        «реконструируемость проекта» для проверяемого свойства и сохраняет
        spec-as-source как предельный способ его достижения.
    collisions:
      - >-
        Не путать с восстанавливаемостью после эксплуатационного отказа:
        реконструируемость относится к повторному созданию артефактов из
        канонических входов.
      - >-
        Не путать с воспроизводимой сборкой: она начинается с исходного кода и
        требует побитово одинаковой сборки, а реконструируемость может включать
        повторное создание исходного кода и проверяться по поведению.

  - id: project-profile
    primary_ru: профиль проекта
    forms_ru: [характер проекта, тип проекта, класс проекта]
    forms_en: [project profile, project type, project class]
    definition_ru: >-
      многозначное описание форм результата проекта, его основных
      пользователей, способов взаимодействия и поставки, которое определяет
      применимые маршруты настройки, вопросы и проверки.
    authority: решение владельца продукта от 2026-07-22
    defined_by: [SREQ-076, SREQ-086, SREQ-091, SREQ-094, SREQ-098, SREQ-100, SREQ-102, SREQ-138]
    cite_as: [SREQ]
    covered_in:
      - ait-setup/references/setup-dialogue.md
      - ../../docs/requirements/functional/ft-18.md
    synonyms_by_source:
      SREQ: класс проекта
      OWNER-2026-07-22: характер проекта
    reconciliation:
      - >-
        Классы проектов из SREQ описывают условия разработки и подтверждают
        необходимость адаптации процесса, но не задают закрытый перечень форм
        продукта. Профиль настройки дополнительно описывает результат,
        пользователей, взаимодействие и поставку по решению владельца.
    collisions:
      - >-
        Не путать профиль проекта с одним языком, стеком, найденным файлом или
        методологией разработки; смешанный проект может иметь несколько форм и
        способов поставки.

  - id: commit-message-scheme
    primary_ru: схема сообщений коммитов
    forms_ru: [схема оформления коммитов]
    forms_en: [commit message convention, commit guidelines]
    definition_ru: >-
      выбранное проектом правило структуры и формулировки сообщений коммитов.
    authority: решение владельца продукта от 2026-07-21
    defined_by: [CCMT-001, GTMJ-001, PGIT-001, PGIT-002]
    cite_as: [CCMT, GTMJ, PGIT]
    covered_in:
      - ait-commit-messages/references/schemes.md
      - ait-setup/references/setup-dialogue.md
    synonyms_by_source:
      CCMT: Conventional Commits
      GTMJ: Gitmoji
      PGIT: Commit Guidelines
    reconciliation:
      - >-
        Источники описывают альтернативные схемы, а не одну объединённую:
        Conventional Commits задаёт машинно-читаемую структуру, Gitmoji —
        визуальное намерение, Pro Git — человекочитаемый заголовок и тело.
    collisions:
      - >-
        Не путать схему сообщений коммитов с политикой состава коммита,
        добавления файлов в индекс Git или выпуска версии.

  - id: personal-data
    primary_ru: персональные данные
    forms_en: [personal data]
    definition_ru: >-
      любая информация, относящаяся прямо или косвенно к определённому или
      определяемому физическому лицу.
    authority: RUPD
    defined_by: [RUPD-001]
    cite_as: [RUPD, RKN]
    covered_in:
      - ait-personal-data/SKILL.md
    synonyms_by_source:
      RUPD: персональные данные
      RKN: ПД
    reconciliation:
      - >-
        В продукте используется полная форма «персональные данные»; сокращение
        «ПД» сохраняется только в идентификаторах и точных названиях источников.
    collisions:
      - >-
        Не путать с обезличенными данными: вопрос о возможности идентификации
        оценивается по применимым нормам и фактам конкретной обработки.

  - id: personal-data-operator
    primary_ru: оператор персональных данных
    forms_en: [personal data operator, controller]
    definition_ru: >-
      лицо или орган, организующие или осуществляющие обработку персональных
      данных и определяющие её цели, состав данных и операции.
    authority: RUPD
    defined_by: [RUPD-001, RUPD-003, RKN-001]
    cite_as: [RUPD, RKN]
    covered_in:
      - ait-personal-data/SKILL.md
      - ait-personal-data/references/russian-personal-data-workflow.md
    synonyms_by_source:
      RUPD: оператор
      RKN: оператор персональных данных
    reconciliation:
      - >-
        Английское controller не подменяет российское нормативное понятие;
        при анализе договора отдельно устанавливается фактическая роль стороны.
    collisions:
      - >-
        Не путать с лицом, которому поручена обработка: поручение не снимает с
        оператора обязанность определить цели и условия обработки.

  - id: personal-data-processing
    primary_ru: обработка персональных данных
    forms_en: [personal data processing]
    definition_ru: >-
      действия или совокупность действий с персональными данными, которые
      анализируются по цели, основанию, составу данных, операциям и участникам.
    authority: RUPD
    defined_by: [RUPD-002, RUPD-003, RKN-002, RKN-003]
    cite_as: [RUPD, RKN]
    covered_in:
      - ait-personal-data/SKILL.md
      - ait-personal-data/references/russian-personal-data-workflow.md
    synonyms_by_source:
      RUPD: обработка персональных данных
      RKN: обработка ПД
    reconciliation:
      - >-
        Матрица навыка рассматривает каждую цель обработки отдельно, не
        объединяя разные основания и получателей в одну запись.
    collisions:
      - >-
        Не путать обработку с хранением: хранение — одна из операций, а не
        самостоятельное универсальное основание.

  - id: prompt-injection
    primary_ru: внедрение инструкций
    forms_ru: [инъекция промпта, внедрение инструкций в запрос]
    forms_en: [prompt injection, indirect prompt injection]
    definition_ru: атака, при которой недоверенный ввод или содержимое пытается
      изменить инструкции, контекст или действия ИИ-системы вопреки её цели и
      установленным ограничениям.
    authority: OWSP
    cite_as: [OWSP, ATLS]
    covered_in:
      - ait-sec-ai/SKILL.md
      - ait-sec-ai/references/ai-security-scope.md
    synonyms_by_source:
      OWSP: prompt injection
      ATLS: prompt injection
    reconciliation:
      - основная русская форма описывает воздействие на инструкции; английские
        формы допустимы при ссылке на внешний источник.
    collisions:
      - не путать с обычным запросом пользователя и с безопасной системной
        инструкцией; опасность определяется недоверенным происхождением и
        изменением установленного поведения.

  - id: agentic-ai-system
    primary_ru: агентная ИИ-система
    forms_ru: [ИИ-агент, агент с действиями от имени человека]
    forms_en: [agentic AI system, AI agent]
    definition_ru: система ИИ, которая получает контекст, выбирает или вызывает
      средства и способна выполнять действия в пределах предоставленных ей
      полномочий и заданной автономности.
    authority: OWSP
    cite_as: [OWSP, AIGD]
    covered_in:
      - ait-sec-ai/SKILL.md
      - ait-sec-ai/references/ai-security-scope.md
    synonyms_by_source:
      OWSP: agentic application
      AIGD: agentic AI service
    reconciliation:
      - все формы описывают ИИ с доступом к средствам и последствиями за
        пределами текстового ответа; в продукте основная форма — «агентная
        ИИ-система».
    collisions:
      - не путать с моделью без средств и полномочий на действия; она может быть
        частью агентной ИИ-системы, но не равна ей.

  - id: hypothesis-record
    primary_ru: запись гипотезы
    forms_ru: [запись проектной гипотезы]
    forms_en: [hypothesis record]
    definition_ru: отдельная запись проверяемого предположения о том, что в
      заданных условиях действие или изменение приведёт к наблюдаемому эффекту;
      содержит основание, критерии и ход проверки, свидетельства, вывод, условие
      повторного рассмотрения и связи с последующими решениями.
    authority: решение владельца (2026-07-10)
    defined_by: [EVAR-026, EVAR-047, CHAE-003]
    cite_as: [EVAR, CHAE]
    covered_in:
      - ait-hypotheses/SKILL.md
      - ait-hypotheses/references/hypothesis-workflow.md
      - ait-hypotheses/assets/hypothesis-record-template.md
      - ait-hypotheses/assets/hypothesis-index-template.md
    synonyms_by_source:
      EVAR: проверяемая гипотеза в разработке на основе гипотез и данных
      CHAE: гипотеза, которую пытаются опровергнуть экспериментом
    reconciliation:
      - источники задают проверяемую гипотезу и обучение на результатах;
        решение владельца и ADR-0003 задают долговечную запись, обязательный
        отдельный файл и связь с записью решения.
    collisions:
      - >-
        не путать с записью решения: подтверждение гипотезы даёт свидетельство,
        но не фиксирует выбор.
      - не путать с идеей или открытым вопросом без проверяемого предсказания.

  - id: decision-record
    primary_ru: запись решения
    forms_ru: [запись проектного решения]
    forms_en: [decision record]
    definition_ru: запись, фиксирующая одно значимое проектное решение любого
      вида (архитектурное — ADR, организационное — ODR, по документации — DDR и
      другие; набор видов открытый) с контекстом и проблемой, рассмотренными
      вариантами, решением с обоснованием, последствиями и способом проверки.
    authority: ADRG
    defined_by: [ADRG-014, ADRG-001]
    cite_as: [ADRG]
    covered_in:
      - ait-decisions/SKILL.md
      - ait-decisions/references/decision-workflow.md
      - ait-decisions/references/decision-templates.md
    synonyms_by_source:
      ADRG: ADR, расширенный с архитектурных на любые организационные решения
    reconciliation:
      - обобщённая форма «запись решения» введена решением владельца
        (ADR-0002, 2026-07-09) на основании ADRG-014; общая дисциплина записи
        (тест значимости, пространство вариантов, статусная модель, минимум
        секций) едина для всех видов и живёт в сквозном навыке ait-decisions,
        профильные навыки задают только предметную ось своего вида.
    collisions:
      - не путать с записью архитектурного решения (ADR) — это один из видов
        записи решения; см. architectural-decision-record.

  - id: decision-record-status
    primary_ru: статус записи решения
    forms_ru: [статус записи решения, статус решения, статусная модель решений]
    forms_en: [decision status, ADR status]
    definition_ru: состояние записи в жизненном цикле решения; продукт различает
      ожидающее предложение, принятое решение, отклонённое предложение,
      устаревшее решение и решение, заменённое другой записью.
    authority: ADRG
    defined_by: [ADRG-011]
    cite_as: [ADRG]
    covered_in:
      - ait-decisions/SKILL.md
      - ait-decisions/references/decision-workflow.md
      - ait-decisions/references/decision-templates.md
    synonyms_by_source:
      ADRG: proposed, accepted, deprecated, superseded
    reconciliation:
      - >-
        ADRG-011 задаёт четыре исходных состояния — proposed, accepted,
        deprecated и superseded. Продукт использует русские формы «Предложено»,
        «Принято», «Устарело» и «Заменено».
      - >-
        Статус «Отклонено» добавлен решением владельца (ADR-0003, 2026-07-13),
        чтобы отличать рассмотренное и не принятое предложение от ожидающего и
        ранее действовавшего решения; это расширение, а не утверждение ADRG.
    collisions:
      - >-
        Не путать «Отклонено» с «Устарело»: отклонённое предложение никогда не
        действовало, устаревшее решение раньше было принято.
      - >-
        Не оставлять отклонённое предложение в статусе «Предложено»: предложение
        уже рассмотрено.

  - id: architectural-decision-record
    primary_ru: запись архитектурного решения (ADR)
    forms_ru: [запись архитектурного решения, запись ADR, ADR]
    forms_en: [architectural decision record, ADR]
    authority: ADRG
    defined_by: [ADRG-001, SAHP-007]
    cite_as: [ADRG, SAHP]
    covered_in:
      - ait-decisions/references/decision-workflow.md
      - ait-decisions/references/decision-templates.md
      - ait-architecture/SKILL.md
    synonyms_by_source:
      ADRG: Architectural Decision Record (ADR)
      SAHP: запись ADR (Контекст/Решение/Последствия)
    reconciliation:
      - SAHP и ADRG описывают один формат; книжный — усечённый Nygard (без поля
        статуса и без секции проверки).
    collisions:
      - не путать с самим решением (AD) — ADR это запись о решении.
      - вид обобщённого понятия «запись решения» (decision-record); общая
        дисциплина записи — в ait-decisions.

  - id: architectural-decision
    primary_ru: архитектурное решение
    forms_en: [architectural decision, AD]
    authority: ADRG
    defined_by: [ADRG-002]
    cite_as: [ADRG]
    covered_in:
      - ait-decisions/references/decision-workflow.md
    synonyms_by_source:
      ADRG: Architectural Decision (AD)
    collisions:
      - не путать с записью решения (ADR) и с организационным решением (ODR в
        decision-workflow.md).

  - id: architecturally-significant-requirement
    primary_ru: архитектурно значимое требование
    forms_en: [architecturally significant requirement, ASR]
    authority: ADRG
    defined_by: [ADRG-002]
    cite_as: [ADRG, G250]
    covered_in:
      - ait-decisions/references/decision-workflow.md
    synonyms_by_source:
      ADRG: Architecturally Significant Requirement (ASR)
    reconciliation:
      - ASR (ADRG) пересекается с «характеристикой качества» из G250 (G250-001) и
        с требованиями из навыков требований; это не противоречие. В продукте ASR
        используется как требование, влияющее на архитектуру, а измеримые
        характеристики качества берутся из G250.
    collisions:
      - частичное совпадение с «характеристикой качества» — не заводить как два
        разных понятия.

  - id: nygard-adr-template
    primary_ru: шаблон Найгарда
    forms_ru: [шаблон Найгарда]
    forms_en: [Nygard, Nygard ADR]
    authority: ADRG
    defined_by: [ADRG-005, SAHP-007]
    cite_as: [ADRG, SAHP]
    covered_in:
      - ait-decisions/references/decision-templates.md
    synonyms_by_source:
      ADRG: Nygard
      SAHP: формат ADR книги (Контекст/Решение/Последствия)
    reconciliation:
      - формат ADR из SAHP соответствует шаблону Nygard; ADR книги — усечённый
        Nygard.

  - id: architectural-quantum
    primary_ru: архитектурный квант
    forms_en: [architectural quantum]
    authority: SAHP
    defined_by: [SAHP-014]
    cite_as: [SAHP]
    covered_in:
      - ait-architecture/references/distributed-tradeoffs.md
    synonyms_by_source:
      SAHP: архитектурный квант

  # Простые определения ключевых понятий из SAHP, глава 1, раздел
  # «Архитектура и проектирование: определения должны быть простыми».

  - id: service
    primary_ru: сервис
    forms_en: [service]
    definition_ru: связанный набор функций, развёрнутый как независимый
      выполняемый файл.
    authority: SAHP
    defined_by: [SAHP-012]
    cite_as: [SAHP]
    synonyms_by_source:
      SAHP: сервис

  - id: coupling
    primary_ru: сопряжение
    forms_ru: [сопряжение]
    forms_en: [coupling]
    definition_ru: два артефакта сопряжены, если изменение одного может
      потребовать изменения другого для сохранения работоспособности.
    authority: SAHP
    defined_by: [SAHP-012]
    cite_as: [SAHP]
    covered_in:
      - ait-architecture/references/distributed-tradeoffs.md
      - ait-architecture/references/quality-criteria.md
      - ait-decisions/references/decision-workflow.md
    synonyms_by_source:
      SAHP: связанность
    reconciliation:
      - основная форма «сопряжение» — решение владельца (2026-06-29); источник
        SAHP использует «связанность». Производные формы следуют выбору
        (статическое и динамическое сопряжение).
      - навыки ait-architecture приведены к «сопряжению» (2026-06-29); в корпусе
        SAHP сохранена исходная форма «связанность».
    collisions:
      - не путать сопряжение (coupling) со связностью (cohesion) — это разные
        свойства.

  - id: cohesion
    primary_ru: связность
    forms_ru: [связность, высокая связность]
    forms_en: [cohesion]
    definition_ru: мера того, насколько логически связанные элементы модуля
      держатся вместе и относятся к одной ответственности; высокая связность —
      цель организации на всех уровнях.
    authority: CCMP
    defined_by: [CCMP-005, CLCD-015, DDDE-045]
    cite_as: [CCMP, CLCD, DDDE]
    covered_in:
      - ait-architecture/references/organization-principles.md
    synonyms_by_source:
      CCMP: связность
      CLCD: связность
      DDDE: связность
    reconciliation:
      - связность и сопряжение — парные, но разные свойства; высокая связность
        внутри модуля и слабое сопряжение между модулями достигаются вместе
        (CCMP-005, DDDE-045).
    collisions:
      - не путать связность (cohesion) с сопряжением (coupling).

  - id: single-source-of-truth
    primary_ru: единственное авторитетное представление знания (DRY)
    forms_ru: [
        единственное авторитетное представление знания,
        единый источник
        истины,
        принцип DRY,
      ]
    forms_en: [single source of truth, DRY, don't repeat yourself]
    definition_ru: у каждого знания должно быть одно авторитетное представление;
      различают истинное дублирование (элементы меняются всегда синхронно) и
      внешне похожие, но независимые элементы, которые опасно объединять.
    authority: CLAR
    defined_by: [CLAR-050, CLAR-020]
    cite_as: [CLAR]
    covered_in:
      - ait-architecture/references/organization-principles.md
    synonyms_by_source:
      CLAR: DRY
    reconciliation:
      - устранение дублирования применяется осторожно — объединять случайное
        (ложное) дублирование опасно, его потом трудно разделить (CLAR-050).
    collisions:
      - не считать любое внешнее сходство поводом к объединению; истинное
        дублирование определяется синхронностью изменений, а не похожестью.

  - id: component
    primary_ru: компонент
    forms_en: [component]
    definition_ru: архитектурный строительный блок (пакет, пространство имён,
      группировка файлов), решающий бизнес- или инфраструктурную задачу.
    authority: SAHP
    defined_by: [SAHP-012]
    cite_as: [SAHP]
    synonyms_by_source:
      SAHP: компонент

  - id: synchronous-interaction
    primary_ru: синхронное взаимодействие
    forms_en: [synchronous interaction]
    definition_ru: вызывающая сторона ждёт ответа, прежде чем продолжить.
    authority: SAHP
    defined_by: [SAHP-055]
    cite_as: [SAHP]
    synonyms_by_source:
      SAHP: синхронные взаимодействия

  - id: asynchronous-interaction
    primary_ru: асинхронное взаимодействие
    forms_en: [asynchronous interaction]
    definition_ru: вызывающая сторона не ждёт ответа; при необходимости
      уведомляется по отдельному каналу.
    authority: SAHP
    defined_by: [SAHP-055]
    cite_as: [SAHP]
    synonyms_by_source:
      SAHP: асинхронные взаимодействия

  - id: orchestration
    primary_ru: оркестрованная координация
    forms_ru: [организованная координация]
    forms_en: [orchestration]
    definition_ru: в рабочем процессе есть сервис, чья основная обязанность —
      координация процесса.
    authority: SAHP
    defined_by: [SAHP-055]
    cite_as: [SAHP]
    synonyms_by_source:
      SAHP: организованная (оркестрованная) координация

  - id: choreography
    primary_ru: хореографическая координация
    forms_en: [choreography]
    definition_ru: координация распределена между сервисами без выделенного
      координатора.
    authority: SAHP
    defined_by: [SAHP-055]
    cite_as: [SAHP]
    synonyms_by_source:
      SAHP: хореографическая координация

  - id: atomicity
    primary_ru: атомарность
    forms_en: [atomicity]
    definition_ru: все части рабочего процесса постоянно согласованы;
      противоположность — согласованность в конечном итоге.
    authority: SAHP
    defined_by: [SAHP-055]
    cite_as: [SAHP]
    synonyms_by_source:
      SAHP: атомарность

  - id: contract
    primary_ru: контракт
    forms_en: [contract]
    definition_ru: интерфейс между двумя частями ПО (вызовы методов или функций,
      удалённые вызовы, зависимости и подобное).
    authority: SAHP
    defined_by: [SAHP-040]
    cite_as: [SAHP]
    synonyms_by_source:
      SAHP: контракт

  - id: quality-model
    primary_ru: модель качества (ГОСТ Р ИСО/МЭК 25010)
    forms_en: [ISO/IEC 25010 quality model]
    definition_ru: модель качества систем и ПО из восьми характеристик
      (функциональная пригодность, производительность, совместимость, удобство
      использования, надёжность, защищённость, сопровождаемость, переносимость).
    authority: G250
    defined_by: [G250-001, G250-004]
    cite_as: [G250]
    covered_in:
      - ait-req-specification/references/quality-characteristics.md
    synonyms_by_source:
      G250: модель качества продукта (восемь характеристик)

  - id: maintainability
    primary_ru: сопровождаемость
    forms_en: [maintainability]
    definition_ru: результативность и эффективность, с которой систему можно
      модифицировать; подхарактеристики — модульность, многократное
      использование, анализируемость, модифицируемость, тестируемость.
    authority: G250
    defined_by: [G250-005, G250-001]
    cite_as: [G250, SAHP]
    covered_in:
      - ait-req-specification/references/maintainability-requirements.md
      - ait-architecture/references/quality-criteria.md
    synonyms_by_source:
      G250: сопровождаемость
      SAHP: сопровождаемость
    collisions:
      - не путать с «ремонтопригодностью» (подхарактеристика надёжности и
        оборудования, ГОСТ 27.002) и с «пригодностью решения».

  - id: deployability
    primary_ru: развёртываемость
    forms_en: [deployability]
    definition_ru: простота и частота независимого развёртывания (выпуск,
      обновление, длительность цикла); измеримая архитектурная характеристика.
    authority: SAHP
    defined_by: [SAHP-011, EVAR-027]
    cite_as: [SAHP, EVAR]
    covered_in:
      - ait-architecture/references/quality-criteria.md
      - ait-req-specification/references/quality-characteristics.md
    synonyms_by_source:
      SAHP: развёртываемость
      EVAR: развёртываемость
    reconciliation:
      - SAHP и EVAR трактуют развёртываемость как самостоятельную архитектурную
        характеристику; набор таких характеристик открыт и контекстен. В ГОСТ
        25010 (G250) самостоятельной развёртываемости нет — ближайшее
        «устанавливаемость» в составе переносимости, но deployability шире
        (независимое развёртывание, частота релизов, конвейер).
    collisions:
      - не сводить к «устанавливаемости» (installability) — это уже понятие.

  - id: scalability
    primary_ru: масштабируемость
    forms_en: [scalability]
    definition_ru: способность системы оставаться отзывчивой по мере нормального
      роста числа одновременно работающих пользователей в течение длительного
      времени.
    authority: SAHP
    defined_by: [SAHP-056]
    cite_as: [SAHP]
    covered_in:
      - ait-architecture/references/quality-criteria.md
      - ait-architecture/references/distributed-tradeoffs.md
    synonyms_by_source:
      SAHP: масштабируемость
    reconciliation:
      - самостоятельная архитектурная характеристика SAHP; в ГОСТ 25010 (G250)
        ближайшее — «ёмкость» в составе уровня производительности.
    collisions:
      - не путать с адаптируемостью к пиковым нагрузкам — масштабируемость про
        рост во времени, адаптируемость про мгновенные всплески.

  - id: adaptability-peak-load
    primary_ru: адаптируемость к пиковым нагрузкам
    forms_en: [adaptability, elasticity]
    definition_ru: способность системы оставаться отзывчивой при значительных
      мгновенных всплесках нагрузки; зависит от малого среднего времени запуска
      сервиса (MTTS) и мелкой детализации сервисов.
    authority: SAHP
    defined_by: [SAHP-056]
    cite_as: [SAHP]
    covered_in:
      - ait-architecture/references/quality-criteria.md
    synonyms_by_source:
      SAHP: адаптируемость
    reconciliation:
      - в SAHP «адаптируемость» — реакция на пиковые нагрузки (близко к
        эластичности). Это НЕ «адаптируемость» из ГОСТ 25010, где она —
        подхарактеристика переносимости (приспособление к разным средам).
        Поэтому в продукте используется уточняющая форма «адаптируемость к
        пиковым нагрузкам».
    collisions:
      - омонимия с «адаптируемостью» (переносимость, ГОСТ 25010) — это разные
        свойства.

  - id: availability
    primary_ru: готовность (доступность)
    forms_en: [availability]
    definition_ru: готовность системы к корректной работе в нужный момент.
    authority: G250
    defined_by: [G250-002]
    cite_as: [G250, SAHP]
    covered_in:
      - ait-reliability/SKILL.md
      - ait-req-specification/references/reliability-requirements.md
    synonyms_by_source:
      G250: готовность (availability)
      SAHP: доступность
    reconciliation:
      - подхарактеристика надёжности ГОСТ 25010; основная форма «готовность» по
        нормативу, SAHP использует «доступность». Покрыта навыком ait-reliability.

  - id: fault-tolerance
    primary_ru: отказоустойчивость
    forms_en: [fault tolerance]
    definition_ru: сохранение корректной работы системы при наличии дефектов или
      отказов.
    authority: G250
    defined_by: [G250-002]
    cite_as: [G250, DSCT]
    covered_in:
      - ait-reliability/SKILL.md
      - ait-reliability/references/concepts.md
      - ait-architecture/references/reliability.md
    synonyms_by_source:
      G250: отказоустойчивость

  - id: component-based-decomposition
    primary_ru: декомпозиция на основе компонентов
    forms_en: [component-based decomposition]
    definition_ru: разделение монолита на сервисы из компонентов (строительных
      блоков с чёткой ролью и операциями), а не из отдельных классов; выполняется
      шестью паттернами (глава 5 SAHP).
    authority: SAHP
    defined_by: [SAHP-058, SAHP-059, SAHP-063]
    cite_as: [SAHP]
    covered_in:
      - ait-architecture/references/decomposition.md
    synonyms_by_source:
      SAHP: декомпозиция на основе компонентов

  - id: tactical-forking
    primary_ru: тактическое ветвление
    forms_en: [tactical forking]
    definition_ru: подход к разделению слабо структурированного монолита («большой
      ком грязи») клонированием системы и удалением ненужного вместо извлечения
      частей; термин предложил Фаусто Де Ла Торре.
    authority: SAHP
    defined_by: [SAHP-058]
    cite_as: [SAHP]
    covered_in:
      - ait-architecture/references/decomposition.md
    synonyms_by_source:
      SAHP: тактическое ветвление

  - id: afferent-coupling
    primary_ru: афферентное сопряжение
    forms_ru: [Fan-in]
    forms_en: [afferent coupling, Ca]
    definition_ru: количество входящих связей с артефактом кода (компонентом,
      классом, функцией) — сколько других артефактов зависит от него.
    authority: SAHP
    defined_by: [SAHP-060]
    cite_as: [SAHP]
    covered_in:
      - ait-architecture/references/component-design.md
    synonyms_by_source:
      SAHP: афферентная связанность (Ca)
    reconciliation:
      - в продукте обозначается как Fan-in; в SAHP «афферентная связанность»;
        каноническая форма «афферентное сопряжение» (термин coupling сведён к
        «сопряжению»).

  - id: efferent-coupling
    primary_ru: эфферентное сопряжение
    forms_ru: [Fan-out]
    forms_en: [efferent coupling, Ce]
    definition_ru: количество исходящих связей артефакта кода с другими артефактами
      — от скольких других он зависит; неустойчивость I = Ce / (Ce + Ca).
    authority: SAHP
    defined_by: [SAHP-060]
    cite_as: [SAHP]
    covered_in:
      - ait-architecture/references/component-design.md
    synonyms_by_source:
      SAHP: эфферентная связанность (Ce)
    reconciliation:
      - в продукте обозначается как Fan-out; в SAHP «эфферентная связанность»;
        каноническая форма «эфферентное сопряжение».

  - id: fitness-function
    primary_ru: функция пригодности
    forms_en: [fitness function]
    definition_ru: любой механизм, объективно оценивающий целостность архитектурной
      характеристики или их комбинации; превращает заявленное свойство в
      проверяемый автоматический (или ручной) контроль.
    authority: SAHP
    defined_by: [SAHP-008, SAHP-061, SAHP-062]
    cite_as: [SAHP, EVAR]
    covered_in:
      - ait-architecture/references/quality-criteria.md
      - ait-architecture/references/evolutionary-architecture.md
      - ait-code-testing/SKILL.md
    synonyms_by_source:
      SAHP: функция пригодности
      EVAR: функция пригодности
    collisions:
      - омонимия в русском — «ремонтопригодность», «пригодность решения», «оценка
        пригодности» это НЕ функции пригодности.

  - id: data-disintegration-drivers
    primary_ru: силы дезинтеграции данных
    forms_en: [data disintegrators]
    definition_ru: силы, оправдывающие разделение базы данных (когда разделять) —
      управление изменениями, управление соединениями, масштабируемость,
      отказоустойчивость, архитектурные кванты, оптимизация типа базы данных.
    authority: SAHP
    defined_by: [SAHP-064]
    cite_as: [SAHP]
    covered_in:
      - ait-architecture/references/distributed-tradeoffs.md
    synonyms_by_source:
      SAHP: движущие силы дезинтеграции данных
    collisions:
      - не путать с силами дезинтеграции гранулярности сервисов (глава 7) — те про
        разделение сервисов, эти про разделение данных.

  - id: data-integration-drivers
    primary_ru: силы интеграции данных
    forms_en: [data integrators]
    definition_ru: силы, оправдывающие сохранение данных вместе (когда не
      разделять) — отношения в данных (внешние ключи, триггеры, представления) и
