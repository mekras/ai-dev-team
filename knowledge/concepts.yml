  - id: http-api
    primary: HTTP API
    primary_ru: HTTP API
    definition: Прикладной программный интерфейс, использующий HTTP и представления ресурсов.
    boundaries:
      includes: [JSON-over-HTTP API]
      excludes: [туннелирование RPC через HTTP, REST как архитектурный стиль]
    forms_ru: [JSON-over-HTTP API]
    forms_en: [HTTP API, JSON-over-HTTP API]
    authority:
      type: primary-source
      ref: APIB-113
    defined_by: [APIB-113, APIB-123]
    cite_as: [APIB, RADR]
    covered_in:
      - ait-architecture/references/api-design.md
    synonyms_by_source:
      APIB: HTTP API, JSON-over-HTTP API
      RADR: REST API
    reconciliation:
      - оси ортогональны, конфликта понятий нет — REST это архитектурный стиль
        (шесть ограничений Филдинга, APIB-121), HTTP это прикладной протокол.
        Коллизия только в словоупотреблении источников — RADR называет
        «REST API» тот же практический объект, который APIB называет «HTTP
        API» (правила URI, глаголов, статус-кодов и представлений поверх
        HTTP+JSON).
      - APIB сознательно избегает термина «REST API» из-за отсутствия у него
        консистентного определения (APIB-113, APIB-123); RADR использует
        «REST API» как основной термин. Основная форма в производных
        материалах — «HTTP API»; «REST API» допустим как разговорный синоним
        при цитировании RADR.
      - «HTTP API» — категория дизайна, а не транспорта — туннелирование
        вызовов процедур поверх HTTP (SOAP, JSON-RPC через POST) использует
        HTTP лишь как транспорт и HTTP API в смысле APIB не является.
      - >-
        RADR и APIB расходятся в размещении версии API: RADR не помещает версию
        в URI, а APIB помещает её в путь (APIB-138). RADR применяется только в
        проекте, который явно закрепил ресурсоориентированный REST-дизайн и
        RADR как свою конвенцию. В этой области приоритет имеют действующие
        спецификации HTTP (RFC 9110/9111), затем RADR в вопросах стиля и
        конвенций, затем APIB. Вне этой области действует основной для понятия
        источник APIB.
    collisions:
      - не путать «REST» как архитектурный стиль по Филдингу (шесть ограничений,
        APIB-121) с «REST API» как разговорным обозначением HTTP API
        (APIB-120, APIB-122).

  - id: domain-model
    primary: предметная модель
    primary_ru: предметная модель
    definition: Модель понятий предметной области, их поведения и правил.
    boundaries:
      includes: [предметные понятия, поведение и правила]
      excludes: [физическая схема БД, формат внешнего API, модель данных]
    forms_ru: [модель предметной области]
    forms_en: [domain model]
    authority:
      type: source-synthesis
      ref: DDRF-001, DDDE-002, A42D-001
    authority_note: >-
      DDRF и DDDE — авторские источники Эрика Эванса. A42D подтверждает место
      общей предметной модели в архитектурной документации.
    defined_by: [DDRF-001, DDRF-002, A42D-001, DDDE-002, DDDE-100]
    cite_as: [DDRF, DDDE, A42D]
    covered_in:
      - ait-architecture/references/domain-modeling.md
      - ait-architecture/references/data-modeling.md
    synonyms_by_source:
      DDRF: domain model
      DDDE: модель предметной области
      A42D: business or domain model
    reconciliation:
      - >-
        «Предметная модель» и «модель предметной области» обозначают один класс
        моделей. Основная короткая форма используется в продукте, а полная
        форма допустима при первом определении.
      - >-
        A42D рассматривает место модели в архитектурном документе, а DDRF и
        DDDE раскрывают её смысл и границы. Эти положения дополняют друг друга.
    collisions:
      - >-
        Не путать с моделью данных. Предметная модель выражает выбранные
        понятия, поведение и правила, а модель данных отдельно показывает
        структуру данных и отношения.
      - >-
        Не путать с физической схемой базы данных или форматом внешнего API.

  - id: data-model
    primary: модель данных
    primary_ru: модель данных
    definition: Представление структуры данных, их типов, отношений и ограничений.
    boundaries:
      includes: [концептуальная, логическая и физическая модель данных]
      excludes: [полная предметная модель, диаграмма без ограничений]
    forms_ru:
      - концептуальная модель данных
      - логическая модель данных
      - физическая модель данных
    forms_en:
      - data model
      - conceptual data model
      - logical data model
      - physical data model
    authority:
      type: source-synthesis
      ref: DMAV-001, A42D-002
    authority_note: >-
      DMAV определяет уровни и архитектурную роль модели данных. A42D
      подтверждает логическую модель данных как минимальный архитектурный обзор.
    defined_by:
      - DMAV-001
      - DMAV-003
      - DMAV-004
      - DMAV-005
      - A42D-002
      - A42D-004
    cite_as: [DMAV, A42D, UMOC]
    covered_in:
      - ait-architecture/references/data-modeling.md
      - ait-architecture/references/architecture-documentation.md
    synonyms_by_source:
      DMAV: data model и conceptual, logical, physical data model
      A42D: business or domain data model и logical data model
      UMOC: модель из типизированных свойств, отношений и ограничений
    reconciliation:
      - >-
        Основная форма обозначает класс представлений структуры данных. Уровень
        модели всегда называется отдельно, когда от него зависит состав или
        применимость сведений.
      - >-
        Форма arc42 «business or domain data model» относится к
        концептуальному или логическому обзору и не превращает модель данных в
        полную предметную модель DDD.
    collisions:
      - >-
        Не путать концептуальную и логическую модель с физической схемой.
        Таблица, столбец или поле JSON могут быть только отображением понятия.
      - >-
        Не считать диаграмму без типов, кратностей и ограничений достаточной
        логической моделью данных.

  - id: model-property
    primary: свойство модели
    primary_ru: свойство модели
    definition: Типизированное свойство элемента модели с семантикой и ограничениями.
    boundaries:
      includes: [атрибут сущности, свойство JSON, столбец как отображение]
      excludes: [один технический тип без предметного смысла]
    forms_ru: [атрибут сущности, свойство данных, столбец]
    forms_en: [property, attribute, column]
    authority:
      type: source-synthesis
      ref: UMOC-001, DMAV-004
    authority_note: >-
      UMOC нормативно определяет типизированное свойство. DMAV связывает
      атрибут сущности с типом и ограничениями, JSVL и SQLT показывают его
      технические отображения.
    defined_by:
      - DMAV-004
      - UMOC-001
      - UMOC-002
      - UMOC-003
      - JSVL-001
      - JSVL-002
      - SQLT-001
      - SQLT-005
    cite_as: [UMOC, DMAV, JSVL, SQLT]
    covered_in:
      - ait-architecture/references/data-modeling.md
    synonyms_by_source:
      DMAV: attribute of an entity
      UMOC: Property и TypedElement
      JSVL: property экземпляра JSON
      SQLT: column
    reconciliation:
      - >-
        «Свойство модели» — нейтральная форма. «Атрибут сущности», свойство
        JSON и столбец относятся к разным уровням и считаются отображениями
        только при явной прослеживаемой связи.
      - >-
        Спецификация свойства включает не только технический тип, но и смысл,
        обязательность, кратность и ограничения допустимых значений.
    collisions:
      - >-
        Не считать `string`, `number` или объявленный тип столбца полным
        предметным типом свойства.
      - >-
        Не путать отсутствующее значение, пустое значение и значение по
        умолчанию.

  - id: user-goal
    primary: пользовательская цель
    primary_ru: пользовательская цель
    definition: Конечное состояние, которого конкретный пользователь стремится достичь.
    boundaries:
      includes: [цель пользователя, персонажа или основного действующего лица]
      excludes: [задача, функция, инструмент, техническое свойство]
    forms_ru:
      - цель пользователя
      - цель персонажа
      - цель основного действующего лица
    forms_en:
      - user goal
      - persona goal
      - primary actor goal
    authority:
      type: source-synthesis
      ref: INMA-008, SMFR-001
    authority_note: >-
      INMA определяет цель в целеориентированном проектировании, а
      SMFR связывает цель действующего лица с вариантом использования.
    defined_by:
      - INMA-008
      - INMA-013
      - INMA-016
      - INMA-018
      - INMA-024
      - INMA-026
      - SMFR-001
      - SMFR-003
    cite_as: [INMA, SMFR]
    covered_in:
      - ait-ux-design/SKILL.md
      - ait-ux-design/references/user-goals.md
    synonyms_by_source:
      INMA: цель пользователя и цель персонажа
      SMFR: цель основного действующего лица
    reconciliation:
      - >-
        В целеориентированном проектировании цель описывает конечное
        состояние для конкретного персонажа. В варианте использования та же
        цель задаёт уровень и направление сценария. Эти формы дополняют
        друг друга, но не делают любой шаг сценария отдельной целью.
      - >-
        Личные, практические и корпоративные цели описывают разные
        оси. Они не образуют иерархию шагов и не заменяют проверку уровня цели.
    collisions:
      - >-
        Не путать с задачей, функцией, инструментом или техническим свойством.
        Они могут быть средствами достижения, но не конечным состоянием.
      - >-
        Не путать с целью проекта, архитектурным Goal, корпоративной целью
        или целью команды. Они могут влиять на продукт, но не описывают конечное
        состояние для конкретного пользователя.
    relationships:
      - type: co_defines
        target: persona
