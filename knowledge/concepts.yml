  - id: coupling
    primary: сопряжение
    primary_ru: сопряжение
    definition: Степень зависимости одного модуля или компонента от другого.
    boundaries:
      includes: [межмодульная зависимость]
      excludes: [связность элементов внутри одного модуля]
    forms_ru: [сопряжение]
    forms_en: [coupling]
    authority:
      type: primary-source
      ref: SAHP-012
    defined_by: [SAHP-012]
    cite_as: [SAHP]
    covered_in:
      - ait-architecture/references/distributed-tradeoffs.md
      - ait-architecture/references/quality-criteria.md
      - ait-decisions/references/decision-workflow.md
    synonyms_by_source:
      SAHP: связанность
    reconciliation:
      - основная форма «сопряжение» отделяет coupling от cohesion, для которого
        закреплена форма «связность». Источник SAHP использует «связанность»;
        она сохраняется как форма источника, но не переносится в производные
        материалы из-за коллизии.
      - производные формы «статическое сопряжение» и «динамическое сопряжение»
        сохраняют это различение.
    collisions:
      - не путать сопряжение (coupling) со связностью (cohesion) — это разные
        свойства.

  - id: cohesion
    primary: связность
    primary_ru: связность
    definition: Степень смысловой и функциональной близости элементов внутри модуля.
    boundaries:
      includes: [внутренняя согласованность модуля]
      excludes: [зависимость между модулями]
    forms_ru: [связность, высокая связность]
    forms_en: [cohesion]
    authority:
      type: source-synthesis
      ref: CCMP-005, CLCD-015, DDDE-045
    defined_by: [CCMP-005, CLCD-015, DDDE-045]
    cite_as: [CCMP, CLCD, DDDE]
    covered_in:
