name: ai-dev-team
version: 0.20.1
description: Команда агентной разработки ПО
author: mekras
license: MIT
targets:
  - claude
  - codex
type: hybrid
includes: auto
dependencies:
  apm:
    - mekras/ai-russian-language#^2.0.0
    - mekras/ai-agent-supervisor#^2.0.0
    - mekras/project-knowlege-corpus#^0.14.2
scripts:
  tests: >-
    sh -c 'set -e; target="${APM_EVAL_PATH:-.apm/skills}";
    validators=".agents/skills/ai-setup-apm/scripts/eval-tools";
    python3 tools/validate-apm-package-structure.py;
    python3 tools/validate-requirements-structure.py;
    python3 tools/run-product-evals.py --validate;
    python3 -m unittest tools/test_product_evals.py;
    python3 .agents/skills/kc-inventory/scripts/validate-corpus-layout.py
    knowledge --strict-statements;
    python3 tools/validate-knowledge-operational.py;
    python3 "$validators/validate-hidden-unicode.py" .apm;
    python3 "$validators/validate-skill-descriptions.py" "$target";
    python3 "$validators/validate-trigger-evals.py" "$target" --require-all;
    PYTHONDONTWRITEBYTECODE=1
    python3 "$validators/validate-skill-result-evals.py" "$target";
    python3 "$validators/validate-portable-corpus-references.py" "$target";
    npm run lint:md; apm compile --validate --local-only --target codex;
    apm compile --validate --local-only --target claude;
    apm pack --dry-run'
  evals: >-
    python3 .agents/skills/ai-setup-apm/scripts/eval-tools/run-skill-evals.py
    "${APM_EVAL_PATH:-.apm/skills}"
  product-evals: >-
    python3 tools/run-product-evals.py
