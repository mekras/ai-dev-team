        semantic_review: Агент, принявший kc-pipeline, через профильный навык
          стадии. Требования независимой проверки сохраняются.
        strong_review: Агент, принявший kc-pipeline, через профильный навык стадии.
          Требования независимой проверки сохраняются.
        corroboration: Агент, принявший kc-pipeline, через профильный навык стадии.
