product: mekras/ai-dev-team
applied_version: 0.29.7
updated_at: 2026-10-19
setup:
  operating_context:
    kind: mixed
  project_profile:
    forms:
      - ai-agent-team
      - apm-collection
      - project-documentation
    users:
      - software-project-owner
      - software-developer
      - ai-dev-team-contributor
    interfaces:
      - agent-chat
      - cli
    delivery:
      - published-apm-package
      - local-project-installation
  visibility: public
  git:
    enabled: true
  commit_messages:
    scheme: pro-git
  changelog:
    status: present
    path: CHANGELOG.md
  decision_records:
    status: present
    journals:
      - kind: ADR
        path: docs/06-architecture/adr/
        record_pattern: NNNN-<slug>.md
        index: docs/06-architecture/adr/README.md
  knowledge:
    status: present
    path: knowledge/
  impact_graph:
    status: present
    path: .ai-dev-team/project-impact.json
    schema_version: 2
  interface_checks:
    level: recommended
  sdd:
    status: adopted
    level: aligned
    scope: [product-behavior, external-contracts]
    specification_paths:
      - docs/01-concept/**
      - docs/02-use-cases/**
      - docs/05-requirements/**
      - docs/06-architecture/adr/**
    derived_paths:
      - .apm/**
      - tools/**
    approval: before-implementation
    exception_policy:
      path_pattern: .ai-dev-team/exceptions/<exception-id>.md
      required_fields: [reason, owner, scope, expires_at, reconciliation_condition]
    review_condition: >-
      systematic-false-blocks-or-specification-maintenance-cost-exceeds-benefit
  license:
    author: Михаил Красильников
    identifier: MIT
  review:
    checked_at: '2026-10-19'
    status: complete
    method: Самопроверка основным агентом.
    directions:
    - name: рабочий контекст проекта
      status: сделано
      basis: Ранее принятое решение setup.operating_context.
      evidence: '.ai-dev-team/state.yml: setup.operating_context, прочитано 2026-10-19.'
      limitations: []
    - name: профиль проекта
      status: сделано
      basis: Ранее принятое решение setup.project_profile.
      evidence: '.ai-dev-team/state.yml: setup.project_profile, прочитано 2026-10-19.'
      limitations: []
    - name: концепция проекта и указатель
      status: сделано
      basis: Повторная настройка по ait-setup.
      evidence: 'ait-docs-concept: docs/01-concept/README.md содержит проблему,
        цель, способ достижения и результат. AGENTS.md однозначно указывает этот
        файл. Смысл не изменён.'
      limitations: []
    - name: README.md
      status: сделано
      basis: Сверка существующего README по ait-readme.
      evidence: Основной читатель — владелец проекта или разработчик, подключающий
        команду агентов. README задаёт название и назначение, предпосылку APM,
        команды подключения для Codex и Claude, первое действие «Настрой проект»,
        примеры работы и обновления. Версия 0.29.7 совпадает с apm.yml. Локальные
        ссылки существуют, противоречия с концепцией не выявлены. Правки не потребовались.
      limitations:
      - Удалённая установка пакета в новый проект в рамках этой сверки не выполнялась.
    - name: правила для агентов и клиентские инструкции
      status: сделано
      basis: Согласованный пользователем перенос двух разделов без изменения правил.
      evidence: 'ai-agents-md-maintenance: два раздела перенесены в .ai-dev-team/subagents.md.
        AGENTS.md — 19 405 байт, обязательное чтение процедуры стоит до маршрутизации.
        Сравнение с исходным файлом подтвердило сохранение обоих разделов с изменением
        только пробельных переносов. Правила Git, выпуска и ограничений не изменены.
        Самопроверка ai-audit-agent-rules охватила порядок чтения, области, конфликты,
        ссылки и связь CLAUDE.md → AGENTS.md. Замечаний в охвате нет. migrate-subagent-policy.py
        --check распознаёт адаптацию v2 и не требует изменений.'
      limitations:
      - Проверены файлы и распознавание адаптации штатным средством. Применение
        загрузчика в новой корневой сессии не наблюдалось.
    - name: журнал изменений
      status: сделано
      basis: Повторная настройка по ait-setup.
      evidence: 'ait-changelog: CHANGELOG.md содержит актуальную версию 0.29.7.
        Сверены записи 0.29.5–0.29.7 и правило обновления журнала в AGENTS.md.
        Текущая настройка восстанавливает рабочие копии инструментов без изменения
        поставляемого продукта. Проверены все пропущенные версии 0.29.2–0.29.7.
        Требования к fallback, writes и входному протоколу выполнены.'
      limitations: []
    - name: журналы решений
      status: сделано
      basis: Повторная настройка по ait-setup.
      evidence: 'ait-decisions: проверены указатель и все 19 записей ADR. Ссылки
        ведут к существующим записям, статусы присутствуют. Область журнала соответствует
        архитектуре ai-dev-team и концепции проекта.'
      limitations: []
    - name: корпус знаний
      status: сделано
      basis: Настройка существующего корпуса по kc-setup и проверка границ его
        применения по kc-validation.
      evidence: 'Проверены допуск по принятому решению 2026-10-13, 102 карточки
        источников, стадии 434 единиц, статусы 1731 утверждения и слой из 55 понятий.
        Темы источников соответствуют профилю продукта. Содержательная сверка
        выборочных утверждений выявила сохранённые ограничения GNU GPL FAQ и различную
        область исследований об инструкциях агентов. Все 15 очередей имеют исполнителей.
        Непустые примеры fetch, transcribe и source_check выполнены в изолированном
        каталоге, реальные данные корпуса не изменялись. traceability проверена
        на непустом корпусе. Строгая проверка структуры, утверждений, понятий,
        верификации и допуска завершилась кодом 0: ошибок и блокеров нет. Найдены
        102 предупреждения ручного получения и 29 старых единиц без verification.yml.
        Операционная политика отдельно учитывает документированные совпадения
        проверки персональных сведений.'
      limitations:
      - Полная содержательная сверка 1731 утверждения с первоисточниками не выполнялась.
        Сохранены 1149 ready_for_review, 485 verified, 95 записей версии 2 с завершёнными
        processing_status и 2 needs_source_refresh по GNU GPL FAQ.
      - Снимки проверены локально. Удалённая актуальность всех источников не проверялась.
      - Для transcribe использован тестовый внешний исполнитель и настоящий валидатор.
        Модель Whisper и качество распознавания не испытывались.
      - 131 предупреждение договора не скрыто успешным кодом. Отсутствие verification.yml
        у старых единиц не означает ошибочности или актуальности материала.
    - name: разработка на основе спецификаций
      status: сделано
      basis: Повторная настройка по ait-setup.
      evidence: 'ait-sdd: сверены ADR 0015, setup.sdd и указатель AGENTS.md. Согласованы
        область, канонические пути спецификаций, производные пути, подтверждение
        до реализации и политика исключений. Принятый режим сохранён.'
      limitations:
      - Проверена настройка режима. Исполнение всех будущих задач этим не подтверждается.
    - name: граф влияния проекта и указатель
      status: сделано
      basis: Повторная настройка по ait-setup.
      evidence: 'Добавлен путь .ai-dev-team/subagents.md в вершину delivery. Проверка
        схемы 2 — без проблем. coverage: все 2571 пути сопоставлены. Указатель
        в AGENTS.md сохранён.'
      limitations: []
    - name: .gitignore
      status: сделано
      basis: Повторная настройка по ait-setup.
      evidence: git check-ignore подтвердил исключение .ai-dev-team/local, локальных
        и временных файлов knowledge, Python __pycache__ и apm_modules. Правила
        сверены с текущим расположением служебных данных.
      limitations: []
    - name: лицензия
      status: сделано
      basis: Повторная настройка по ait-setup.
      evidence: 'Сверены LICENSE, apm.yml и setup.license: MIT, автор Михаил Красильников,
        год 2026. Новое лицензирование не выбиралось.'
      limitations: []
    - name: подагенты
      status: сделано
      basis: Повторная настройка по ait-setup.
      evidence: Штатный install-codex-tools восстановил tools/run-execution-class
        и tools/subagents.local.toml.sample. Проверка дрейфа всего комплекта —
        код 0. Прошли 5 автономных проверок ограничений записи и 23 контрактных
        сценария. Действующая локальная политика проверялась 2026-09-25, следующая
        плановая проверка — 2026-10-25.
      limitations:
      - Модельные испытания и повторная оценка назначений не проводились.
    - name: индекс Git, сообщения коммитов и проверки
      status: сделано
      basis: Повторная настройка по ait-setup.
      evidence: 'AGENTS.md: все неигнорируемые изменения добавляются в индекс,
        сообщения по Pro Git. apm audit --ci — 0. apm run tests — 0, 251 основной
        тест, 36 тестов сценариев, 51 контрактный сценарий. git diff --cached
        --check — 0.'
      limitations:
      - Модельные прогоны не выполнялись. Зелёные проверки не подтверждают качество
        модельного исполнения.
    - name: оснастка публикуемой коллекции APM
      status: сделано
      basis: Профиль проекта включает apm-collection.
      evidence: install-eval-tools обновил две отличавшиеся копии. Полный комплект
        совпадает с манифестом ai-setup-apm. apm run tests — 0, включая компиляцию
        инструкций и apm pack --dry-run.
      limitations:
      - Успех детерминированных проверок не подтверждает модельное исполнение.
    - name: применимость проверок интерфейса
      status: сделано
      basis: Сохранён принятый уровень recommended и действующие правила AGENTS.md.
      evidence: В ходе настройки изменены локальные инструкции, копии инструментов
        и учёт состояния. Для инструментов выполнены контрактные сценарии и полный
        apm run tests. Изменений пользовательского интерфейса продукта не было.
      limitations:
      - Работа диалогового протокола в новой корневой сессии не испытывалась.
    knowledge_operations:
      mechanical:
        fetch:
          executor: python3 tools/fetch-knowledge-queue.py
          input: явно выбранная единица, fetch_url и разрешённая copy_policy
          result: fragment.html и стадия fetched
          write_scope: knowledge/data/<source>/items/<item> и items.yml источника
          repeat: обработанная стадия пропускается
          evidence: непустой запуск CLI через локальный HTTP и безопасный повтор,
            код 0
        transcribe:
          executor: python3 tools/transcribe-knowledge-queue.py
          input: needs_transcript и ровно одна локальная медиа-запись
          result: transcript.txt, проверка валидатором, стадия raw_transcribed
          write_scope: единица и items.yml источника
          repeat: обработанная стадия пропускается
          evidence: непустой CLI с тестовым исполнителем, штатным валидатором
            и повтором, код 0
        traceability:
          executor: python3 tools/check-knowledge-index.py
          input: отслеживаемые данные непустого корпуса
          result: совпадение производных указателей
          write_scope: нет, при --write только knowledge/index
          repeat: детерминированная пересборка
          evidence: проверка текущего корпуса, код 0; сценарии дрейфа и повторной
            пересборки прошли в apm run tests
        source_check:
          executor: python3 tools/check-knowledge-sources.py
          input: публичные адреса карточек источников
          result: доступность адреса и причины отказа
          write_scope: .ai-dev-team/local/reports
          repeat: новое наблюдение без записи в источники
          evidence: реальные ответы локального HTTP 200 и 404 классифицированы
            правильно
        corpus_validation:
          executor: python3 tools/validate-knowledge-operational.py
          input: knowledge и operational-check.yml
          result: сводка ошибок, блокеров и документированных исключений
          write_scope: нет
          repeat: проверка не меняет данные
          evidence: код 0, 0 ошибок договора, 0 блокеров, 638 документированных
            подавлений
      semantic:
