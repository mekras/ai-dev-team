        apply_changes: Агент, принявший kc-pipeline, через профильный навык стадии.
          Требования независимой проверки сохраняются.
      boundary: Выполнена настройка исполнителей и проверка их договоров. Полный
        проход обработки содержимого корпуса этим запуском не объявлялся.
    version_review:
      from: 0.29.1
      to: 0.29.7
      evidence: 'CHANGELOG.md: применены действия при обновлении 0.29.2, 0.29.5
        и 0.29.6. Остальные версии в этом диапазоне не требуют дополнительных
