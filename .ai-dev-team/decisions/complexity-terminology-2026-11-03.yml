context: >-
  Концепция уже закрепляет управление сложностью как главный технический
  принцип продукта. Нужны согласованные сокращения для его обозначения.
decision: >-
  Использовать сокращение ГТИ для главного технического императива,
  УС — для управления сложностью. Содержание ГТИ продукта — УС.
consequences: >-
  Полные формы сохраняются при первом употреблении в самостоятельном тексте.
  Решение вводит терминологию и не утверждает изменение порядка работы.
