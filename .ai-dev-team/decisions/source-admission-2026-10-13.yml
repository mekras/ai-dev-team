decision: >-
  Сохранить допуск перечисленных существующих внешних источников корпуса
  в их нынешней области использования. Новые материалы требуют отдельного
  разрешения. Рабочие разговоры с агентом запрещены как источники, включая
  фрагменты и пересказы. Ограничения доступа, копирования и обработки
  каждого источника продолжают действовать.
