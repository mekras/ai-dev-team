status: accepted
decided_by: Пользователь ai-dev-team
decided_at: 2026-11-19
scope:
  concepts:
    - use-case-launch-condition
    - use-case-any-outcome-guarantee
    - use-case-success-guarantee
    - use-case-branch
context: >-
  Названия разделов варианта использования из книги Коберна («Предусловия»,
  «Минимальные гарантии», «Расширения») не раскрывают назначение раздела
  читателю без знания методики. Один раздел в шаблонах и правилах продукта
  назывался по-разному.
decision: >-
  Во встроенном шаблоне, правилах и проверках продукта использовать формы
  «проверяемые условия запуска», «гарантии при любом исходе», «гарантии при
  успехе» и «возможные ответвления». Термины книги указывать один раз для
  связи с источником. Обработку ответвления записывать вложенными шагами
  с отдельным шагом итога.
consequences: >-
  Явно введённый проектный шаблон сохраняет свои названия. Требование
  закреплено в ФТ-73. Проверочный скрипт формата отложен.
